repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: thomas-active-folder-guard
        name: Thomas Active Folder Guard
        entry: python scripts/active_folders.py guard-staged --auto-claim-staged --require-explicit-agent
        language: system
        pass_filenames: false

      - id: thomas-precommit-skip-policy-gate
        name: Thomas Pre-commit Skip Policy Gate
        entry: python scripts/check_precommit_skip_policy.py
        language: system
        pass_filenames: false

      - id: thomas-plan-structure-gate
        name: Thomas Plan Structure Gate
        entry: python scripts/check_plan_structure_gate.py
        language: system
        pass_filenames: false

      - id: thomas-workboard-claims-gate
        name: Thomas Workboard Claims Gate
        entry: python scripts/check_workboard_claims.py --require-identity-metadata
        language: system
        pass_filenames: false

      - id: thomas-workboard-task-problems-gate
        name: Thomas Workboard Task Problems Gate
        entry: python scripts/check_workboard_task_problems.py
        language: system
        pass_filenames: false

      - id: thomas-workboard-changed-files-gate
        name: Thomas Workboard Changed Files Gate
        entry: python scripts/check_workboard_changed_files.py --staged --require-identity-metadata
        language: system
        pass_filenames: false

      - id: thomas-workboard-agent-claim-gate
        name: Thomas Workboard Agent Claim Gate
        entry: python scripts/check_workboard_agent_claim.py --enforce-staged-scope --enforce-parent-throughput --parent-target-workers 2 --parent-min-ready-suggestions 2
        language: system
        pass_filenames: false

      - id: thomas-workboard-issue-tool-smoke
        name: Thomas Workboard Issue Tool Smoke
        entry: python scripts/workboard_issue.py --help
        language: system
        pass_filenames: false

      - id: thomas-workboard-problem-record-smoke
        name: Thomas Workboard Problem Record Smoke
        entry: python scripts/workboard_problem_record.py --help
        language: system
        pass_filenames: false

      - id: thomas-workboard-audit-backstop-gate
        name: Thomas Workboard Audit Backstop Gate
        entry: python scripts/workboard_audit_backstop.py
        language: system
        pass_filenames: false

      - id: thomas-monolith-guard
        name: Thomas Monolith Guard
        entry: python scripts/check_monolith_guard.py --staged-only
        language: system
        pass_filenames: false

      - id: thomas-repo-hygiene-gate
        name: Thomas Repo Hygiene Gate
        entry: python scripts/check_repo_hygiene.py --no-require-clean-worktree
        language: system
        pass_filenames: false

      - id: thomas-repo-identity-gate
        name: Thomas Repo Identity Gate
        entry: python scripts/check_repo_identity.py
        language: system
        pass_filenames: false

      - id: thomas-repo-clean-worktree-gate
        name: Thomas Repo Clean Worktree Gate
        entry: python scripts/check_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: thomas-release-hygiene-gate
        name: Thomas Release Hygiene Gate
        entry: python scripts/check_release_hygiene.py
        language: system
        pass_filenames: false

      - id: thomas-release-update-gate
        name: Thomas Release Update Gate
        entry: python scripts/check_release_update_gate.py --no-include-untracked
        language: system
        pass_filenames: false

      - id: thomas-site-visual-proof-gate
        name: Thomas Site Visual Proof Gate
        entry: python scripts/check_site_visual_proof.py
        language: system
        pass_filenames: false

      - id: thomas-architecture
        name: Architecture fitness check
        entry: python -m pytest -p no:cacheprovider tests/test_architecture.py -x --tb=short -q
        language: system
        pass_filenames: false

      - id: thomas-auto-checks-quick
        name: Thomas Auto Checks (Quick)
        entry: python scripts/auto_checks.py --quick
        language: system
        pass_filenames: false
