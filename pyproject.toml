[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thomas"
version = "0.11.12"
description = "Autonomous AI execution platform for local and remote deployments"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "numpy>=1.26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
repl = ["prompt_toolkit>=3.0", "rich>=13.0"]
gpu = ["sentence-transformers>=3.0", "torch>=2.0"]
train = ["numpy>=1.26", "scikit-learn>=1.4"]
server = ["aiohttp>=3.9"]
mcp = ["mcp>=1.0"]
telegram = ["python-telegram-bot>=21.0"]
all = ["thomas[repl,gpu,train,server,mcp,telegram]"]

[project.scripts]
thomas = "thomas.cli.main:main"
thomas-server = "thomas.server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thomas*"]

[tool.setuptools.package-data]
"thomas" = ["server/web/*", "server/web/**/*", "autonomy/ui/*"]

[tool.pytest.ini_options]
norecursedirs = [
    ".venv",
    "runtime",
    ".inbox_extract*",
    "agent_vf",
    "agent_memory",
    "*.egg-info",
]
