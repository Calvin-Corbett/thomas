[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thomas-ai"
version = "0.14.70"
description = "Autonomous AI execution platform for local and remote deployments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Thomas Contributors"},
]
keywords = ["ai", "agent", "assistant", "llm", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx==0.27.2",
    "click==8.3.1",
    "numpy==2.2.6",
    "typer>=0.12",
    "requests>=2.32",
    "croniter>=6.0",
    "PyYAML>=6.0",
    "tomli==2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/thomas-ai-assistant/thomas"
Repository = "https://github.com/thomas-ai-assistant/thomas"
Issues = "https://github.com/thomas-ai-assistant/thomas/issues"

[project.optional-dependencies]
repl = ["prompt_toolkit>=3.0", "rich>=13.0"]
gpu = ["sentence-transformers>=3.0", "torch>=2.0"]
train = ["numpy>=1.26", "scikit-learn>=1.4"]
science = ["scipy>=1.14"]
travel = ["pytz>=2024.1"]
server = ["aiohttp==3.13.3", "fastapi>=0.115", "python-multipart>=0.0.20", "sqlalchemy>=2.0"]
mcp = ["mcp>=1.0"]
telegram = ["python-telegram-bot>=21.0"]
investigation = ["python-docx>=1.0", "pdfplumber>=0.10"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=5.0",
    "pip-audit>=2.8",
    "bandit[toml]>=1.7.10",
    "ruff>=0.8",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "jsonschema>=4.21",
    "watchdog>=4.0",
    "fastapi>=0.115",
    "scipy>=1.14",
    "pytz>=2024.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
]
all = ["thomas-ai[repl,gpu,train,science,travel,server,mcp,telegram,test]"]

[project.scripts]
thomas = "thomas.cli.main:main"
thomas-server = "thomas.server.__main__:main"
bootdoctor = "thomas.bootdoctor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thomas*"]
exclude = [
    "runtime*",
    "output*",
    "tmp*",
    "logs*",
    "tasks*",
    "archives*",
    "feature_requests*",
    "Inbox*",
    "inbox*",
]

[tool.setuptools.package-data]
"thomas" = ["server/web/*", "server/web/**/*", "autonomy/ui/*", "companion/policy_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    "runtime",
    ".inbox_extract*",
    "agent_vf",
    "agent_memory",
    "*.egg-info",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["thomas"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["tests", "runtime", "output", ".venv"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["thomas"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (let formatter handle it)
    "B905",   # zip strict (py310 compat)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["thomas"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

