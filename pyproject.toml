[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thomas-ai"
version = "0.11.78"
description = "Autonomous AI execution platform for local and remote deployments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "corbe"},
]
keywords = ["ai", "agent", "assistant", "llm", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "numpy>=1.26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/corbe/thomas"
Repository = "https://github.com/corbe/thomas"
Issues = "https://github.com/corbe/thomas/issues"

[project.optional-dependencies]
repl = ["prompt_toolkit>=3.0", "rich>=13.0"]
gpu = ["sentence-transformers>=3.0", "torch>=2.0"]
train = ["numpy>=1.26", "scikit-learn>=1.4"]
server = ["aiohttp>=3.9"]
mcp = ["mcp>=1.0"]
telegram = ["python-telegram-bot>=21.0"]
investigation = ["python-docx>=1.0", "pdfplumber>=0.10"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "ruff>=0.8",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "jsonschema>=4.21",
    "watchdog>=4.0",
]
all = ["thomas-ai[repl,gpu,train,server,mcp,telegram,test]"]

[project.scripts]
thomas = "thomas.cli.main:main"
thomas-server = "thomas.server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thomas*"]
exclude = [
    "runtime*",
    "output*",
    "tmp*",
    "logs*",
    "tasks*",
    "archives*",
    "feature_requests*",
    "Inbox*",
    "inbox*",
]

[tool.setuptools.package-data]
"thomas" = ["server/web/*", "server/web/**/*", "autonomy/ui/*", "companion/policy_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    "runtime",
    ".inbox_extract*",
    "agent_vf",
    "agent_memory",
    "*.egg-info",
]
