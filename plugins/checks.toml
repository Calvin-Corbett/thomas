# The checks plugin: the check before your card (thomas/server/precard) and its proof machinery (thomas/server/proof).
# Spec: docs/superpowers/specs/2026-10-29-kernel-plugins-fast-checks-design.md.
# tests = the tests that import this code and nothing of Thomas outside the kernel, this code and its needs, directly
# or through the test helpers they import (tests/test_plugins_stay_fenced.py holds that). Tests that also reach other
# parts of Thomas (30 on 2026-10-29: project storage, the ratchet, hand-in holds, the server's startup, the fixtures of
# test_a_change_is_checked_before_your_card.py, ...) are integration tests: they stay in the full check, which runs
# whenever a change reaches past one plugin.
# needs = every Thomas module outside the kernel this code still imports or needs loaded (measured 2026-10-29): each
# one is a debt that the carving replaces with a kernel seam, a moved function or a passed-in value, and the list
# only shrinks. openai_codex_oauth registers the ChatGPT token resolver the second look asks for; llm is the client
# the second look's test fakes stand in for.
# door = the only modules of this code that code outside it may touch (tests/test_nothing_reaches_past_a_plugins_door.py
# holds that): the two packages' own names, and three services used too widely to wrap. Whatever sits behind it can
# change with only this plugin's tests to answer for it. scripts/cage uses proof/environment.py and is pinned, so that
# one stays until a card.
name = "checks"
code = [
    "thomas/server/precard/**",
    "thomas/server/proof/**",
]
door = [
    "thomas/server/precard/__init__.py",
    "thomas/server/precard/clocks.py",
    "thomas/server/precard/review.py",
    "thomas/server/precard/workers.py",
    "thomas/server/proof/__init__.py",
    "thomas/server/proof/environment.py",
]
