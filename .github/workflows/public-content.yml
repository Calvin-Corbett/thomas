name: Public distribution content
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/forge/publish/content_check.py --root .
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/forge/publish/content_check.py --root . --archives dist
