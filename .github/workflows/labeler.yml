# PR labeler — apply labels to PRs based on changed file paths.
#
# Rules live in .github/labeler.yml. Runs on every PR open/sync to dev or main.
#
# Docs: https://github.com/actions/labeler

name: PR labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true  # remove labels when files no longer match
