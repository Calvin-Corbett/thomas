# Publish Thomas to PyPI when a version tag is pushed.
#
# How to release:
#   1. Update version in thomas/__init__.py and pyproject.toml
#   2. Commit: git commit -am "Release v0.12.0"
#   3. Tag:    git tag v0.12.0
#   4. Push:   git push && git push --tags
#
# The workflow automatically builds and publishes to PyPI.
# Consumers get the update automatically via thomas's auto-updater.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify package contents
        run: |
          echo "=== Built packages ==="
          ls -la dist/
          echo ""
          echo "=== Package contents (should NOT include runtime/, .thomas/, etc) ==="
          python -m zipfile -l dist/*.whl | head -50
          echo ""
          # Fail if personal data leaked into package
          if python -m zipfile -l dist/*.whl | grep -qE "(runtime/|\.thomas/|\.claude/|\.sqlite3)"; then
            echo "ERROR: Personal data found in package!"
            exit 1
          fi
          echo "Package is clean."

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing (no API token needed)
        # Configure at: https://pypi.org/manage/project/thomas-ai/settings/publishing/

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
