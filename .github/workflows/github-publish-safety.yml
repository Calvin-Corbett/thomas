name: GitHub Publish Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-publish-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,repl,test]"
          python -m pip install "cryptography>=42.0"

      - name: Publish preflight (deep)
        run: |
          python scripts/github_publish_preflight.py --deep --json --strict

      - name: Release hygiene gate
        run: |
          python scripts/check_release_hygiene.py
