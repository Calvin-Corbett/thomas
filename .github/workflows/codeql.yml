# CodeQL — GitHub's static security analysis.
#
# Free for public repos. Detects SQL injection, XSS, command injection,
# path traversal, hardcoded credentials, etc. Results show up in the
# Security tab → Code scanning alerts.
#
# GitHub CodeQL default setup is enabled for this repository. Running this
# advanced workflow on pull requests or pushes causes SARIF upload failures:
# "CodeQL analyses from advanced configurations cannot be processed when the
# default setup is enabled." Keep this workflow manual-only unless default
# setup is disabled in repository settings.
#
# Docs: https://docs.github.com/en/code-security/code-scanning

name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the "security-and-quality" suite — broader than default
          # but catches code-quality smells too.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
