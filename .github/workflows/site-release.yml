name: Site Release Safety

on:
  pull_request:
  push:
    branches: [dev, main, master]
  workflow_dispatch:

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve diff range
        id: diff
        working-directory: .
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA=""
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          echo "base=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head=${{ github.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Visual proof gate
        id: visualproof
        working-directory: .
        shell: bash
        run: |
          python3 scripts/check_site_visual_proof.py \
            --base "${{ steps.diff.outputs.base }}" \
            --head "${{ steps.diff.outputs.head }}" \
            --json > site-visual-proof-gate.json

          python3 - <<'PY'
          import json
          import os
          import sys

          path = "site-visual-proof-gate.json"
          data = json.load(open(path, "r", encoding="utf-8"))
          ui_changed = bool(int(data.get("ui_change_count", 0)))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ui_changed={'true' if ui_changed else 'false'}\n")

          if not bool(data.get("ok", False)):
              print("Site visual proof gate: FAIL")
              for msg in list(data.get("errors") or []):
                  print(f"- {msg}")
              sys.exit(1)

          print(f"Site visual proof gate: PASS (ui_changed={ui_changed})")
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        if: steps.visualproof.outputs.ui_changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Runtime visual verify
        if: steps.visualproof.outputs.ui_changed == 'true'
        working-directory: .
        run: node scripts/verify_site_visual_runtime.mjs --skip-build --output-dir output/site-visual-proof --report output/site-visual-proof/runtime-report.json

      - name: Upload runtime visual artifacts
        if: always() && steps.visualproof.outputs.ui_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-proof
          path: output/site-visual-proof/**
          if-no-files-found: error

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [site-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.THOMAS_SITE_DEPLOY_ENABLED == 'true'
    environment: preview
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview site
        run: npm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [site-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.THOMAS_SITE_DEPLOY_ENABLED == 'true'
    environment: production
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy production site
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
