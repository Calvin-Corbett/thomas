name: Robustness Gates

on:
  pull_request:
  push:

jobs:
  protocol-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,repl,test]"
          python -m pip install pytest pytest-asyncio pytest-aiohttp

      - name: Resolve diff range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Model onboarding gate
        run: |
          python scripts/check_model_onboarding_gate.py --base "${BASE_SHA}" --head "${HEAD_SHA}"

      - name: Module audit gate
        run: |
          python scripts/check_module_audit_gate.py --base "${BASE_SHA}" --head "${HEAD_SHA}"

      - name: Monolith guard gate
        run: |
          python scripts/check_monolith_guard.py

      - name: Repo hygiene gate
        run: |
          python scripts/check_repo_hygiene.py

      - name: Plan structure gate
        run: |
          python scripts/check_plan_structure_gate.py

      - name: Release update gate
        run: |
          python scripts/check_release_update_gate.py --base "${BASE_SHA}" --head "${HEAD_SHA}"

      - name: Release hygiene gate
        run: |
          python scripts/check_release_hygiene.py

      - name: Feature master sync gate
        run: |
          python scripts/sync_feature_master_list.py --check

      - name: Surface parity gate
        run: |
          python scripts/check_surface_parity.py

      - name: Feature catalog gate
        run: |
          python scripts/check_feature_catalog_gate.py

      - name: Competitive scope gate
        run: |
          python scripts/check_competitive_scope_gate.py

      - name: OpenClaw metric parity gate
        run: |
          python scripts/check_openclaw_metric_parity_gate.py

      - name: Chat control protocol gate
        run: |
          python scripts/check_chat_control_protocol.py

      - name: Protocol safety tests
        run: |
          python -m pytest -q tests/test_llm_openai_tool_compat.py
          python -m pytest -q tests/test_agent_loop_tool_policy.py
          python -m pytest -q tests/test_tool_registry_resolution.py
          python -m pytest -q tests/test_chat_controls.py
          python -m pytest -q tests/test_server_chat_controls.py
          python -m pytest -q tests/test_model_switching.py
          python -m pytest -q tests/test_agent_loop_autonomy.py
          python -m pytest -q tests/test_companion_policy_compliance.py
          python -m pytest -q tests/test_server_companion_api.py
          python -m pytest -q tests/test_openclaw_metric_parity_gate.py
          python -m pytest -q tests/prompt_pack/test_p127_gateway_restart_command.py
          python -m pytest -q tests/prompt_pack/test_p136_gateway_auth_policy_enforcement.py


  codebase-auto-checks:
    runs-on: ubuntu-latest
    needs: [protocol-parity]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,repl,test]"

      - name: Run full auto checks
        run: |
          python scripts/auto_checks.py --skip-gates

  security-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,repl,test]"
          python -m pip install pytest pytest-asyncio pytest-aiohttp

      - name: Security regression tests
        run: |
          python -m pytest -q -x tests/prompt_pack/test_p136_gateway_auth_policy_enforcement.py
          python -m pytest -q -x tests/prompt_pack/test_p127_gateway_restart_command.py
          python -m pytest -q -x tests/test_server_access_mode.py

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [protocol-parity, security-regression, codebase-auto-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t thomas-ci:${{ github.sha }} .

      - name: Import smoke
        run: |
          docker run --rm thomas-ci:${{ github.sha }} python -c "import thomas; print(thomas.__version__)"

