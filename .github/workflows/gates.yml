  # ────────────────────────────────────────────────────────────────────────
  # SECRET / LEAK GUARDS (highest-priority for public-facing branches)
  # ────────────────────────────────────────────────────────────────────────

  public-repo-leak-guard:
    name: public-repo-leak-guard
    runs-on: ubuntu-latest
    steps:
