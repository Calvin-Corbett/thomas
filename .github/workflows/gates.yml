name: Gates (server-side safety enforcement)

# Server-side mirror of the local pre-commit gate stack. Every gate here is
# also runnable locally via the .pre-commit-config.yaml hook chain, but those
# local hooks are bypassable by `git commit --no-verify`. This workflow is
# NOT bypassable: it runs on every PR to dev/main and every push to those
# branches, and the `gates-required` aggregator job is what the product owner marks as
# a "required status check" in branch protection. A commit that bypassed
# local hooks cannot reach dev/main if any gate here fails.
#
# Design notes:
#   - One job per gate so individual failures are visible in PR check list.
#   - Aggregator job `gates-required` depends on all of them — that's the
#     single check name the product owner marks as required in branch protection.
#   - BASE_SHA/HEAD_SHA resolution mirrors .github/workflows/robustness-gates.yml
#     for consistency.
#   - Worktree-local gates (worktree_branch_guard, worktree_rules_gate,
#     active_folders.py guard-staged, presence-related) are intentionally
#     NOT mirrored — they check process/worktree state that doesn't apply
#     on CI runners. Their server-side equivalent is the branch-protection
#     rule itself (PR review + signed commits).
#
# See docs/SAFETY_ARCHITECTURE.md for the full architecture.
# Refs: plans/thomas/problems/gate-architecture-2026-05-26/PROBLEM.md
# Task: gate-architecture-2026-05-26

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # PROTECTED-FILES + DELETION GATES (the choke point for safety files)
  # ────────────────────────────────────────────────────────────────────────

  protected-files-gate:
    name: protected-files-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomli pyyaml
      - name: Resolve diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Protected files gate
        run: python scripts/forge/gates/protected_files_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"

  protected-deletions-gate:
    name: protected-deletions-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve diff range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Protected deletion / rename guard
        run: python scripts/forge/gates/deletions.py --base "$BASE_SHA" --head "$HEAD_SHA"

  merge-resurrection-gate:
    name: merge-resurrection-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve diff range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: A dead file path cannot ride back in on a merge
        run: python scripts/forge/gates/merge_resurrection_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"

  dead-ref-gate:
    name: dead-ref-gate
    runs-on: ubuntu-latest
    # This is the CI-side documentation of the contract, not the enforcement
    # point: the real check runs as a LOCAL pre-push hook against every ref a
    # push is about to CREATE (see dead_ref_gate.py's module docstring). CI
    # never sees a pre-push stdin stream -- there is no "ref about to be
    # created" event in a GitHub Actions run, only a ref that already exists
    # (the PR branch or the pushed branch). So this job checks the one thing
    # CI *can* honestly check: whether THIS PR/push's own branch name is
    # itself a dead name, via the --ref argv fallback. Wiring the actual
    # pre-push hook entry into .pre-commit-config.yaml is deferred -- that
    # file is protected (agent_safety.toml) and requires the owner's tap; see
    # plans/thomas/tasks/PRAXIS-PHASE1-BREAKGLASS/batch.md (Task 5).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve this push/PR's own branch name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH_NAME=${{ github.head_ref }}" >> "$GITHUB_ENV"
          else
            echo "BRANCH_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      - name: A dead branch name cannot come back as this branch's own name
        run: python scripts/forge/gates/dead_ref_gate.py --ref "$BRANCH_NAME"

  branch-claim-gate:
    name: branch-claim-gate
    runs-on: ubuntu-latest
    # Same CI-side caveat as dead-ref-gate above: the real enforcement point
    # is a LOCAL pre-push hook that sees a ref about to be CREATED, which CI
    # cannot observe. This job checks the one thing CI can honestly check --
    # whether THIS PR/push's own branch name itself carries a live claim --
    # via the --ref argv fallback. Wiring the real pre-push hook entry into
    # .pre-commit-config.yaml is deferred: that file is protected
    # (agent_safety.toml) and requires the owner's tap.
    #
    # NOT YET in gates-required's `needs:` list -- deliberately, unlike
    # dead-ref-gate. dead-ref-gate's CI form is safe to require immediately:
    # an empty/no-match graveyard passes every branch by default. This gate
    # has the OPPOSITE polarity. Making it required is a real policy change
    # (every contributor's branch must be claimed before it can land), and
    # is queued as its own follow-up with its own reviewer sign-off (see
    # plans/thomas/tasks/PRAXIS-BRANCH-EQUILIBRIUM/status.md) -- not
    # something to flip silently by adding one line to a `needs:` array.
    #
    # STATE AS OF Task 4 (2026-08-27, updated in the fix wave that landed
    # after Task 4's own closure commit -- verify docs/ops/branch_claims.json
    # directly before trusting this comment's count, the same way this
    # branch_claim_gate.py). Any OTHER branch pushed today without a claim
    # still shows a red X here -- non-blocking (not in gates-required),
    # but genuinely enforcing: a present, non-empty-but-incomplete registry
    # is not infrastructure absence -- see branch_claims.py's docstring.
    # Local pre-push wiring (a .pre-commit-config.yaml hook calling this
    # same script) does not exist yet either -- that is a separate, named
    # tap item (PRAXIS-PHASE14-BREAKGLASS/batch.md section (k)), not
    # something this CI job substitutes for.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve this push/PR's own branch name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH_NAME=${{ github.head_ref }}" >> "$GITHUB_ENV"
          else
            echo "BRANCH_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      - name: An anonymous branch cannot reach a remote without a live claim
        run: python scripts/forge/gates/branch_claim_gate.py --ref "$BRANCH_NAME"

  # ────────────────────────────────────────────────────────────────────────
  # COMMIT-SHAPE GATES (bypass-targeted: these are the ones agents game)
  # ────────────────────────────────────────────────────────────────────────

  bulk-commit-guard:
    name: bulk-commit-guard
    runs-on: ubuntu-latest
