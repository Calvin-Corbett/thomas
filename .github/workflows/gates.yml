          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      # No --run-store-db here (recon #7b, phase 2 batch 1): the run_store
      # sqlite db is not a repo artifact -- it lives outside the checkout in
      # a per-machine data dir (thomas/core/config.py's THOMAS_RUNS_DB_PATH,
      # under the user's home), and is only ever populated by a LIVE Thomas
      # server processing real chat/workspace turns. A GitHub-hosted runner
      # never runs that server, so it can structurally never hold the run
      # this diff's evidence actually refers to. Wiring a fresh/empty db in
      # here would be worse than the status quo: every real run-kind claim
      # would flip from an honest UNAVAILABLE (reason_code=db_path_required)
      # PASS to a hard FAIL ("run not found"), since a throwaway CI db can
      # never contain a production run_id. The gate already prints that
      # reason_code by name in its UNAVAILABLE note -- see
      # workboard_evidence_gate.py's main(). If a CI-reachable run-store
      # ever exists (e.g. a synced read-only mirror), pass --run-store-db
      # here; until then this omission is the honest choice, not a gap.
      - name: A done transition cannot land without evidence that checks out
        run: python scripts/forge/gates/workboard_evidence_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"

