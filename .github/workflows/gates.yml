            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Bulk commit guard
        env:
          # The env-var bypass exists for now but PROBLEM.md flags it for removal.
          # Server-side this var is set to empty so the gate's full check runs.
          THOMAS_BULK_COMMIT_GUARD_DISABLE: ""
        run: python scripts/forge/gates/bulk_commit_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"

