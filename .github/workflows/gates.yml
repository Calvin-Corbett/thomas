        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Pass the CI-truth slug: this workflow runs on both the private dev repo
      # (calvin-corbett/thomas-dev) and the public repo (calvin-corbett/thomas).
      # The policy's allowed_repo_slugs list still forbids unlisted remotes, so
      # the anti-clone property is preserved (a fork/clone slug fails closed).
      - run: python scripts/forge/gates/repo_identity.py --expected-slug "$GITHUB_REPOSITORY"

  # ────────────────────────────────────────────────────────────────────────
  # SIGNED-COMMIT VERIFICATION (architecture layer 1 + 2 + 3 check)
  # ────────────────────────────────────────────────────────────────────────
  # This job verifies that commits on the head of a PR are signed. Without
  # this, a `--no-verify` commit (which produces an unsigned commit when
  # signing is configured) would slip past branch protection's "require
  # signed commits" rule by simply not signing. Branch protection's check
  # is a UI-level toggle; this job is the workflow-level enforcement.
  #
  # the product owner should ALSO enable "Require signed commits" in branch protection
  # for defense-in-depth — see docs/BRANCH_PROTECTION_SETUP.md.

  signed-commits-check:
    name: signed-commits-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify all PR commits are signed
        shell: bash
        run: |
          # GitHub signs web/API commits with its published GPG key.
          # Import it so local verification can authenticate those signatures.
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/web-flow.gpg --output "$RUNNER_TEMP/github-web-flow.gpg"
          gpg --batch --import "$RUNNER_TEMP/github-web-flow.gpg"
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # SSH-signed commits (gpg.format=ssh, this repo's standard per
          # docs/SIGNING_KEY_SETUP.md) can only be verified when git knows the
          # allowed signers. Without this, every SSH signature reports E/N on
          # the runner and the gate rejects ALL signed commits (2026-07-15).
          # NOTE (landing-lane hardening): docs/ops/allowed_signers and this
          # workflow are PR-editable judges — an attacker PR could add its own
          # key. Mitigation tracked in plans/thomas/PRODUCT_READY_PUSH_2026-07-15.md
          # (protect both files via agent_safety enforcement list + manifest).
          git config gpg.ssh.allowedSignersFile "$PWD/docs/ops/allowed_signers"
          unsigned=""
          for sha in $(git rev-list "$BASE..$HEAD"); do
            # %G? returns: G=good, U=good-untrusted, X=expired-signature,
            #              Y=expired-key, R=revoked-key, E=missing-key, B=bad,
            #              N=no-signature.
            # B18 (praxis-unbypassable-2026-05-29): accept ONLY G/U. The old
            # check rejected only N and B, so a commit with an expired (X/Y),
            # revoked (R), or missing-key (E) signature slipped through.
            status=$(git log -1 --format='%G?' "$sha")
            case "$status" in
              G|U) : ;;
              *) unsigned="$unsigned $sha[$status]" ;;
            esac
          done
          if [ -n "$unsigned" ]; then
            echo "::error::Unsigned or bad-signature commits detected on this PR:"
            for sha in $unsigned; do
              echo "  - $sha $(git log -1 --format='%s' "$sha")"
            done
            echo ""
            echo "All commits to dev/main must be signed. See docs/SIGNING_KEY_SETUP.md."
            echo "If you used 'git commit --no-verify', that flag does NOT skip signing —"
            echo "but if you ALSO didn't have signing configured, the commit is unsigned."
            echo "Configure signing per docs/SIGNING_KEY_SETUP.md and re-commit."
            exit 1
          fi
          echo "All PR commits are signed."

  # ────────────────────────────────────────────────────────────────────────
  # XFAIL DEBT ENFORCEMENT (P0-1 from 2026-05-27 senior review)
  # ────────────────────────────────────────────────────────────────────────
  # Fails if xfail count grows BASE..HEAD without a commit message trailer
  # `xfail-justified: <reason>`. The trailer is the agent's audit ledger:
  # one well-written line covers any number of new xfails in that commit.
  # See docs/XFAIL_POLICY.md for the full policy and triage guidance.

  xfail-growth-gate:
    name: xfail-growth-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve diff range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Xfail growth gate
        run: python scripts/forge/gates/xfail_growth_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # ────────────────────────────────────────────────────────────────────────
  # ENFORCEMENT INTEGRITY (anti-tamper for the gate scripts themselves)
  # ────────────────────────────────────────────────────────────────────────
  # Verifies every protected enforcement script hashes to the value in the
  # committed manifest (scripts/forge/gates/enforcement_manifest.json). If an
  # agent rewrote a gate to always-pass, the hash mismatch fails this job — and
  # because the manifest is a committed artifact, re-blessing it is a visible
  # diff that branch protection routes to CODEOWNERS review.

  enforcement-integrity:
    name: enforcement-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomli
      - name: Verify enforcement scripts match the committed manifest
        run: python scripts/forge/gates/enforcement_integrity.py

  # ────────────────────────────────────────────────────────────────────────
  # AGGREGATOR — single required-status-check name for branch protection
  # ────────────────────────────────────────────────────────────────────────
  # Mark this job (`gates-required`) as a required status check in
  # GitHub branch protection settings for both `dev` and `main`. It depends
  # on every gate above, so any one failing causes this aggregator to fail
  # too. the product owner only needs to mark ONE check as required.
  #
  # Per docs/BRANCH_PROTECTION_SETUP.md, navigate to:
  #   Settings → Branches → Branch protection rules → Edit (for dev/main)
  #   → "Require status checks to pass before merging"
  #   → search "gates-required" → check it
  # The signed-commits-check is also required but only fires on
  # pull_request events; for push-to-dev/main flows that bypass PR,
  # branch protection's "Require signed commits" toggle covers signing.

  gates-required:
    name: gates-required
    runs-on: ubuntu-latest
    needs:
      - protected-files-gate
      - protected-deletions-gate
      - merge-resurrection-gate
      - dead-ref-gate
      - bulk-commit-guard
      - commit-growth-guard
      - public-repo-leak-guard
      - monolith-guard
      - monolith-filename-guard
      - duplicate-filename-gate
      - circular-imports-gate
      - exception-handler-gate
      - workboard-claims-gate
      - workboard-task-problems-gate
      - workboard-changed-files-gate
      - workboard-evidence-gate
      - problem-closure-gate
      - changelog-gate
      - plan-structure-gate
      - repo-hygiene-gate
      - repo-identity-gate
      - xfail-growth-gate
      - enforcement-integrity
      - signed-commits-check
    if: always()
    steps:
      - name: Report aggregate result
        shell: bash
        run: |
          # Fail if any needed job failed or was cancelled.
          results='${{ toJSON(needs) }}'
          echo "Per-gate results:"
          echo "$results" | python3 -c "
          import json, sys
          data = json.loads(sys.stdin.read())
          failed = []
          for name, info in data.items():
              status = info.get('result', 'unknown')
              print(f'  {name}: {status}')
              if status not in ('success', 'skipped'):
                  failed.append(name)
          if failed:
              print()
              print(f'FAIL: {len(failed)} gate(s) did not pass: {\", \".join(failed)}')
              sys.exit(1)
          print()
          print('All required gates passed.')
          "
