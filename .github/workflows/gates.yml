      - run: python scripts/forge/gates/monolith_filename_guard.py --base "$BASE_SHA" --head "$HEAD_SHA"

  duplicate-filename-gate:
    name: duplicate-filename-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/forge/gates/duplicate_filename_gate.py

  circular-imports-gate:
    name: circular-imports-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
