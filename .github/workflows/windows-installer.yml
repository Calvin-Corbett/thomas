name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to, for example v0.14.62. Leave blank to build artifacts only."
        required: false
        default: ""
      version:
        description: "Installer version. Leave blank to infer from tag or pyproject.toml."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve installer metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = ""
          if ($env:EVENT_NAME -eq "release" -and -not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $tag = $env:RELEASE_TAG
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          } elseif ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          }

          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version) -and -not [string]::IsNullOrWhiteSpace($tag)) {
            $version = $tag -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $match = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "Could not infer installer version." }
            $version = [string]$match.Matches[0].Groups[1].Value
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $version"
          if ($tag) { Write-Host "Release tag: $tag" } else { Write-Host "No release tag supplied; artifacts only." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found after Inno Setup install."
          }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_windows_installer.ps1 -Version "${{ steps.meta.outputs.version }}"

      - name: Sign installer if certificate is configured
        id: sign
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $setupExe = Join-Path $PWD "dist\installer\ThomasSetup_$version.exe"
          if (-not (Test-Path $setupExe)) { throw "Installer was not built: $setupExe" }

          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD)
          ) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Code-signing secrets are not configured. Installer will be uploaded unsigned."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "thomas-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certPath,
              [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64)
            )

            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe was not found on the Windows runner." }

            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD $setupExe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }

            & $signtool verify /pa /v $setupExe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }

            "signed=true" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -Force $certPath -ErrorAction SilentlyContinue
          }

      - name: Smoke test installer
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $setupExe = Join-Path $PWD "dist\installer\ThomasSetup_$version.exe"
          if (-not (Test-Path $setupExe)) { throw "Installer was not built: $setupExe" }

          if ("${{ steps.sign.outputs.signed }}" -eq "true") {
            $signature = Get-AuthenticodeSignature $setupExe
            if ($signature.Status -ne "Valid") {
              throw "Signed installer signature is not valid: $($signature.Status)"
            }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "thomas-installer-smoke"
          $installLog = Join-Path $env:RUNNER_TEMP "thomas-installer-smoke-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "thomas-installer-smoke-uninstall.log"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue

          try {
            $install = Start-Process -FilePath $setupExe -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installDir",
              "/LOG=$installLog"
            ) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode). Log: $installLog" }

            $expectedFiles = @(
              "launch-thomas.vbs",
              "support.cmd",
              "scripts\first-run.cmd",
              "scripts\first_run_wizard.ps1",
              "scripts\run-ui.ps1"
            )
            foreach ($relativePath in $expectedFiles) {
              $path = Join-Path $installDir $relativePath
              if (-not (Test-Path $path -PathType Leaf)) { throw "Expected installed file is missing: $relativePath" }
            }

            $wizard = Join-Path $installDir "scripts\first_run_wizard.ps1"
            & powershell -NoProfile -ExecutionPolicy Bypass -File $wizard -ConfirmedInstallChanges -NoPrompt -NoLaunch -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "First-run wizard exited with code $LASTEXITCODE" }

            $expectedRuntimeFiles = @(
              ".venv\Scripts\python.exe",
              "runtime\setup\last_setup.txt",
              "runtime\logs\first_run_wizard.log"
            )
            foreach ($relativePath in $expectedRuntimeFiles) {
              $path = Join-Path $installDir $relativePath
              if (-not (Test-Path $path -PathType Leaf)) { throw "Expected runtime file is missing: $relativePath" }
            }
          } finally {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
                "/VERYSILENT",
                "/SUPPRESSMSGBOXES",
                "/NORESTART",
                "/LOG=$uninstallLog"
              ) -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) {
                Write-Warning "Uninstaller exited with code $($uninstall.ExitCode). Log: $uninstallLog"
              }
            }
            Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thomas-windows-installer-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            dist/installer/ThomasSetup_${{ steps.meta.outputs.version }}.exe
            dist/installer/Thomas_source_${{ steps.meta.outputs.version }}.zip

      - name: Upload release assets
        if: steps.meta.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" `
            "dist/installer/ThomasSetup_${{ steps.meta.outputs.version }}.exe" `
            --clobber
