name: Nightly Reliability

on:
  schedule:
    - cron: "15 09 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,repl,test]"
          python -m pip install pytest pytest-asyncio pytest-aiohttp ruff

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p artifacts/nightly_reliability

      - name: Soak baseline with failure injection
        shell: bash
        run: |
          python scripts/soak_runner.py \
            --command "python scripts/config_validator.py --json" \
            --iterations 60 \
            --interval-seconds 1 \
            --failure-command 'python -c "import sys; sys.exit(1)"' \
            --inject-failure-every 15 \
            --timeout-seconds 90 \
            --max-failure-rate 0.05 \
            --json > artifacts/nightly_reliability/soak_report.json

      - name: Perf baseline
        shell: bash
        run: |
          python scripts/perf_probe.py \
            --command "python scripts/config_validator.py --json" \
            --runs 30 \
            --timeout-seconds 90 \
            --min-success-rate 1.0 \
            --json > artifacts/nightly_reliability/perf_report.json

      - name: Onboarding outcomes + gate snapshots
        shell: bash
        run: |
          python scripts/onboarding_outcomes_report.py --days 7 --json > artifacts/nightly_reliability/onboarding_outcomes_report.json
          python scripts/forge/gates/onboarding_outcomes_gate.py --days 7 --json --strict --ignore-low-sample-warning > artifacts/nightly_reliability/onboarding_outcomes_gate.json
          python scripts/forge/gates/workboard_claims.py --require-identity-metadata --json > artifacts/nightly_reliability/workboard_claims_gate.json
          python scripts/forge/gates/workboard_changed_files.py --base HEAD~1 --head HEAD --require-identity-metadata --json > artifacts/nightly_reliability/workboard_changed_files_gate.json
          python scripts/crew/workboard/audit_backstop.py --json > artifacts/nightly_reliability/workboard_audit_backstop.json
          python scripts/crew/workboard/claim_cleanup.py --max-age-hours 72 --json > artifacts/nightly_reliability/workboard_claim_cleanup.json
          # Competitor freshness + weekly delta steps removed in the 2026-05-21
          # pre-public cleanup (artifacts referenced internal benchmarks).
          python scripts/crew/workboard/issue.py --help > artifacts/nightly_reliability/workboard_issue_tool_help.txt
          python scripts/module_audit_status.py --max-age-hours 24 --json > artifacts/nightly_reliability/module_audit_status_24h.json
          python scripts/focus_scorecard.py --days 7 --json > artifacts/nightly_reliability/focus_scorecard.json

      - name: Security posture snapshot
        shell: bash
        run: |
          python scripts/security_audit.py --repo-root . --json --strict > artifacts/nightly_reliability/security_audit.json

      - name: Build nightly summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/nightly_reliability")

          def load(name: str) -> dict:
              path = root / name
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          def load_exit_code(name: str) -> int | None:
              path = root / name
              try:
                  return int(path.read_text(encoding="utf-8").strip())
              except Exception:
                  return None

          soak = load("soak_report.json")
          perf = load("perf_report.json")
          gate = load("onboarding_outcomes_gate.json")
          audit_backstop = load("workboard_audit_backstop.json")
          changed_files_gate = load("workboard_changed_files_gate.json")
          claim_cleanup = load("workboard_claim_cleanup.json")
          module_audit = load("module_audit_status_24h.json")
          scorecard = load("focus_scorecard.json")
          security = load("security_audit.json")

          soak_summary = dict(soak.get("summary") or {})
          perf_summary = dict(perf.get("summary") or {})
          gate_summary = dict((gate.get("gate") or {}).get("summary") or {})
          sec_summary = dict(security.get("summary") or {})

          lines = [
              "# Nightly Reliability Summary",
              "",
              f"- soak total runs: {int(soak_summary.get('total_runs', 0))}",
              f"- soak failure rate: {float(soak_summary.get('failure_rate', 0.0)):.4f}",
              f"- perf p95 ms: {float(perf_summary.get('p95_ms', 0.0)):.3f}",
              f"- perf success rate: {float(perf_summary.get('success_rate', 0.0)):.4f}",
              f"- onboarding gate ok: {bool(gate.get('ok', False))}",
              f"- onboarding completion rate: {float(gate_summary.get('completion_rate', 0.0)):.4f}",
              f"- onboarding recovery success rate: {float(gate_summary.get('recovery_success_rate', 0.0)):.4f}",
              f"- onboarding median ready seconds: {float(gate_summary.get('median_time_to_ready_seconds', 0.0)):.3f}",
              f"- workboard audit backstop ok: {bool(audit_backstop.get('ok', False))}",
              f"- workboard changed-files gate ok: {bool(changed_files_gate.get('ok', False))}",
              f"- workboard unclaimed changed files: {int(changed_files_gate.get('unclaimed_file_count', 0))}",
              f"- workboard stale claims: {int(claim_cleanup.get('stale_claim_count', 0))}",
              f"- module audits stale (24h): {int(module_audit.get('stale_count', 0))}",
              f"- module audits total issues: {int(module_audit.get('total_issue_count', 0))}",
              f"- security audit ok: {bool(security.get('ok', False))}",
              f"- security failing checks: {', '.join(sec_summary.get('failing_checks') or []) if sec_summary.get('failing_checks') else 'none'}",
              f"- scorecard health score: {int(scorecard.get('health_score', 0))}",
          ]

          (root / "nightly_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload nightly reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reliability-${{ github.run_id }}
          path: artifacts/nightly_reliability/
          if-no-files-found: error
