# The whole test suite, on a schedule and on demand.
#
# The per-push workflows run smoke lists and gates; none of them runs the suite,
# and for two days in September 2026 a failing test sat behind a job that was
# named "full-test-matrix" and ran eleven files. This is the honest version:
# every test file, once a week and whenever someone asks, with the report kept
# as an artifact. It is not a required check; it is evidence.
name: Full test suite

on:
  schedule:
    - cron: "15 07 * * 0"   # Sundays 07:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,repl,test]"
          python -m pip install pytest pytest-asyncio pytest-aiohttp

      - name: Every test file
        run: |
          python -m pytest -q tests -p no:cacheprovider --junitxml=full-suite.xml --maxfail=200
        env:
          THOMAS_PROTECTION_DISABLED: "1"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-${{ github.run_id }}
          path: full-suite.xml
          if-no-files-found: warn
