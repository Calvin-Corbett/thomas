#
# Available models (change model = below to switch):
#   glm-5.2        -- latest flagship (recommended), strongest GLM for coding/agents
#   glm-5          -- prior flagship, 744B MoE (40B active), released Feb 2026
#   glm-4.5-air    -- fast, low-cost, strong tool-calling
#   glm-4.5        -- previous full-power model
#   glm-4.5-flash  -- ultra-fast, cheapest
