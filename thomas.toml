# Thomas Configuration
# See: README.md for quick start and configuration notes.

# Default model profile to use.
# openai_codex = ChatGPT-subscription OAuth (sign in, no API key) that calls the
# Responses API and CAN use Thomas's own tools/skills (function-calling). The old
# "codex" profile ran the Codex CLI as a closed agent that could NOT use Thomas's
# tools — that's the root cause of months of Thomas "not working how I want".
default_model = "openai_codex"
# Maximum agent loop iterations per query
max_agent_iterations = 10

# Server access policy
# local  -> localhost-only API access (default)
# remote -> authenticated API access from non-local clients
[server]
access_mode = "local"
api_token = ""
allow_unauthenticated_version = true
rate_limit_enabled = true              # remote mode only
rate_limit_max_requests = 120          # requests per window per token/ip
rate_limit_window_seconds = 60         # window size in seconds

# Rules-of-the-road quality gate
# Thomas evaluates required checks per task/job type before final completion.
[quality]
enabled = true
enforce = true
max_auto_retries = 1                # 0..3
require_verification_for_coding = true
require_tests_for_code_edits = false
require_monolith_guard_for_coding = true

# -----------------------------------------------------------------------------
# Model Profiles
# -----------------------------------------------------------------------------

[models.gemini]
provider = "openai_compat"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-2.5-pro"
max_tokens = 8192
context_window = 1048576
temperature = 0.5

[models.local]
provider = "openai_compat"
base_url = "http://localhost:11434/v1"
model = "qwen2.5-coder:7b"
max_tokens = 4096
context_window = 8192
temperature = 0.1
timeout_s = 120.0

# Codex (ChatGPT plan, no API key required)
#
# Routes through the local `codex app-server` (installed by @openai/codex).
# First use opens a browser for ChatGPT sign-in.
#
# Switch to this with: /model codex (in REPL) or the web UI selector.
#
# Note: model ids and context windows can change over time; run:
#   thomas models list
# to confirm what's available.

[models.openai_codex]
# ChatGPT-subscription OAuth (PKCE, no API key) -> Responses API WITH Thomas's tools.
# This is the engine that lets the model actually use Thomas's skills/tools.
provider = "openai_codex"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
max_tokens = 16384
context_window = 200000
temperature = 0.1

# -----------------------------------------------------------------------------
# Cloud Profiles (Templates)
# -----------------------------------------------------------------------------
#
# Tip: env overrides work like:
#   THOMAS_MODELS_OPENAI_API_KEY=...
#   THOMAS_MODELS_ANTHROPIC_API_KEY=...
#   THOMAS_MODELS_GROQ_API_KEY=...
#
# Telegram integration env vars:
#   THOMAS_TELEGRAM_BOT_TOKEN=...
#   THOMAS_TELEGRAM_ALLOWED_CHAT_IDS=123456789,987654321
#   THOMAS_TELEGRAM_SESSIONS_FILE=./runtime/.thomas/telegram_sessions.json
# Memory runtime toggle:
#   THOMAS_MEMORY_V2_ENABLED=1
# Library runtime toggles:
#   THOMAS_LIBRARY_ENABLED=1
#   THOMAS_LIBRARY_AUTO_CAPTURE_RESEARCH=1
# Memory curator toggles:
#   THOMAS_MEMORY_CURATOR_ENABLED=1
