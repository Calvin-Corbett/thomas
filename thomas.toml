# -----------------------------------------------------------------------------
# Embedding Model
# -----------------------------------------------------------------------------

[embed]
provider = "local"
model = "all-MiniLM-L6-v2"
device = "auto"                      # auto|cpu|cuda. "auto" falls back to CPU when CUDA isn't available.
load_on_demand = true                # Load only when needed (saves VRAM)
batch_size = 64

# -----------------------------------------------------------------------------
# Memory Engine
# -----------------------------------------------------------------------------

[memory]
root = "./runtime"
context_budget = 4000                # Safe budget for 8k models (leaves 4k for chat history)
mode = "auto"

# -----------------------------------------------------------------------------
# Tools
# -----------------------------------------------------------------------------

[tools]
sandbox_root = "."
allow_shell = true                   # Execute-first setup/integration behavior depends on shell availability.
shell_timeout = 30                   # Default shell command timeout (seconds)
max_file_size = 5000000              # Max file size for fs.read_file (bytes)

# -----------------------------------------------------------------------------
# Task Journal
# -----------------------------------------------------------------------------
# Writes a markdown file per task in the journal dir so any agent or human
# can pick up context later. Skips casual/trivial prompts automatically.

[journal]
enabled = true
dir = "./tasks"

[failover]
enabled = true
chat_auto_failover = false            # strict mode for primary chat runs: no silent profile switching
profiles = []                        # Optional ordered fallback model profiles (e.g. ["codex","openai","local"])
cooldown_seconds = 300               # Failed profile cooldown before retry
fallback_on_auth_error = false       # Usually keep false; true enables fallback on 401/403

[evolve.funnel]
# Multi-agent funnel evolve engine (additive). Selected per-run via
# `thomas evolve loop --mode funnel`. `enabled` makes funnel the standing
# default. Off/safe defaults: with no overrides the funnel wraps the classic
# green-mirror builder and never touches the blue-owned promotion gate.
enabled = false
lanes = 5                            # isolated, naive, one-shot agents per stage
survivors = 3                        # width after 5 -> 3 synthesis neck-down
repair_budget_early = 3              # first-stage repair attempts
repair_budget_late = 5               # later-stage repair attempts
simplification = true                # add the deletion-perspective lane at synthesis
graft_back = false                   # optional hybrid graft step (off until proven)
independent_check_can_self_veto = true   # cross-family evaluator may only make promotion HARDER
max_model_calls_per_goal = 40        # funnel-local cost backstop
definition_profile = ""              # empty -> loop profile / default
lane_profile = ""
synth_profile = ""
evaluator_candidates = ["anthropic", "gemini"]   # first family disjoint from the lanes wins

[evolve.claude_bridge]
# Claude-Code build bridge: lets Thomas-evolve dispatch a build task to an
# external coding agent (Claude Code) by typing into it via desktop_operator.
# MOST safety-sensitive capability — OFF by default and multi-gated. preview()
# never controls the PC; actually typing requires enabled=true + explicit human
# confirm + a matched window + no emergency-stop flag. Results are NEVER
# auto-applied (the typed prompt says build-on-branch); the fail-closed
# promotion gate still judges everything. Kill switch: create the file
# ~/.thomas/evolve/claude_bridge.STOP to block all dispatch.
enabled = false
require_confirmation = true           # human approval required before any keystroke
window_match = "Claude Code"          # only ever type into a window whose title contains this
branch_only = true                    # typed prompt instructs build-on-branch, never merge
max_prompt_chars = 8000               # refuse to type an unreasonably large blob
