#   https://api.z.ai/api/coding/paas/v4
[models.glm]
provider = "openai_compat"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key = ""
model = "glm-5.2"
max_tokens = 8192
context_window = 128000
temperature = 0.1

