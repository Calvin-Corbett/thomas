<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Marketplace</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="plugin_marketplace.style01_part01.css">
    <link rel="stylesheet" href="plugin_marketplace.style01_part02.css">
    <script src="plugin_marketplace.script01.js" defer></script>
</head>
<body>
    <main class="market-shell">
        <header class="market-header">
            <div class="market-header-copy">
                <p class="market-kicker">Thomas Upgrades</p>
                <h1>Marketplace</h1>
                <p class="market-subtitle">Browse real Thomas upgrades from the marketplace catalog.</p>
            </div>
            <div class="market-header-actions">
                <button class="t-btn t-btn-accent" id="refreshButton" type="button">Refresh</button>
            </div>
        </header>

        <section class="market-controls" aria-label="Marketplace controls">
            <label class="market-search" for="marketSearchInput">
                <span class="market-search-label">Search</span>
                <input id="marketSearchInput" type="search" placeholder="Search upgrades, categories, and capabilities">
            </label>
            <div class="market-filters" id="marketFilters" role="tablist" aria-label="Marketplace categories"></div>
        </section>

        <section class="market-status-row">
            <div class="market-source-pill" id="sourcePill">Source: marketplace catalog</div>
            <div class="market-status-text" id="statusText">Loading upgrades...</div>
        </section>

        <section class="market-catalog" id="catalog" aria-live="polite"></section>
    </main>
</body>
</html>
