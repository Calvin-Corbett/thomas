<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Plugin Marketplace</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --bg-dark: #0f1117;
            --bg-card: #1a1d27;
            --bg-hover: #252b42;
            --text-primary: #f0f4f8;
            --text-secondary: #a0aec0;
            --border: #2d3748;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        #root {
            width: 100%;
        }

        /* Top Bar */
        .topbar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .topbar-title {
            font-size: 1.5rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .topbar-search {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background-color: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            background-color: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
        }

        .toggle-btn {
            padding: 8px 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .toggle-btn.active {
            background-color: var(--primary);
            color: white;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Filters Section */
        .filters-section {
            margin-bottom: 30px;
        }

        .category-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .pill {
            padding: 10px 16px;
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .pill:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pill.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .sort-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .sort-select {
            padding: 10px 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .sort-select:hover {
            border-color: var(--primary);
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Plugin Grid */
        .plugins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .plugins-grid.list {
            grid-template-columns: 1fr;
        }

        /* Plugin Card */
        .plugin-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .plugin-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
        }

        .plugins-grid.list .plugin-card {
            padding: 20px;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        .plugins-grid.list .card-icon {
            margin-bottom: 0;
        }

        .icon-github {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .icon-slack {
            background: linear-gradient(135deg, #36c5f0 0%, #2eb67d 100%);
        }

        .icon-database {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .icon-code {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .icon-theme {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .icon-security {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }

        .icon-monitor {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .icon-brain {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
        }

        .icon-task {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
        }

        .icon-voice {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .icon-chart {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .icon-backup {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .card-content {
            flex: 1;
        }

        .card-header {
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .card-author {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plugins-grid.list .card-description {
            -webkit-line-clamp: 3;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .card-tag {
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--warning);
        }

        .install-count {
            color: var(--text-secondary);
        }

        .version-badge {
            background-color: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--primary);
        }

        .verified-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }

        .card-footer {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
            flex: 1;
        }

        .btn-success:hover:not(:disabled) {
            background-color: var(--success-dark);
        }

        .btn-warning {
            background-color: var(--warning);
            color: white;
            flex: 1;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            flex: 1;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-loading {
            position: relative;
            color: transparent;
        }

        .btn-loading::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            color: white;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .detail-icon {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .detail-header {
            margin-bottom: 30px;
        }

        .detail-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-author {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .detail-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail-meta-item {
            background-color: var(--bg-hover);
            padding: 12px;
            border-radius: 8px;
        }

        .detail-meta-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .detail-meta-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px 0;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .detail-description {
            color: var(--text-primary);
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .detail-list {
            list-style: none;
            margin-left: 0;
        }

        .detail-list li {
            padding: 8px 0;
            padding-left: 24px;
            position: relative;
            color: var(--text-primary);
        }

        .detail-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--success);
            font-weight: bold;
        }

        .changelog-item {
            border-left: 2px solid var(--border);
            padding-left: 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .changelog-item::before {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            border-radius: 50%;
            left: -6px;
            top: 6px;
        }

        .changelog-version {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .changelog-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .changelog-text {
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .permission-item {
            background-color: var(--bg-hover);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--primary);
        }

        .permission-item.sensitive {
            border-left-color: var(--error);
        }

        .permission-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .permission-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .permission-warning {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .review-item {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .review-author {
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .review-rating {
            color: var(--warning);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .review-text {
            color: var(--text-primary);
            line-height: 1.6;
        }

        .rating-chart {
            margin-bottom: 20px;
        }

        .rating-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .rating-label {
            width: 50px;
            color: var(--text-secondary);
        }

        .rating-fill {
            flex: 1;
            height: 8px;
            background-color: var(--bg-hover);
            border-radius: 4px;
            overflow: hidden;
        }

        .rating-bar-fill {
            height: 100%;
            background-color: var(--warning);
            transition: width 0.3s ease;
        }

        .rating-count {
            width: 50px;
            text-align: right;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        /* Sidebar */
        .sidebar {
            position: relative;
        }

        .sidebar-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: sticky;
            top: 100px;
        }

        .sidebar-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .update-badge {
            background-color: var(--error);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .installed-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .installed-item {
            background-color: var(--bg-hover);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .installed-item-name {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .installed-item-version {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .sidebar-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .sidebar-btn:hover {
            background-color: var(--primary-dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-dark) 50%, var(--bg-hover) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-results-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: 0.3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--success);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            z-index: 2000;
            animation: slideInUp 0.3s ease;
        }

        .toast.success {
            background-color: var(--success);
        }

        .toast.error {
            background-color: var(--error);
        }

        .toast.info {
            background-color: var(--primary);
        }

        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .topbar-content {
                flex-direction: column;
                gap: 12px;
            }

            .topbar-search {
                max-width: 100%;
            }

            .main-container {
                padding: 20px 12px;
            }

            .plugins-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                order: -1;
            }

            .sidebar-card {
                position: static;
                margin-bottom: 20px;
            }

            .modal-content {

        // Custom hooks
        function usePlugins() {
            const [plugins, setPlugins] = useState(SAMPLE_PLUGINS);
            const [loading, setLoading] = useState(false);

            const getPlugins = useCallback((query = "", category = "all", sort = "rating") => {
                setLoading(true);
                setTimeout(() => {
                    let filtered = plugins;

                    if (category !== "all") {
                        filtered = filtered.filter(p => p.category === category);
                    }

                    if (query) {
                        const q = query.toLowerCase();
                        filtered = filtered.filter(p =>
                            p.name.toLowerCase().includes(q) ||
                            p.description.toLowerCase().includes(q) ||
                            p.author.toLowerCase().includes(q) ||
                            p.tags.some(t => t.toLowerCase().includes(q))
                        );
                    }

                    filtered = [...filtered].sort((a, b) => {
                        switch (sort) {
                            case "rating":
                                return b.rating - a.rating;
                            case "installs":
                                return b.install_count - a.install_count;
                            case "newest":
                                return Math.random() - 0.5;
                            case "name":
                                return a.name.localeCompare(b.name);
                            default:
                                return 0;
                        }
                    });

                    setPlugins(filtered);
                    setLoading(false);
                }, 300);
            }, [plugins]);

            return { plugins, loading, getPlugins };
        }

        function useSearch() {
            const [query, setQuery] = useState("");
            const [debouncedQuery, setDebouncedQuery] = useState("");

            useEffect(() => {
                const timer = setTimeout(() => {
                    setDebouncedQuery(query);
                }, 300);
                return () => clearTimeout(timer);
            }, [query]);

            return { query, setQuery, debouncedQuery };
        }

        function useInstall() {
            const [installing, setInstalling] = useState({});

            const install = useCallback((pluginId) => {
                setInstalling(prev => ({ ...prev, [pluginId]: true }));
                setTimeout(() => {
                    setInstalling(prev => ({ ...prev, [pluginId]: false }));
                }, 1200);
            }, []);

            return { installing, install };
        }

        function useCategories() {
            const categories = [
                { id: "all", label: "All" },
                { id: "tools", label: "Tools" },
                { id: "integrations", label: "Integrations" },
                { id: "agents", label: "Agents" },

                { id: "analytics", label: "Analytics" },
                { id: "security", label: "Security" },

            ];
            return categories;

        // Toast notification component
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return <div className={`toast ${type}`}>{message}</div>;
        }

                        </div>
                        <div className="card-description">{plugin.description}</div>
                        {view === "list" && plugin.tags && (
                            <div className="card-tags">
                                {plugin.tags.map(tag => (
                                    <span key={tag} className="card-tag">{tag}</span>
                                ))}
                            </div>

                        <div className="card-meta">
                            <div className="rating">⭐ {plugin.rating.toFixed(1)}</div>

                                        </button>
                                    ))}
                                </div>
                                <div className="sort-wrapper">
                                    <label className="sort-label">Sort by:</label>
                                    <select
                                        className="sort-select"

                                        onChange={e => setSort(e.target.value)}

                                        <option value="rating">Rating</option>
                                        <option value="installs">Most Popular</option>
                                        <option value="newest">Newest</option>
                                        <option value="name">A-Z</option>
                                    </select>
                                </div>
                            </div>

                            {loading ? (
                                <div className="plugins-grid">

                                        <div key={i} className="plugin-card skeleton" style={{ height: view === "grid" ? "350px" : "120px" }}></div>

                                </div>

                                    <div className="no-results-title">No plugins found</div>

                                </div>

                                    {plugins.map(plugin => (
                                        <PluginCard
                                            key={plugin.id}
                                            plugin={plugin}
                                            view={view}

                            )}

                            installedPlugins={installedPlugins}

                    </div>

                            plugin={selectedPlugin}
                            onClose={() => setSelectedPlugin(null)}

                            installedPlugins={installedPlugins}
                        />
                    )}

                    {toast && (
                        <Toast
                            message={toast.message}
                            type={toast.type}
                            onClose={() => setToast(null)}
                        />
                    )}
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
