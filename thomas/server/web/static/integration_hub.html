<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Hub - Thomas AI</title>
    
    <link rel="stylesheet" href="integration_hub.style01.css">

</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Integration Hub</h1>
                <p>Manage all your integrations and connections in one place</p>
            </div>
            <div class="header-actions">
                <button class="btn-secondary btn-sm" onclick="showTab('health')">Health Dashboard</button>
                <button class="btn-primary btn-sm" onclick="showAddWebhook()">
                    <span>+</span>
                    <span>Add Webhook</span>
                </button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab('integrations')">Integrations</button>
            <button class="tab" onclick="showTab('health')">Health Metrics</button>
            <button class="tab" onclick="showTab('events')">Event Log</button>
            <button class="tab" onclick="showTab('webhooks')">Webhooks</button>
        </div>

        <!-- Integrations Tab -->
        <div id="integrations" class="tab-content active">
            <div class="integrations-grid" id="integrationsGrid"></div>
            <div id="expandedDetails"></div>
        </div>

        <!-- Health Metrics Tab -->
        <div id="health" class="tab-content">
            <div id="healthMetrics"></div>
        </div>

        <!-- Event Log Tab -->
        <div id="events" class="tab-content">
            <div class="event-log" id="eventLog"></div>
        </div>

        <!-- Webhooks Tab -->
        <div id="webhooks" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 20px; font-weight: 700;">Manage Webhooks</h2>
                <button class="btn-primary btn-sm" onclick="showAddWebhook()">+ Add Webhook</button>
            </div>
            <div id="webhooksList"></div>
        </div>
    </div>

    <div id="toastContainer"></div>

    
    <script src="integration_hub.script01.js"></script>

</body>
</html>
