<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Workflow Builder</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #0f1117;
            color: #e4e4e7;
            height: 100vh;
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        .workflow-builder {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #0f1117;
        }

        /* Top Bar */
        .top-bar {
            background: #1a1d27;
            border-bottom: 1px solid #2a2d37;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .workflow-name-input {
            background: #0f1117;
            border: 1px solid #2a2d37;
            color: #e4e4e7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 150ms ease;
            min-width: 200px;
        }

        .workflow-name-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.draft {
            background: rgba(156, 163, 175, 0.1);
            color: #d1d5db;
        }

        .status-badge.running {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .status-badge.completed {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
        }

        .status-badge.failed {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
        }

        .top-bar-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #0f1117;
            border: 1px solid #2a2d37;
            border-radius: 6px;
            padding: 4px;
        }

        .icon-button {
            background: none;
            border: 1px solid transparent;
            color: #e4e4e7;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 150ms ease;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .icon-button:hover {
            background: #2a2d37;
            border-color: #3a3d47;
        }

        .icon-button:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .icon-button.primary {
            background: #6366f1;
            border-color: #6366f1;
            color: white;
        }

        .icon-button.primary:hover {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .icon-button.success {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .icon-button.success:hover {
            background: #16a34a;
            border-color: #16a34a;
        }

        .icon-button.danger {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .icon-button.danger:hover {
            background: #dc2626;
            border-color: #dc2626;
        }

        .icon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .zoom-percent {
            padding: 0 8px;
            font-size: 12px;
            min-width: 45px;
            text-align: center;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* Palette Sidebar */
        .palette-sidebar {
            width: 240px;
            background: #1a1d27;
            border-right: 1px solid #2a2d37;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .palette-search {
            padding: 12px;
            border-bottom: 1px solid #2a2d37;
        }

        .palette-search input {
            width: 100%;
            background: #0f1117;
            border: 1px solid #2a2d37;
            color: #e4e4e7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: all 150ms ease;
        }

        .palette-search input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .palette-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .palette-category {
            margin-bottom: 16px;
        }

        .palette-category-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #a1a1a1;
            padding: 8px 0;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .palette-item {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 150ms ease;
            background: #0f1117;
            border: 1px solid #2a2d37;
        }

        .palette-item:hover {
            background: #262933;
            border-color: #3a3d47;
        }

        .palette-item-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .palette-item-desc {
            font-size: 11px;
            color: #a1a1a1;
        }

        /* Canvas */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0f1117;
        }

        .canvas {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }

        .canvas.dragging {
            cursor: grabbing;
        }

        .canvas-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .grid-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, #2a2d37 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .svg-connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .connection-curve {
            fill: none;
            stroke: #6366f1;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 150ms ease;
        }

        .connection-curve:hover {
            stroke: #818cf8;
            stroke-width: 3;
        }

        .connection-flow {
            animation: flow 2s infinite linear;
        }

        @keyframes flow {
            0%, 100% { stroke-dashoffset: 0; }
            50% { stroke-dashoffset: 10; }
        }

        .nodes-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .node {
            position: absolute;
            width: 220px;
            background: #1a1d27;
            border-radius: 8px;
            border: 1px solid #2a2d37;
            border-left: 4px solid;
            padding: 12px;
            pointer-events: auto;
            transition: all 150ms ease;
            cursor: move;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .node:hover {
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.5);
        }

        .node.selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3), 0 8px 12px rgba(0, 0, 0, 0.5);
        }

        .node.running {
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.4), 0 4px 6px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 0 4px 6px rgba(0, 0, 0, 0.3); }
        }

        .node.type-tool {
            border-left-color: #3b82f6;
        }

        .node.type-llm {
            border-left-color: #a855f7;
        }

        .node.type-condition {
            border-left-color: #f59e0b;
        }

        .node.type-loop {
            border-left-color: #14b8a6;
        }

        .node.type-parallel {
            border-left-color: #6366f1;
        }

        .node.type-wait {
            border-left-color: #6b7280;
        }

        .node.type-approval {
            border-left-color: #22c55e;
        }

        .node.type-webhook {
            border-left-color: #f97316;
        }

        .node-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .node-icon {
            font-size: 18px;
        }

        .node-title {
            font-size: 13px;
            font-weight: 600;
            flex: 1;
        }

        .node-subtitle {
            font-size: 11px;
            color: #a1a1a1;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-status-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 16px;
        }

        .node-ports {
            display: flex;
            justify-content: space-around;
            position: absolute;
            width: calc(100% - 24px);
            left: 12px;
        }

        .node-ports.top {
            top: -12px;
        }

        .node-ports.bottom {
            bottom: -12px;
        }

        .node-port {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6366f1;
            border: 2px solid #1a1d27;
            cursor: crosshair;
            transition: all 150ms ease;
        }

        .node-port:hover {
            width: 14px;
            height: 14px;
            margin: -2px;
        }

        .node-port.true {
            background: #22c55e;
        }

        .node-port.false {
            background: #ef4444;
        }

        .node-port-label {
            position: absolute;
            font-size: 10px;
            font-weight: 600;
            color: #a1a1a1;
            white-space: nowrap;
        }

        .node-port-label.top {
            bottom: 18px;
        }

        .node-port-label.true {
            color: #22c55e;
        }

        .node-port-label.false {
            color: #ef4444;
        }

        .selection-box {
            position: absolute;
            border: 1px dashed #6366f1;
            background: rgba(99, 102, 241, 0.1);
            pointer-events: none;
            z-index: 10;
        }

        /* Properties Panel */
        .properties-panel {
            width: 320px;
            background: #1a1d27;
            border-left: 1px solid #2a2d37;
            overflow-y: auto;
            flex-shrink: 0;
            transform: translateX(100%);
            transition: transform 150ms ease;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .properties-panel.open {
            transform: translateX(0);
        }

        .properties-header {
            padding: 16px;
            border-bottom: 1px solid #2a2d37;
            flex-shrink: 0;
        }

        .properties-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .properties-subtitle {
            font-size: 12px;
            color: #a1a1a1;
        }

        .properties-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .property-section {
            margin-bottom: 20px;
        }

        .property-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #a1a1a1;
            padding: 8px 0;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .property-section-toggle {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: transform 150ms ease;
        }

        .property-section.collapsed .property-section-toggle {
            transform: rotate(-90deg);
        }

        .property-section.collapsed .property-fields {
            display: none;
        }

        .property-fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .property-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .property-label {
            font-size: 12px;
            font-weight: 600;
            color: #e4e4e7;
        }

        .property-input {
            background: #0f1117;
            border: 1px solid #2a2d37;
            color: #e4e4e7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: all 150ms ease;
            font-family: inherit;
        }

        .property-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .property-textarea {
            min-height: 80px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }

        .property-select {
            background: #0f1117;
            border: 1px solid #2a2d37;
            color: #e4e4e7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: all 150ms ease;
            cursor: pointer;
        }

        .property-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .property-error {
            color: #ef4444;
            font-size: 12px;
        }

        .property-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            width: 40px;
            height: 24px;
            background: #2a2d37;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: background 150ms ease;
        }

        .toggle-switch.on {
            background: #6366f1;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 150ms ease;
        }

        .toggle-switch.on::after {
            left: 18px;
        }

        .property-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .tag {
            background: #2a2d37;
            color: #e4e4e7;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-remove {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 150ms ease;
        }

        .tag-remove:hover {
            opacity: 1;
        }

        .tag-input {
            background: #0f1117;
            border: 1px solid #2a2d37;
            color: #e4e4e7;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            flex: 1;
            min-width: 80px;
            transition: all 150ms ease;
        }

        .tag-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .delete-button {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease;
            margin-top: 20px;
        }

        .delete-button:hover {
            background: #dc2626;
        }

        /* Bottom Drawer */
        .bottom-drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1d27;
            border-top: 1px solid #2a2d37;
            max-height: 300px;
            overflow-y: auto;
            z-index: 15;
            transform: translateY(100%);
            transition: transform 150ms ease;
        }

        .bottom-drawer.open {
            transform: translateY(0);
        }

        .drawer-header {
            padding: 12px 16px;
            border-bottom: 1px solid #2a2d37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .drawer-title {
            font-size: 13px;
            font-weight: 600;
        }

        .drawer-content {
            padding: 12px 16px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .log-entry {
            padding: 6px 0;
            color: #a1a1a1;
        }

        .log-entry.error {
            color: #ef4444;
        }

        .log-entry.success {
            color: #22c55e;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: #1a1d27;
            border: 1px solid #2a2d37;
            border-left: 4px solid #6366f1;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            animation: slideIn 200ms ease;
        }

        .toast.success {
            border-left-color: #22c55e;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Minimap */
        .minimap {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 160px;
            height: 120px;
            background: #1a1d27;
            border: 1px solid #2a2d37;
            border-radius: 6px;
            z-index: 50;
            cursor: grab;
        }

        .minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            display: block;
        }

        /* Keyboard Shortcuts */
        .shortcuts-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 150ms ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .shortcuts-panel {
            background: #1a1d27;
            border: 1px solid #2a2d37;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .shortcuts-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .shortcuts-group {
            margin-bottom: 16px;
        }

        .shortcuts-group-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #a1a1a1;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
        }

        .shortcut-key {
            background: #2a2d37;
            color: #e4e4e7;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .empty-state-subtext {
            font-size: 14px;
            color: #a1a1a1;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #2a2d37 25%, #3a3d47 50%, #2a2d37 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2d37;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3d47;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .palette-sidebar {
                width: 200px;
            }
            .properties-panel {
                width: 280px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useReducer, useCallback, useRef, useEffect, useMemo } = React;

        // Constants
        const NODE_TYPES = {
            tool: { icon: '🔧', color: '#3b82f6', label: 'Tool Call' },
            llm: { icon: '🧠', color: '#a855f7', label: 'LLM Prompt' },
            condition: { icon: '◇', color: '#f59e0b', label: 'Condition' },
            loop: { icon: '⟳', color: '#14b8a6', label: 'Loop' },
            parallel: { icon: '⫶', color: '#6366f1', label: 'Parallel' },
            wait: { icon: '⏱', color: '#6b7280', label: 'Wait' },
            approval: { icon: '✓', color: '#22c55e', label: 'Approval' },
            webhook: { icon: '📡', color: '#f97316', label: 'Webhook' },
        };

        const PALETTE_ITEMS = [
            { type: 'condition', category: 'Control Flow', desc: 'Conditional branching' },
            { type: 'loop', category: 'Control Flow', desc: 'Iterate over items' },
            { type: 'parallel', category: 'Control Flow', desc: 'Run branches simultaneously' },
            { type: 'tool', category: 'Actions', desc: 'Call external tool' },
            { type: 'llm', category: 'Actions', desc: 'LLM inference' },
            { type: 'webhook', category: 'Actions', desc: 'HTTP request' },
            { type: 'wait', category: 'Gates', desc: 'Delay execution' },
            { type: 'approval', category: 'Gates', desc: 'Require approval' },
        ];

        // Reducer for workflow state
        const workflowReducer = (state, action) => {
            switch (action.type) {
                case 'ADD_NODE':
                    return {
                        ...state,
                        nodes: [...state.nodes, action.payload],
                    };
                case 'UPDATE_NODE':
                    return {
                        ...state,
                        nodes: state.nodes.map(n => n.id === action.payload.id ? action.payload : n),
                    };
                case 'DELETE_NODE':
                    return {
                        ...state,
                        nodes: state.nodes.filter(n => n.id !== action.payload),
                        connections: state.connections.filter(c => c.from !== action.payload && c.to !== action.payload),
                        selectedNodes: state.selectedNodes.filter(id => id !== action.payload),
                    };
                case 'ADD_CONNECTION':
                    return {
                        ...state,
                        connections: [...state.connections, action.payload],
                    };
                case 'DELETE_CONNECTION':
                    return {
                        ...state,
                        connections: state.connections.filter((c, i) => i !== action.payload),
                    };
                case 'SET_SELECTED_NODES':
                    return { ...state, selectedNodes: action.payload };
                case 'UPDATE_PAN':
                    return { ...state, panX: action.payload.x, panY: action.payload.y };
                case 'UPDATE_ZOOM':
                    return { ...state, zoom: action.payload };
                case 'UPDATE_STATUS':
                    return { ...state, status: action.payload };
                case 'ADD_LOG':
                    return { ...state, logs: [...state.logs, action.payload] };
                case 'CLEAR_LOGS':
                    return { ...state, logs: [] };
                case 'BATCH_UPDATE':
                    return action.payload;
                default:
                    return state;
            }
        };

        // Custom Hooks
        const useHistory = (initialState) => {
            const [history, setHistory] = useState([initialState]);
            const [index, setIndex] = useState(0);

            const push = useCallback((state) => {
                setHistory(h => [...h.slice(0, index + 1), state].slice(-50));
                setIndex(i => Math.min(i + 1, h.length - 1));
            }, [index]);

            const undo = useCallback(() => {
                setIndex(i => Math.max(0, i - 1));
            }, []);

            const redo = useCallback(() => {
                setHistory(h => {
                    setIndex(i => Math.min(i + 1, h.length - 1));
                });
            }, []);

            return { state: history[index], push, undo, canUndo: index > 0, canRedo: index < history.length - 1 };
        };

        const useWorkflow = (initialState) => {
            const [state, dispatch] = useReducer(workflowReducer, initialState);
            const historyRef = useRef(useHistory(state));

            const push = useCallback(() => {
                historyRef.current.push(state);
            }, [state]);

            return { state, dispatch, push, history: historyRef.current };
        };

        // Main App Component
        function WorkflowBuilder() {
            const initialState = {
                nodes: [],
                connections: [],
                selectedNodes: [],
                panX: 0,
                panY: 0,
                zoom: 1,
                status: 'draft',
                logs: [],
                name: 'Untitled Workflow',
            };

            const { state, dispatch, push, history } = useWorkflow(initialState);
            const [showShortcuts, setShowShortcuts] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [isRunning, setIsRunning] = useState(false);
            const [paletteSearch, setPaletteSearch] = useState('');
            const [showDrawer, setShowDrawer] = useState(false);
            const [gridSnapEnabled, setGridSnapEnabled] = useState(true);
            const canvasRef = useRef(null);
            const dragStartRef = useRef(null);
            const selectionBoxRef = useRef(null);

            // Load from localStorage on mount
            useEffect(() => {
                const saved = localStorage.getItem('workflow');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        dispatch({ type: 'BATCH_UPDATE', payload: data });
                        addToast('Workflow loaded', 'success');
                    } catch (e) {
                        console.error('Failed to load workflow:', e);
                    }
                }
            }, []);

            // Auto-save to localStorage
            useEffect(() => {
                const timer = setTimeout(() => {
                    localStorage.setItem('workflow', JSON.stringify(state));
                }, 1000);
                return () => clearTimeout(timer);
            }, [state]);

            const addToast = (message, type = 'success') => {
                const id = Math.random();
                setToasts(t => [...t, { id, message, type }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
            };

            // Keyboard shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === '?') {
                        setShowShortcuts(!showShortcuts);
                    } else if (e.ctrlKey || e.metaKey) {
                        if (e.key === 'z') {
                            e.preventDefault();
                            if (e.shiftKey) {
                                history.redo();
                            } else {
                                history.undo();
                            }
                        } else if (e.key === 'c') {
                            e.preventDefault();
                            const selected = state.nodes.filter(n => state.selectedNodes.includes(n.id));
                            if (selected.length > 0) {
                                localStorage.setItem('clipboard', JSON.stringify(selected));
                                addToast(`Copied ${selected.length} node(s)`, 'success');
                            }
                        } else if (e.key === 'v') {
                            e.preventDefault();
                            try {
                                const clipboard = JSON.parse(localStorage.getItem('clipboard') || '[]');
                                clipboard.forEach(node => {
                                    const newNode = { ...node, id: Math.random(), x: node.x + 20, y: node.y + 20 };
                                    dispatch({ type: 'ADD_NODE', payload: newNode });
                                });
                                addToast(`Pasted ${clipboard.length} node(s)`, 'success');
                            } catch (e) {
                                console.error('Failed to paste:', e);
                            }
                        }
                    } else if (e.key === 'Escape') {
                        dispatch({ type: 'SET_SELECTED_NODES', payload: [] });
                    } else if (e.key === 'Delete') {
                        state.selectedNodes.forEach(id => dispatch({ type: 'DELETE_NODE', payload: id }));
                        dispatch({ type: 'SET_SELECTED_NODES', payload: [] });
                        addToast('Node(s) deleted', 'success');
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [state, history]);

            const handleCanvasDrag = (e) => {
                if (e.button !== 0) return;
                dragStartRef.current = { x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY };
            };

            const handleMouseMove = (e) => {
                if (dragStartRef.current) {
                    const dx = e.clientX - dragStartRef.current.x;
                    const dy = e.clientY - dragStartRef.current.y;
                    dispatch({ type: 'UPDATE_PAN', payload: { x: dragStartRef.current.panX + dx, y: dragStartRef.current.panY + dy } });
                }
            };

            const handleMouseUp = () => {
                dragStartRef.current = null;
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newZoom = Math.max(0.25, Math.min(3, state.zoom * delta));
                dispatch({ type: 'UPDATE_ZOOM', payload: newZoom });
            };

            const handleDragFromPalette = (e, type) => {
                e.preventDefault();
                const rect = canvasRef.current.getBoundingClientRect();
                const x = (e.clientX - rect.left - state.panX) / state.zoom;
                const y = (e.clientY - rect.top - state.panY) / state.zoom;

                const newNode = {
                    id: Math.random(),
                    type,
                    x: Math.round(x / 20) * 20,
                    y: Math.round(y / 20) * 20,
                    config: {},
                    status: 'pending',
                };

                dispatch({ type: 'ADD_NODE', payload: newNode });
                push();
                addToast(`Added ${NODE_TYPES[type].label}`, 'success');
            };

            const handleNodeClick = (e, nodeId) => {
                e.stopPropagation();
                if (e.ctrlKey || e.metaKey) {
                    dispatch({ type: 'SET_SELECTED_NODES', payload: state.selectedNodes.includes(nodeId) ? state.selectedNodes.filter(id => id !== nodeId) : [...state.selectedNodes, nodeId] });
                } else {
                    dispatch({ type: 'SET_SELECTED_NODES', payload: [nodeId] });
                }
            };

            const handleNodeDrag = (e, nodeId) => {
                e.preventDefault();
                const startX = e.clientX;
                const startY = e.clientY;
                const nodeY = state.nodes.find(n => n.id === nodeId)?.y || 0;
                const nodeX = state.nodes.find(n => n.id === nodeId)?.x || 0;

                const handleMove = (moveE) => {
                    const dx = (moveE.clientX - startX) / state.zoom;
                    const dy = (moveE.clientY - startY) / state.zoom;
                    const newX = gridSnapEnabled ? Math.round((nodeX + dx) / 20) * 20 : nodeX + dx;
                    const newY = gridSnapEnabled ? Math.round((nodeY + dy) / 20) * 20 : nodeY + dy;

                    const nodesWereSelected = state.selectedNodes.includes(nodeId);
                    if (!nodesWereSelected) {
                        dispatch({ type: 'SET_SELECTED_NODES', payload: [nodeId] });
                    }

                    const selectedToUpdate = nodesWereSelected ? state.selectedNodes : [nodeId];
                    selectedToUpdate.forEach(id => {
                        const node = state.nodes.find(n => n.id === id);
                        if (node) {
                            dispatch({ type: 'UPDATE_NODE', payload: { ...node, x: newX, y: newY } });
                        }
                    });
                };

                const handleUp = () => {
                    window.removeEventListener('mousemove', handleMove);
                    window.removeEventListener('mouseup', handleUp);
                    push();
                };

                window.addEventListener('mousemove', handleMove);
                window.addEventListener('mouseup', handleUp);
            };

            const handleExportJSON = () => {
                const json = JSON.stringify(state, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${state.name}.json`;
                a.click();
                addToast('Workflow exported', 'success');
            };

            const handleImportJSON = async () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const imported = JSON.parse(event.target.result);
                            dispatch({ type: 'BATCH_UPDATE', payload: imported });
                            push();
                            addToast('Workflow imported', 'success');
                        } catch (err) {
                            addToast('Failed to import workflow', 'error');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            const handleSave = async () => {
                try {
                    const response = await fetch('/api/workflows', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(state),
                    });
                    if (response.ok) {
                        addToast('Workflow saved', 'success');
                    } else {
                        addToast('Failed to save workflow', 'error');
                    }
                } catch (e) {
                    addToast('Failed to save workflow', 'error');
                }
            };

            const handleRun = async () => {
                setIsRunning(true);
                dispatch({ type: 'UPDATE_STATUS', payload: 'running' });
                try {
                    const response = await fetch('/api/workflows/execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(state),
                    });
                    if (response.ok) {
                        addToast('Workflow started', 'success');
                        const pollStatus = setInterval(async () => {
                            const statusResponse = await fetch('/api/workflows/status');
                            const statusData = await statusResponse.json();
                            if (statusData.status !== 'running') {
                                clearInterval(pollStatus);
                                dispatch({ type: 'UPDATE_STATUS', payload: statusData.status });
                                setIsRunning(false);
                                addToast(`Workflow ${statusData.status}`, statusData.status === 'completed' ? 'success' : 'error');
                            }
                        }, 1000);
                    }
                } catch (e) {
                    addToast('Failed to start workflow', 'error');
                    setIsRunning(false);
                    dispatch({ type: 'UPDATE_STATUS', payload: 'failed' });
                }
            };

            const filteredPalette = PALETTE_ITEMS.filter(item =>
                item.type.includes(paletteSearch.toLowerCase()) ||
                item.desc.toLowerCase().includes(paletteSearch.toLowerCase())
            );

            const groupedPalette = {};
            filteredPalette.forEach(item => {
                if (!groupedPalette[item.category]) groupedPalette[item.category] = [];
                groupedPalette[item.category].push(item);
            });

            const selectedNode = state.nodes.find(n => state.selectedNodes.includes(n.id));

            return (
                <div className="workflow-builder">
                    {/* Top Bar */}
                    <div className="top-bar">
                        <div className="top-bar-left">
                            <input
                                type="text"
                                className="workflow-name-input"
                                value={state.name}
                                onChange={(e) => dispatch({ type: 'UPDATE_PAN', payload: { ...state, name: e.target.value } })}
                                placeholder="Workflow name"
                            />
                            <div className={`status-badge ${state.status}`}>{state.status}</div>
                        </div>

                        <div className="top-bar-center">
                            <div className="zoom-control">
                                <button className="icon-button" onClick={() => dispatch({ type: 'UPDATE_ZOOM', payload: Math.max(0.25, state.zoom - 0.1) })}>−</button>
                                <span className="zoom-percent">{Math.round(state.zoom * 100)}%</span>
                                <button className="icon-button" onClick={() => dispatch({ type: 'UPDATE_ZOOM', payload: Math.min(3, state.zoom + 0.1) })}>+</button>
                            </div>
                            <button className="icon-button" onClick={() => dispatch({ type: 'UPDATE_ZOOM', payload: 1 })}>Fit</button>
                            <button className="icon-button" onClick={() => setGridSnapEnabled(!gridSnapEnabled)}>Grid {gridSnapEnabled ? '✓' : '○'}</button>
                        </div>

                        <div className="top-bar-right">
                            <button className="icon-button" onClick={() => history.undo()} disabled={!history.canUndo}>↶ Undo</button>
                            <button className="icon-button" onClick={() => history.redo()} disabled={!history.canRedo}>↷ Redo</button>
                            <button className="icon-button" onClick={handleExportJSON}>⬇ Export</button>
                            <button className="icon-button" onClick={handleImportJSON}>⬆ Import</button>
                            <button className="icon-button" onClick={handleSave}>💾 Save</button>
                            {isRunning ? (
                                <button className="icon-button danger" onClick={() => setIsRunning(false)}>⏹ Stop</button>
                            ) : (
                                <button className="icon-button success" onClick={handleRun} disabled={state.nodes.length === 0}>▶ Run</button>
                            )}
                            <button className="icon-button" onClick={() => setShowShortcuts(!showShortcuts)}>?</button>
                        </div>
                    </div>

                    <div className="main-content">
                        {/* Palette Sidebar */}
                        <div className="palette-sidebar">
                            <div className="palette-search">
                                <input
                                    type="text"
                                    placeholder="Search nodes..."
                                    value={paletteSearch}
                                    onChange={(e) => setPaletteSearch(e.target.value)}
                                />
                            </div>
                            <div className="palette-content">
                                {Object.entries(groupedPalette).map(([category, items]) => (
                                    <div key={category} className="palette-category">
                                        <div className="palette-category-title">{category}</div>
                                        {items.map(item => (
                                            <div
                                                key={item.type}
                                                className="palette-item"
                                                draggable
                                                onDragEnd={(e) => handleDragFromPalette(e, item.type)}
                                            >
                                                <div className="node-header">
                                                    <span className="node-icon">{NODE_TYPES[item.type].icon}</span>
                                                    <div>
                                                        <div className="node-title">{NODE_TYPES[item.type].label}</div>
                                                        <div className="node-subtitle">{item.desc}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Canvas */}
                        <div className="canvas-container" ref={canvasRef} onMouseDown={handleCanvasDrag} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onWheel={handleWheel} style={{ cursor: isRunning ? 'default' : 'grab' }}>
                            <div className="canvas-background">
                                <div className="grid-dots" style={{ backgroundSize: `${20 * state.zoom}px ${20 * state.zoom}px` }}></div>
                            </div>

                            {state.nodes.length === 0 && (
                                <div className="empty-state">
                                    <div className="empty-state-icon">⬚</div>
                                    <div className="empty-state-text">No nodes yet</div>
                                    <div className="empty-state-subtext">Drag a node from the palette to get started</div>
                                </div>
                            )}

                            <svg className="svg-connections" style={{ transform: `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})` }}>
                                {state.connections.map((conn, idx) => {
                                    const fromNode = state.nodes.find(n => n.id === conn.from);
                                    const toNode = state.nodes.find(n => n.id === conn.to);
                                    if (!fromNode || !toNode) return null;

                                    const x1 = fromNode.x + 110;
                                    const y1 = fromNode.y + 220;
                                    const x2 = toNode.x + 110;
                                    const y2 = toNode.y;
                                    const dx = x2 - x1;
                                    const dy = y2 - y1;
                                    const path = `M ${x1} ${y1} C ${x1} ${y1 + dy * 0.5}, ${x2} ${y2 - dy * 0.5}, ${x2} ${y2}`;

                                    return (
                                        <path
                                            key={idx}
                                            d={path}
                                            className={`connection-curve ${isRunning ? 'connection-flow' : ''}`}
                                            onClick={() => dispatch({ type: 'DELETE_CONNECTION', payload: idx })}
                                            style={{ cursor: 'pointer' }}
                                        />
                                    );
                                })}
                            </svg>

                            <div className="nodes-container" style={{ transform: `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})` }}>
                                {state.nodes.map((node) => (
                                    <div
                                        key={node.id}
                                        className={`node type-${node.type} ${state.selectedNodes.includes(node.id) ? 'selected' : ''} ${isRunning && node.status === 'running' ? 'running' : ''}`}
                                        style={{ left: node.x, top: node.y }}
                                        onMouseDown={(e) => handleNodeClick(e, node.id)}
                                        onDragStart={(e) => handleNodeDrag(e, node.id)}
                                        draggable
                                    >
                                        {node.status === 'completed' && <div className="node-status-icon">✓</div>}
                                        {node.status === 'failed' && <div className="node-status-icon">✕</div>}

                                        <div className="node-header">
                                            <span className="node-icon">{NODE_TYPES[node.type].icon}</span>
                                            <div>
                                                <div className="node-title">{NODE_TYPES[node.type].label}</div>
                                                <div className="node-subtitle">{node.config?.name || node.config?.expression || node.config?.tool || 'Configure'}</div>
                                            </div>
                                        </div>

                                        <div className="node-ports top">
                                            <div className="node-port" />
                                        </div>

                                        {node.type === 'condition' && (
                                            <div className="node-ports bottom">
                                                <div className="node-port true" style={{ marginRight: 20 }} />
                                                <div className="node-port false" style={{ marginLeft: 20 }} />
                                            </div>
                                        )}
                                        {node.type !== 'condition' && (
                                            <div className="node-ports bottom">
                                                <div className="node-port" />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>

                            {/* Minimap */}
                            <div className="minimap">
                                <canvas width="160" height="120" style={{ display: 'block', cursor: 'grab' }} ref={(canvas) => {
                                    if (canvas) {
                                        const ctx = canvas.getContext('2d');
                                        ctx.fillStyle = '#0f1117';
                                        ctx.fillRect(0, 0, 160, 120);

                                        const bounds = { minX: 0, minY: 0, maxX: 800, maxY: 600 };
                                        if (state.nodes.length > 0) {
                                            bounds.minX = Math.min(...state.nodes.map(n => n.x));
                                            bounds.minY = Math.min(...state.nodes.map(n => n.y));
                                            bounds.maxX = Math.max(...state.nodes.map(n => n.x + 220));
                                            bounds.maxY = Math.max(...state.nodes.map(n => n.y + 120));
                                        }

                                        const scaleX = 160 / (bounds.maxX - bounds.minX || 1);
                                        const scaleY = 120 / (bounds.maxY - bounds.minY || 1);

                                        state.nodes.forEach(node => {
                                            const x = (node.x - bounds.minX) * scaleX;
                                            const y = (node.y - bounds.minY) * scaleY;
                                            const w = 220 * scaleX;
                                            const h = 120 * scaleY;

                                            ctx.fillStyle = state.selectedNodes.includes(node.id) ? '#6366f1' : '#2a2d37';
                                            ctx.fillRect(x, y, w, h);
                                        });

                                        ctx.strokeStyle = '#6366f1';
                                        ctx.lineWidth = 1;
                                        const vpX = (-state.panX / state.zoom - bounds.minX) * scaleX;
                                        const vpY = (-state.panY / state.zoom - bounds.minY) * scaleY;
                                        const vpW = (canvasRef.current?.clientWidth || 800) / state.zoom * scaleX;
                                        const vpH = (canvasRef.current?.clientHeight || 600) / state.zoom * scaleY;
                                        ctx.strokeRect(vpX, vpY, vpW, vpH);
                                    }
                                }} />
                            </div>
                        </div>

                        {/* Properties Panel */}
                        <div className={`properties-panel ${state.selectedNodes.length > 0 ? 'open' : ''}`}>
                            {selectedNode && (
                                <>
                                    <div className="properties-header">
                                        <div className="properties-title">{NODE_TYPES[selectedNode.type].label}</div>
                                        <div className="properties-subtitle">Configure node properties</div>
                                    </div>
                                    <div className="properties-content">
                                        <div className="property-section">
                                            <div className="property-section-title">
                                                <span className="property-section-toggle">▼</span>
                                                Basic
                                            </div>
                                            <div className="property-fields">
                                                <div className="property-field">
                                                    <label className="property-label">Name</label>
                                                    <input
                                                        type="text"
                                                        className="property-input"
                                                        value={selectedNode.config?.name || ''}
                                                        onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, name: e.target.value } } })}
                                                        placeholder="Node name"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        {selectedNode.type === 'condition' && (
                                            <div className="property-section">
                                                <div className="property-section-title">
                                                    <span className="property-section-toggle">▼</span>
                                                    Condition
                                                </div>
                                                <div className="property-fields">
                                                    <div className="property-field">
                                                        <label className="property-label">Expression</label>
                                                        <input
                                                            type="text"
                                                            className="property-input"
                                                            value={selectedNode.config?.expression || ''}
                                                            onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, expression: e.target.value } } })}
                                                            placeholder="e.g., input.value > 100"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {selectedNode.type === 'tool' && (
                                            <div className="property-section">
                                                <div className="property-section-title">
                                                    <span className="property-section-toggle">▼</span>
                                                    Tool
                                                </div>
                                                <div className="property-fields">
                                                    <div className="property-field">
                                                        <label className="property-label">Tool Name</label>
                                                        <select
                                                            className="property-select"
                                                            value={selectedNode.config?.tool || ''}
                                                            onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, tool: e.target.value } } })}
                                                        >
                                                            <option value="">Select tool...</option>
                                                            <option value="email">Send Email</option>
                                                            <option value="slack">Send Slack Message</option>
                                                            <option value="webhook">HTTP Request</option>
                                                        </select>
                                                    </div>
                                                    <div className="property-field">
                                                        <label className="property-label">Parameters (JSON)</label>
                                                        <textarea
                                                            className="property-input property-textarea"
                                                            value={selectedNode.config?.params || '{}'}
                                                            onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, params: e.target.value } } })}
                                                            placeholder="{}"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {selectedNode.type === 'llm' && (
                                            <div className="property-section">
                                                <div className="property-section-title">
                                                    <span className="property-section-toggle">▼</span>
                                                    LLM
                                                </div>
                                                <div className="property-fields">
                                                    <div className="property-field">
                                                        <label className="property-label">Model</label>
                                                        <select
                                                            className="property-select"
                                                            value={selectedNode.config?.model || ''}
                                                            onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, model: e.target.value } } })}
                                                        >
                                                            <option value="">Select model...</option>
                                                            <option value="gpt4">GPT-4</option>
                                                            <option value="gpt35">GPT-3.5 Turbo</option>
                                                            <option value="claude">Claude</option>
                                                        </select>
                                                    </div>
                                                    <div className="property-field">
                                                        <label className="property-label">Prompt</label>
                                                        <textarea
                                                            className="property-input property-textarea"
                                                            value={selectedNode.config?.prompt || ''}
                                                            onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, prompt: e.target.value } } })}
                                                            placeholder="Enter prompt..."
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {selectedNode.type === 'wait' && (
                                            <div className="property-section">
                                                <div className="property-section-title">
                                                    <span className="property-section-toggle">▼</span>
                                                    Duration
                                                </div>
                                                <div className="property-fields">
                                                    <div className="property-field">
                                                        <label className="property-label">Seconds</label>
                                                        <input
                                                            type="number"
                                                            className="property-input"
                                                            value={selectedNode.config?.duration || 0}
                                                            onChange={(e) => dispatch({ type: 'UPDATE_NODE', payload: { ...selectedNode, config: { ...selectedNode.config, duration: parseInt(e.target.value) } } })}
                                                            min="0"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <button
                                            className="delete-button"
                                            onClick={() => {
                                                if (confirm('Delete this node?')) {
                                                    dispatch({ type: 'DELETE_NODE', payload: selectedNode.id });
                                                    dispatch({ type: 'SET_SELECTED_NODES', payload: [] });
                                                    addToast('Node deleted', 'success');
                                                }
                                            }}
                                        >
                                            Delete Node
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>

                    {/* Bottom Drawer */}
                    <div className={`bottom-drawer ${showDrawer ? 'open' : ''}`}>
                        <div className="drawer-header">
                            <div className="drawer-title">Execution Log</div>
                            <button className="icon-button" onClick={() => setShowDrawer(false)}>✕</button>
                        </div>
                        <div className="drawer-content">
                            {state.logs.map((log, idx) => (
                                <div key={idx} className={`log-entry ${log.type}`}>
                                    {new Date(log.timestamp).toLocaleTimeString()} - {log.message}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Keyboard Shortcuts Overlay */}
                    {showShortcuts && (
                        <div className="shortcuts-overlay" onClick={() => setShowShortcuts(false)}>
                            <div className="shortcuts-panel" onClick={(e) => e.stopPropagation()}>
                                <div className="shortcuts-title">Keyboard Shortcuts</div>

                                <div className="shortcuts-group">
                                    <div className="shortcuts-group-title">Editing</div>
                                    <div className="shortcut-item">
                                        <span>Copy selected nodes</span>
                                        <span className="shortcut-key">Ctrl+C</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Paste nodes</span>
                                        <span className="shortcut-key">Ctrl+V</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Delete selected</span>
                                        <span className="shortcut-key">Delete</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Undo</span>
                                        <span className="shortcut-key">Ctrl+Z</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Redo</span>
                                        <span className="shortcut-key">Ctrl+Shift+Z</span>
                                    </div>
                                </div>

                                <div className="shortcuts-group">
                                    <div className="shortcuts-group-title">Canvas</div>
                                    <div className="shortcut-item">
                                        <span>Pan canvas</span>
                                        <span className="shortcut-key">Mouse drag</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Zoom in/out</span>
                                        <span className="shortcut-key">Scroll wheel</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Deselect all</span>
                                        <span className="shortcut-key">Escape</span>
                                    </div>
                                </div>

                                <div className="shortcuts-group">
                                    <div className="shortcuts-group-title">Nodes</div>
                                    <div className="shortcut-item">
                                        <span>Drag node from palette</span>
                                        <span className="shortcut-key">Drag</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Multi-select nodes</span>
                                        <span className="shortcut-key">Ctrl+Click</span>
                                    </div>
                                    <div className="shortcut-item">
                                        <span>Open node properties</span>
                                        <span className="shortcut-key">Click node</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notifications */}
                    <div className="toast-container">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast ${toast.type}`}>
                                {toast.message}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Error Boundary
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '20px', color: '#ef4444', fontFamily: 'system-ui' }}>
                            <h2>Something went wrong</h2>
                            <p>{this.state.error?.message}</p>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <WorkflowBuilder />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
