<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Office Reset</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, rgba(88, 166, 255, 0.24), transparent 42%),
                linear-gradient(180deg, #0b1220 0%, #060b13 100%);
            color: #e6edf7;
        }

        main {
            width: min(680px, calc(100vw - 48px));
            padding: 32px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 24px;
            background: rgba(11, 18, 32, 0.82);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: rgba(230, 237, 247, 0.84);
        }
    </style>
</head>
<body>
    <main>
        <h1>Virtual office reset pending rebuild</h1>
        <p>The previous office UI has been removed to make room for a cleaner Gather-style redesign.</p>
    </main>
</body>
</html>
