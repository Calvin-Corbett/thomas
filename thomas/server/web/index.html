<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thomas</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Markdown & Code Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <!-- Clean, Professional CSS -->
    <link rel="stylesheet" href="/static/css/tokens.css?v=__THOMAS_VERSION__">
    <link rel="stylesheet" href="/static/css/layout.css?v=__THOMAS_VERSION__">
    <link rel="stylesheet" href="/static/css/components.css?v=__THOMAS_VERSION__">
</head>

<body>
    <div id="app" class="app-layout">
        <!-- Sleek Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 class="brand-text">Thomas</h2>
                <button class="btn-icon" id="newChatSidebar" title="New Chat"><i
                        class="ph ph-pencil-simple"></i></button>
            </div>

            <nav class="sidebar-nav">
                <a href="/" class="nav-item active"><i class="ph ph-chat-teardrop"></i> Chat</a>
                <a href="/mission.html" class="nav-item"><i class="ph ph-rocket"></i> Mission Control</a>
                <a href="/memory.html" class="nav-item"><i class="ph ph-brain"></i> Memory</a>
                <a href="/index.html?search" class="nav-item"><i class="ph ph-magnifying-glass"></i> Search</a>
                <a href="/spend.html" class="nav-item"><i class="ph ph-coin"></i> Spend</a>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item user-btn" id="settingsBtn">
                    <div class="user-avatar">U</div>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <main class="main-content">

            <!-- Top Navigator -->
            <nav class="top-nav">
                <div class="nav-left">
                    <button class="btn-icon sidebar-toggle" id="sidebarToggleBtn"><i class="ph ph-list"></i></button>
                </div>
                <div class="model-select-wrapper">
                    <!-- The new Model Setup Trigger Button -->
                    <button id="modelSetupBtn" class="model-setup-btn" title="Configure Model">
                        <span id="modelSetupCurrentLabel">gemini-pro</span>
                        <i class="ph ph-caret-down"></i>
                    </button>
                    <!-- Kept hidden for backend compatibility mapping when traversing options -->
                    <select id="modelSelector" class="hidden"></select>
                </div>
                <div class="nav-right"></div>
            </nav>

            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <h1 class="welcome-title">How can I help you today?</h1>
                <div class="welcome-suggestions">
                    <button class="suggestion-chip">Write a python script <i class="ph ph-code"></i></button>
                    <button class="suggestion-chip">Summarize my notes <i class="ph ph-text-align-left"></i></button>
                    <button class="suggestion-chip">Brainstorm ideas <i class="ph ph-lightbulb"></i></button>
                </div>
            </div>

            <!-- Chat Stream -->
            <div class="chat-scroll-area hidden" id="chatScrollArea">
                <div class="chat-container" id="chatMessagesInner">
                    <!-- Messages will be injected here -->
                </div>
            </div>

            <!-- Bottom Composer -->
            <div class="composer-container">
                <div class="composer-inner">
                    <div class="composer-box">

                        <div id="attachmentsPreview" class="attachments-preview"></div>

                        <div class="composer-input-row">
                            <button class="btn-icon" id="attachBtn" title="Attach file"><i
                                    class="ph ph-paperclip"></i></button>

                            <textarea class="composer-textarea" id="composerTextarea" rows="1"
                                placeholder="Message Thomas..." autofocus></textarea>

                            <button class="btn-icon" id="micBtn" title="Use microphone"><i
                                    class="ph ph-microphone"></i></button>
                            <button class="btn-send" id="sendBtn" disabled><i class="ph ph-arrow-up"></i></button>
                        </div>

                    </div>
                    <div class="disclaimer">
                        Thomas can make mistakes. Consider verifying important information.
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- User Settings Modal -->
    <div class="thomas-modal" id="settingsModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="btn-icon" id="closeSettingsBtn"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>System Prompt (Personality)</label>
                    <textarea id="settingSystemPrompt" rows="4" placeholder="You are Thomas..."></textarea>
                </div>
                <div class="form-group">
                    <label>OpenAI Theme Mode</label>
                    <select id="settingTheme">
                        <option value="auto">Auto</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="saveSettingsBtn">Save Preferences</button>
            </div>
        </div>
    </div>

    <!-- Rich Model Setup Modal -->
    <div class="thomas-modal" id="modelSetupModal">
        <div class="modal-backdrop" id="modelSetupBackdrop"></div>
        <div class="modal-content model-setup-content">
            <div class="modal-header">
                <h2>Model Setup</h2>
                <button class="btn-icon" id="closeModelSetupBtn"><i class="ph ph-x"></i></button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label>Provider & Profile</label>
                    <!-- Will be populated dynamically by JS just like the old <select> was -->
                    <select id="setupProfileSelector" class="setup-fluid-select"></select>
                </div>

                <div class="form-group split-group">
                    <div class="form-subgroup">
                        <label>Personality Preset</label>
                        <select id="setupPersonalitySelector" class="setup-fluid-select">
                            <option value="">Default Assistant</option>
                            <option value="You are a helpful and friendly companion. Use emojis.">Friendly Companion
                            </option>
                            <option
                                value="You are a terse senior software engineer. Answer directly in code with zero fluff.">
                                Senior Coder</option>
                            <option value="custom">Custom (Override)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group hidden" id="customPersonalityGroup">
                    <label>Custom System Prompt</label>
                    <textarea id="setupCustomPrompt" rows="3" placeholder="You are Thomas..."></textarea>
                </div>

                <div class="form-group">
                    <label>Autonomy Engine Level</label>
                    <div class="segmented-control" id="setupAutonomyGroup">
                        <button class="segment active" data-level="1">L1 <span>Chat</span></button>
                        <button class="segment" data-level="2">L2 <span>Assist</span></button>
                        <button class="segment" data-level="3">L3 <span>Auto</span></button>
                        <button class="segment" data-level="4">L4 <span>Agent</span></button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Token Economy</label>
                    <div class="segmented-control" id="setupEconomyGroup">
                        <button class="segment" data-level="cheap">Cheap</button>
                        <button class="segment active" data-level="balanced">Balanced</button>
                        <button class="segment" data-level="max">Maximum</button>
                    </div>
                </div>

                <div class="form-group switch-group">
                    <div class="switch-label">
                        <strong>Memory Engine</strong>
                        <span>Persist context across sessions natively</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="setupMemoryToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-primary" id="applyModelSetupBtn">Apply Configuration</button>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="docFileInput" style="display:none" multiple />
    <input type="file" id="imageFileInput" accept="image/*" style="display:none" multiple />

    <!-- Javascript Logic -->
    <script type="module" src="/static/js/app.js?v=__THOMAS_VERSION__"></script>
</body>

</html>
