<head>
  <meta charset="utf-8">

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2730%27%20fill%3D%27%238b8cff%27%2F%3E%3Crect%20x%3D%2734%27%20y%3D%2740%27%20width%3D%2713%27%20height%3D%2720%27%20rx%3D%273.5%27%20fill%3D%27%230a0b16%27%2F%3E%3Crect%20x%3D%2753%27%20y%3D%2740%27%20width%3D%2713%27%20height%3D%2720%27%20rx%3D%273.5%27%20fill%3D%27%230a0b16%27%2F%3E%3C%2Fsvg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2730%27%20fill%3D%27%238b8cff%27%2F%3E%3Crect%20x%3D%2734%27%20y%3D%2740%27%20width%3D%2713%27%20height%3D%2720%27%20rx%3D%273.5%27%20fill%3D%27%230a0b16%27%2F%3E%3Crect%20x%3D%2753%27%20y%3D%2740%27%20width%3D%2713%27%20height%3D%2720%27%20rx%3D%273.5%27%20fill%3D%27%230a0b16%27%2F%3E%3C%2Fsvg%3E">
  <!-- Without a manifest, `msedge --app=` runs under EDGE's own app identity, so
       Windows groups the window with Edge and pins Edge's icon to the taskbar.
       Declaring one lets Thomas be installed as an app in his own right, with his
       own icon, his own taskbar slot, and no browser chrome. -->
  <link rel="manifest" href="/static/thomas.webmanifest?v=__THOMAS_WEB_BUILD__">
  <meta name="application-name" content="Thomas">
  <meta name="theme-color" content="#8b8cff">
  <!-- A browser driven by a program (Playwright, a test, an agent's UI check) sets navigator.webdriver; a person's
       browser never does. In one, every never-ending animation is paused as it starts; animations that end (a fade,
       a slide) still run to their end, so the page looks as it would after them. Measured 2026-11-06: one idle Chat
       page in headless Chromium took 16.25 CPU-seconds every 15 seconds for its 26 never-ending animations (nebula,
       stars, robots), and 0.52 with them paused; Thomas's tests and checks keep several such pages open at once.
       Add ?motion=1 to the URL to keep the motion on. -->
  <script>(function(){try{if(!navigator.webdriver||/[?&]motion=1(&|$)/.test(location.search))return;var d=document;d.documentElement.setAttribute('data-automated','');function hold(t){(t&&t.getAnimations?t.getAnimations(t===d?undefined:{subtree:true}):[]).forEach(function(a){var e=a.effect;if(e&&e.getComputedTiming&&e.getComputedTiming().iterations===Infinity)a.pause()})}d.addEventListener('animationstart',function(ev){hold(ev.target)},true);addEventListener('load',function(){hold(d)})}catch(e){}})();</script>
  <!-- Shared shell rules FIRST: unified_modes.css owns the mode switch and the
       #tc-shell[data-surface-mode] visibility flips that reveal the Code/Work
       workspace. Dropping it during the CSS split left the mode surface
       display:none forever (P1 caught by the codex PR review, 2026-07-19). -->
  <!-- Start the slow things at once. The recent-chats list is asked for as the page is read, so the sidebar fills
       while the scripts are still loading instead of after them. And the browser-style chrome (title bar, tabs,
       bookmarks) is loaded by a chain of eight scripts, one after the next; preloading them lets all eight download
       together, so the chain only has to run them. The chrome is skipped in the desktop app and when switched off,
       so those are not preloaded there. -->
  <link rel="preload" as="fetch" crossorigin href="/api/chats?mode=chat">
  <script>try{window.__thomasAssetStamps=JSON.parse('__THOMAS_ASSET_STAMPS__')}catch(e){window.__thomasAssetStamps={}}</script>
  <script>(function(){try{if(window.thomasDesktop||window.parent!==window||localStorage.getItem("thomas_browser_shell")==="off"||/[?&]browser=0(&|$)/.test(location.search))return;var S=window.__thomasAssetStamps||{},v=function(f){return "?v="+(S[f]||"__THOMAS_WEB_BUILD__")},h=document.head,a=function(rel,as,f){var l=document.createElement("link");l.rel=rel;if(as)l.as=as;l.href="/static/"+f+v(f);h.appendChild(l);};a("preload","style","css/browser_shell.css");["panel","desktop","keys","search","web","docs_policy","docs"].forEach(function(n){a("preload","script","js/browser_shell_"+n+".js");});a("preload","script","js/browser_shell.js");}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/css/tokens.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_modes.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_activity.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_results.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/thomas_bot.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_agents.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_cards.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_composer.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_plain.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_header.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_home.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_continuation.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_loading.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/build_speed.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_work_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_work_details.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/ui_edit_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/ui_redesign.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/mode_peek.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/sidebar_history.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/workspace_chat_drawer.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/chat_shell.css?v=__THOMAS_WEB_BUILD__">

</head>
<body data-ui-workspace="chat">
  <!-- Shell. Default vars below = Nebula Core (mirrors the design's inline root). -->
  <div id="tc-shell" class="tc-shell" data-theme="nebula" data-ui-id="chat.shell" data-ui-label="Thomas Chat shell" data-ui-policy="root protected" style="position: relative; display: flex; height: 100vh; width: 100%; overflow: hidden; font-family: var(--font-sans); color: var(--c-text); background: var(--c-bg); --c-bg: #070912; --c-sidebar: rgba(11,14,26,0.72); --c-surface: rgba(255,255,255,0.04); --c-surface-2: rgba(255,255,255,0.08); --c-hover: rgba(255,255,255,0.06); --c-border: rgba(255,255,255,0.10); --c-border-2: rgba(255,255,255,0.17); --c-text: #eef0fb; --c-dim: rgba(238,240,251,0.66); --c-muted: rgba(238,240,251,0.42); --c-accent: #8b8cff; --c-accent-ink: #0a0b16; --c-accent-soft: rgba(139,140,255,0.16); --c-accent-line: rgba(139,140,255,0.45); --c-user-bg: rgba(124,118,235,0.20); --c-user-text: #eef0fb; --c-composer-bg: rgba(16,19,34,0.86); --c-menu-bg: #15142b; --c-shadow: 0 18px 50px rgba(2,4,12,0.55); --bot-primary: #9ad8ff; --bot-secondary: #5aaeff; --bot-glow: rgba(90,174,255,0.5); --bot-trim: #0d1117; --r-card: 14px; --r-composer: 18px; --font-head: 'Manrope', system-ui, sans-serif; --font-label: 'Manrope', system-ui, sans-serif; --font-sans: 'Manrope', system-ui, sans-serif; --font-serif: 'Newsreader', Georgia, serif; --font-mono: 'JetBrains Mono', ui-monospace, monospace; --sidebar-margin: 0;">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="tc-sidebar" data-ui-id="chat.sidebar" data-ui-label="Chat sidebar" data-ui-policy="move resize" data-ui-constraints="minWidth=220;minHeight=420;maxWidth=420" style="position: relative; z-index: 2; flex: 0 0 auto; width: 280px; display: flex; flex-direction: column; background: var(--c-sidebar); border-right: 1px solid var(--c-border); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: margin-left 0.28s cubic-bezier(.4,0,.2,1); margin-left: var(--sidebar-margin, 0);">
      <!-- No brand header here. Your direction, 2026-09-06: "remove the whole
           brand header in the sidebar, the face icon and the word Thomas, there
           are two icons on the left and we want one; keep the Chat/Build/Work
           switch." The one Thomas mark lives in the tab strip above. -->
      <div class="tc-sidebar-top" style="padding: 16px 12px 12px;">
        <div id="tc-mode-switch" role="tablist" aria-label="Thomas mode" data-ui-id="chat.mode-switch" data-ui-label="Chat Code Work switch" data-ui-policy="move">
          <!-- Chat, Build and Work are the same Thomas head wearing a different
               tool. The head with two eyes IS the Thomas mark, so the three read
               as aspects of one thing rather than three unrelated tabs.
               data-thomas-mode stays "code": it is the adapter's id, not a label. -->
          <button type="button" class="tc-mode-button is-active" role="tab" aria-selected="true" tabindex="0" data-thomas-mode="chat"><span class="tc-mode-icon" data-thomas-icon="chat" aria-hidden="true"></span><span>Chat</span></button>
          <button type="button" class="tc-mode-button" role="tab" aria-selected="false" tabindex="-1" data-thomas-mode="code"><span class="tc-mode-icon" data-thomas-icon="build" aria-hidden="true"></span><span>Build</span></button>
          <button type="button" class="tc-mode-button" role="tab" aria-selected="false" tabindex="-1" data-thomas-mode="work"><span class="tc-mode-icon" data-thomas-icon="work" aria-hidden="true"></span><span>Work</span></button>
        </div>
        <!-- Starting something new is ONE control now, and it sits above the
             search box: you create far more often than you search. -->
        <div id="tc-newrow"><button id="tc-newchat" class="hv-newchat" data-ui-id="chat.action.new" data-ui-label="New chat button" data-ui-policy="control" style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 30px; padding: 0 11px; border-radius: 9px; border: 1px dashed var(--c-border-2); background: transparent; color: var(--c-text); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s;">
          <span data-thomas-icon="plus" data-thomas-icon-size="14" aria-hidden="true" style="display: grid; place-items: center;"></span> New chat
        </button><button id="tc-search-open" type="button" class="hv-soft" aria-label="Search" title="Search" aria-expanded="false"><span data-thomas-icon="search" data-thomas-icon-size="15" aria-hidden="true" style="display: grid; place-items: center;"></span></button>
        <label class="tc-search-field" style="align-items: center; gap: 8px; padding: 0 11px; border-radius: 9px; background: var(--c-surface); border: 1px solid var(--c-border); cursor: text;">
          <span data-thomas-icon="search" data-thomas-icon-size="15" aria-hidden="true" style="display: grid; place-items: center; color: var(--c-muted);"></span>
          <input id="tc-search" placeholder="Search chats" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--c-text); font-family: inherit; font-size: 13.5px;" />
        </label></div>
      </div>

      <nav class="tc-sidebar-nav" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 4px 12px 12px;">
        <!-- No collapse chevron: the Build redesign removed every ⌄/⌃ mark.
             The list scrolls in its own box, so a long history never buries
             the workspaces below it. -->
        <div class="tc-history-head" style="flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 10px 2px 6px;">
          <div id="tc-history-label" style="flex: 1; min-width: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Recent chats</div>
          <!-- Names the sort it is currently using. A bare icon here was a
               control nobody could read — and the funnel glyph was missing from
               the icon map, so it rendered as a literal dot. -->
          <button id="tc-history-filter" class="hv-icon" title="Sort and filter" aria-haspopup="menu" aria-expanded="false" style="flex: 0 0 auto; display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border: 1px solid var(--c-border); border-radius: 6px; background: transparent; color: var(--c-dim); font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; transition: all .14s;">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M6.75 12.5h2.5"/></svg><span id="tc-history-sort-label">Recent</span>
          </button>
        </div>
        <div id="tc-chats" class="tc-scroll" data-ui-id="chat.history" data-ui-label="Recent chats" data-ui-policy="move resize" data-ui-constraints="minWidth=180;minHeight=60" style="flex: 1 1 auto; min-height: 60px; overflow-y: auto;"></div>
        <div class="tc-workspaces-head" style="flex: 0 0 auto; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 14px 6px 6px; border-top: 1px solid var(--c-border); margin-top: 6px;">Workspaces</div>
        <div id="tc-workspaces" data-ui-id="chat.workspaces" data-ui-label="Workspaces" data-ui-policy="move resize" data-ui-constraints="minWidth=180;minHeight=120" style="flex: 0 0 auto; max-height: 42%; overflow-y: auto;" class="tc-scroll"></div>
      </nav>

      <div class="tc-sidebar-foot" style="padding: 10px 12px; border-top: 1px solid var(--c-border);">
        <button id="tc-settings" class="hv-soft" data-ui-id="chat.action.settings" data-ui-label="Settings button" data-ui-policy="control" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--c-dim); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all .14s;">
          <span data-thomas-icon="settings" data-thomas-icon-size="17" aria-hidden="true" style="display: grid; place-items: center;"></span> Settings
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main data-ui-id="chat.main" data-ui-label="Chat workspace" data-ui-policy="root protected" style="position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <!-- position: relative anchors the centred chat title below; the pills
           stay a plain flex row and the title never becomes a flex item, so it
           cannot push them around no matter how long the name is. -->
      <header data-ui-id="chat.topbar" data-ui-label="Top toolbar" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=50" style="position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--c-border);">
        <button id="tc-sidebar-toggle" class="hv-icon" title="Toggle sidebar" style="width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer; transition: all .15s;">
          <i class="ph ph-sidebar-simple" style="font-size: 17px;"></i>
        </button>
        <div style="position: relative; display: flex; align-items: center; gap: 6px;" data-model-switch="1">
          <button id="tc-model-btn" class="hv-pill" title="Switch model" aria-haspopup="menu" data-ui-id="chat.action.model" data-ui-label="Model switcher" data-ui-policy="control">
            <!-- Neutral until the real selection arrives (setProfile fills it in).
                 A hardcoded model name here is a claim, and it survives a failed
                 /api/profiles fetch: the pill would sit there naming a model that
                 was never selected. -->
            <span id="tc-model">Loading…</span>
          </button>
          <div id="tc-model-menu" class="tc-scroll">
            <div class="tc-mm-head">
              <span class="tc-mm-title" id="tc-model-title">Models</span>
              <button type="button" id="tc-model-reload" class="tc-mm-reload" title="Check for new models" aria-label="Check for new models">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
              </button>
            </div>
            <div id="tc-model-options"></div>
          </div>
        </div>
        <!-- The conversation's own name, on the model row, centred. Its only
             other home would be a heading above the thread, and a full-width
             heading there eats the reading area it exists to name. Absolutely
             centred and ellipsised: long names truncate, the pills never move.
             Empty and hidden until a named conversation is open, so a new chat
             shows nothing rather than a placeholder that claims a name. -->
        <div id="tc-chat-title" data-ui-id="chat.title" data-ui-label="Chat title" data-ui-policy="control" hidden></div>
        <!-- Build's header: the project chip (folder icon + project name) and,
             beside it as plain text, the task's name. Hidden outside Build (modeChanged
             below); unified_code_mode.js writes the three texts, and an empty
             chip hides itself. In Build nothing else shows in this bar: the
             model and theme pills live in the browser bar above. -->
        <div id="tc-code-header" data-ui-id="code.header" data-ui-label="Build header" data-ui-policy="control" hidden>
          <span class="tc-code-header-chip is-project" data-code-header-project></span>
          <span class="tc-code-header-title" data-code-header-title></span>
        </div>
        <div class="tc-topbar-spacer" style="flex: 1;"></div>
        <button id="tc-canvas-btn" class="hv-surface" title="Open Thomas Canvas" data-ui-id="chat.action.canvas" data-ui-label="Canvas button" data-ui-policy="control" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--c-accent-line); background: var(--c-accent-soft); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
          <i id="tc-primary-action-icon" class="ph ph-chalkboard-simple" style="font-size: 16px; color: var(--c-accent);"></i><span id="tc-primary-action-label">Canvas</span>
        </button>
        <div style="position: relative;" data-theme-switch="1">
          <button id="tc-theme-btn" class="hv-pill" title="Switch theme" data-ui-id="chat.action.theme" data-ui-label="Theme switcher" data-ui-policy="control" style="display: flex; align-items: center; gap: 9px; padding: 7px 11px 7px 9px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
            <span style="display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--c-border-2);">
              <span id="tc-sw1" style="width: 11px; height: 18px; background: var(--sw-1);"></span>
              <span id="tc-sw2" style="width: 11px; height: 18px; background: var(--sw-2);"></span>
              <span id="tc-sw3" style="width: 11px; height: 18px; background: var(--sw-3);"></span>
            </span>
            <span id="tc-theme-name">Dark</span>
          </button>
          <div id="tc-theme-menu" style="display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 268px; padding: 8px; border-radius: 14px; background: var(--c-menu-bg); border: 1px solid var(--c-border-2); box-shadow: var(--c-shadow);">
            <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 6px 8px 8px;">Theme — each its own world</div>
            <!-- Which account answers (email and plan). It used to sit in the model
                 menu; the browser shell moves it into the profile menu. -->
            <div id="tc-model-account" style="display: none; padding: 0 8px 8px; font-size: 11px; color: var(--c-dim); line-height: 1.35;"></div>
            <div id="tc-theme-options"></div>
          </div>
        </div>
      </header>

      <!-- body row: chat column + canvas column -->
      <div id="tc-body-row" data-ui-id="chat.body" data-ui-label="Conversation workspace" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=360" style="position: relative; flex: 1; min-height: 0; display: flex;">
        <!-- The one live workspace frame is deliberately inside the body row. The
             literal Chat top bar above it never disappears or gets duplicated. -->
        <iframe id="tc-ws-frame" class="tc-workspace-frame" title="Workspace" style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 20; background: var(--c-bg); background: color-mix(in srgb, var(--c-bg) 82%, transparent); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);"></iframe>
        <div id="tc-primary-column" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <section id="tc-mode-surface" aria-live="polite" aria-label="Mode workspace" data-ui-id="chat.mode.surface" data-ui-label="Mode workspace" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=280" style="display:none;"></section>
          <div id="tc-scroll" class="tc-scroll" style="flex: 1; min-height: 0; overflow-y: auto;">
            <!-- WELCOME -->
            <div id="tc-welcome" class="tc-rail" data-ui-id="chat.welcome" data-ui-label="Welcome dashboard" data-ui-policy="move resize" data-ui-constraints="minWidth=320;minHeight=260" style="max-width: 720px; margin: 0 auto; padding: clamp(20px, 4vh, 56px) 24px 32px; display: flex; flex-direction: column; align-items: center; text-align: center;">
              <div style="height: 124px; display: grid; place-items: center; margin-bottom: 2px; animation: tc-hover 4.2s ease-in-out infinite;" data-bot data-primary="var(--bot-primary)" data-secondary="var(--bot-secondary)" data-trim="var(--bot-trim)" data-glow="var(--bot-glow)" data-scale="2.5" data-flame="true"></div>
              <h1 id="tc-welcome-title" style="margin: 0; font-family: var(--font-head); font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -0.02em;">Where to, Captain?</h1>

    const msgRefs = []; // per-message { bubbleEl } for in-place streaming updates
    // Sidebar chat list — starts EMPTY and is populated only from the real server

    let chatList = [];

    state.modelMenuOpen = false;

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    // Activity cards and status lines render as PLAIN text — worker prose with
    // markdown markers ("**360**", "`file`") must not leak raw syntax there.
    // Strip unpaired markers too: upstream truncation can remove their closing pair.
    function deMd(s) { return String(s == null ? '' : s).replace(/\*\*/g, '').replace(/__/g, '').replace(/`/g, '').replace(/(^|\s)#{1,6}\s+/gm, '$1'); }
    const { botHTML, hydrateBots, avatar, applyTheme, selectTheme, toggleThemeMenu, renderThemeMenu, mountBuildBadge } = window.ThomasChatThemeControls.create({
      get THEMES() { return THEMES; },
      get THEME_META() { return THEME_META; },

    const { profileModelOptions, hydrateProfileModels, persistModelSelection, setProfile, toggleModelMenu, closeModelMenu, modelFamilyOf, profileIsUsable, renderModelMenu } = window.ThomasChatModelPicker.create({

    window.addEventListener('thomas:ui-ai-edit-request', stageUiAiEdit);
    const { bubbleInner, _settledStatusText, copyMessageText, buildMessageNode, reportFriction, reportPageError, editMessageFrom, appendMessage, updateStreamingBubble, syncChatTitle, syncView, syncDynamic, autosize, scrollEnd } = window.ThomasChatMessageView.create({

      get isChatBusy() { return isChatBusy; },
      get mdToHtml() { return mdToHtml; },
      get msgRefs() { return msgRefs; },
      get renderActivity() { return renderActivity; },
      get scrollEl() { return scrollEl; },
      get sendIconEl() { return sendIconEl; },
      get shell() { return shell; },
      get state() { return state; },
      get syncAttachmentState() { return syncAttachmentState; },
      get threadEl() { return threadEl; },
      get turnFlow() { return turnFlow; },
      get welcomeEl() { return welcomeEl; },
    });

    window.addEventListener('error', (e) => reportPageError(e.message || 'unknown error'));
    window.addEventListener('unhandledrejection', (e) => reportPageError(String((e.reason && e.reason.message) || e.reason || 'unhandled rejection')));
    const { detectArtifact, detectVisualIntent, detectCanvasIntent, _handoffStep, elapsedLabel, activityHTML, artifactDownloadUrl, artifactHTML, _thinkingCard, _stepsLog, _fmtStepTime, _activityDetail } = window.ThomasChatActivityView.create({
      get _isTextArtifact() { return _isTextArtifact; },

      get esc() { return esc; },
    });

    // Tick the running clocks in place rather than re-rendering: a re-render
    // while the user is typing a steer note would wipe what they had typed, and
    // the poll only repaints when the card is expanded — so a collapsed card
    // would have sat frozen, which is the problem this is meant to solve.
    setInterval(() => {
      document.querySelectorAll('[data-act-elapsed]').forEach(el => {
        const started = Number(el.getAttribute('data-started') || 0);
        if (started) el.textContent = elapsedLabel(Date.now() - started);
      });
    }, 1000);
    const { fetchActivityDetail, steerActivity, renderActivity, requestTaskCancel, cancelTask, isChatBusy, stopChat, addToolStep, finishToolStep, _completionVerified, _mergeArtifacts, _maybeCollapseActivity, _settleActivityForReply, _canvasReviewed } = window.ThomasChatActivityActions.create({
      get _settledStatusText() { return _settledStatusText; },
      get abortController() { return abortController; }, set abortController(value) { abortController = value; },
      get activityHTML() { return activityHTML; },
      get bubbleInner() { return bubbleInner; },
      get canvasRender() { return canvasRender; },
      get canvasStop() { return canvasStop; },
      get captureConversation() { return captureConversation; },
      get msgRefs() { return msgRefs; },
      get reportFriction() { return reportFriction; },
      get setExternalBusy() { return setExternalBusy; },
      get state() { return state; },
    });

    const { handleHandoff, handleTaskContract, reconcileHandoff, announceCompletion, queueCompletionAnnouncement, pollDelegations } = window.ThomasChatDelegationUpdates.create({
      get _canvasReviewed() { return _canvasReviewed; },
      get _completionVerified() { return _completionVerified; },
      get _handoffStep() { return _handoffStep; },
      get _maybeCollapseActivity() { return _maybeCollapseActivity; },
      get _mergeArtifacts() { return _mergeArtifacts; },
      get appendMessage() { return appendMessage; },
      get canvasConstruct() { return canvasConstruct; },
      get canvasLiveHTML() { return canvasLiveHTML; },
      get canvasRender() { return canvasRender; },
      get canvasState() { return canvasState; }, set canvasState(value) { canvasState = value; },
      get canvasStop() { return canvasStop; },
      get captureConversation() { return captureConversation; },
      get fetchActivityDetail() { return fetchActivityDetail; },
      get renderActivity() { return renderActivity; },
      get scrollEnd() { return scrollEnd; },
      get state() { return state; },
    });

    const { send, chunkText, applyModelRuntimeReceipt, streamReal } = window.ThomasChatStreamActions.create({
      get _pendingCanvasIntent() { return _pendingCanvasIntent; }, set _pendingCanvasIntent(value) { _pendingCanvasIntent = value; },
      get _settleActivityForReply() { return _settleActivityForReply; },
      get abortController() { return abortController; }, set abortController(value) { abortController = value; },
      get addToolStep() { return addToolStep; },
      get appendMessage() { return appendMessage; },
      get attachmentsReady() { return attachmentsReady; },
      get autosize() { return autosize; },
      get canvasDocumentDone() { return canvasDocumentDone; },
      get captureConversation() { return captureConversation; },
      get detectVisualIntent() { return detectVisualIntent; },
      get ensureSession() { return ensureSession; },
      get finishToolStep() { return finishToolStep; },
      get handleHandoff() { return handleHandoff; },
      get handleTaskContract() { return handleTaskContract; },
      get inputEl() { return inputEl; },
      get maybePromptChatGPTConnection() { return maybePromptChatGPTConnection; },
      get msgRefs() { return msgRefs; },
      get pollDelegations() { return pollDelegations; },
      get profilesData() { return profilesData; }, set profilesData(value) { profilesData = value; },
      get refreshChats() { return refreshChats; },
      get renderActivity() { return renderActivity; },
      get renderAttachments() { return renderAttachments; },
      get reportFriction() { return reportFriction; },
      get scrollEnd() { return scrollEnd; },
      get setExternalBusy() { return setExternalBusy; },

      get syncDynamic() { return syncDynamic; },
      get syncView() { return syncView; },
      get turnFlow() { return turnFlow; },
      get updateStreamingBubble() { return updateStreamingBubble; },
    });

    // ChatGPT-connect prompt: lives in js/chat_connect_prompt.js; page state
    // (active profile, loaded profiles) flows in through the factory.
    const { maybePromptChatGPTConnection } = window.ThomasChatConnectPrompt.create({ getProfile: () => state.profile, getProfiles: () => profilesData, getShell: () => shell });
    let _pendingCanvasIntent = false; // Does this turn want a renderable result?
    const { newChat, restoreVerifiedChatArtifacts, restoreDelegationCards, threadRenderSignature, hydrateSelectedChat, selectChat, fillAndSend, toggleSidebar } = window.ThomasChatSessionRestore.create({
      get _canvasReviewed() { return _canvasReviewed; },
      get _completionVerified() { return _completionVerified; },
      get _mergeArtifacts() { return _mergeArtifacts; },
      get abortController() { return abortController; }, set abortController(value) { abortController = value; },
      get autosize() { return autosize; },
      get buildMessageNode() { return buildMessageNode; },
      get chatList() { return chatList; }, set chatList(value) { chatList = value; },
      get chatSelectionToken() { return chatSelectionToken; }, set chatSelectionToken(value) { chatSelectionToken = value; },
      get ensureSession() { return ensureSession; },
      get inputEl() { return inputEl; },

      get msgRefs() { return msgRefs; },

      get shell() { return shell; },

      get syncDynamic() { return syncDynamic; },
      get syncView() { return syncView; },
      get threadEl() { return threadEl; },
      get turnFlow() { return turnFlow; },
      get timer() { return timer; }, set timer(value) { timer = value; },
    });


    // ---------- Thomas Canvas (real-time render surface) ----------
    // The WORKER drives this, not the chatbot: it opens when the worker actually
    // starts building a renderable result, shows the worker's REAL live progress
    // while it works (no fake placeholder), and renders the actual artifact the
    // moment it lands. A finished artifact always wins over the building view.
    let canvasState = { mode: 'blank', worker: '', progress: '', url: '', name: '' };
    const { openCanvas, closeCanvas, resetCanvasForConversation, canvasBuilding, _isTextArtifact, canvasRender, openConversationCanvas, canvasStop, renderCanvas } = window.ThomasChatCanvasView.create({
      get _build() { return _build; }, set _build(value) { _build = value; },
      get _canvasShown() { return _canvasShown; },
      get _injectReveal() { return _injectReveal; },
      get _staticDoc() { return _staticDoc; },
      get canvasBody() { return canvasBody; },
      get canvasEl() { return canvasEl; },
      get canvasState() { return canvasState; }, set canvasState(value) { canvasState = value; },
      get canvasStatus() { return canvasStatus; },
      get chatSelectionToken() { return chatSelectionToken; }, set chatSelectionToken(value) { chatSelectionToken = value; },
      get esc() { return esc; },
      get mdToHtml() { return mdToHtml; },
      get shell() { return shell; },
      get state() { return state; },
    });

    const { _stripFence, _injectReveal, _staticDoc, _buildDeliver, canvasConstruct, _liveSourceShell, _closePartialHtml, _injectLivePreviewStyle, _livePreviewHtml, canvasLiveHTML, canvasDocument, canvasDocumentDone } = window.ThomasChatCanvasStream.create({
      get _build() { return _build; }, set _build(value) { _build = value; },
      get canvasBody() { return canvasBody; },
      get canvasState() { return canvasState; }, set canvasState(value) { canvasState = value; },
      get esc() { return esc; },
      get openCanvas() { return openCanvas; },
      get renderCanvas() { return renderCanvas; },
      get state() { return state; },
    });

    // Doc-keys whose build entrance has already played this session. A re-show of the same
    // content renders STATIC (below) so a finished visual never re-animates on re-open.
    const _canvasShown = new Set();
    // ---- Live construction: stream elements into a stable shell iframe as the recipe is
    // written, so the visual ASSEMBLES ITSELF in real time (Claude-design "watch it build"). ----
    let _build = { execId: '', els: [], delivered: 0, ready: false, done: false };
    // The shell iframe announces 'ready' once its listener is live; only then do we deliver
    // (postMessages sent before the iframe loads would be lost).
    window.addEventListener('message', function (e) {
      const d = e && e.data;
      if (!d || d.t !== 'ready') return;
      // Only the build frame may say it is ready. Every frame on this page can
      // post here, including the library previews, which render pages a model
      // wrote. A forged 'ready' arriving before the real shell installs its
      // listener makes _buildDeliver flush queued elements into a window that
      // is not listening and then advance past them, so that batch of the
      // Canvas silently renders empty. Matching on source is what the rest of
      // the UI already does (workspace_shell.js, workspace_chat_drawer.js).
      const frame = canvasBody.querySelector('iframe.tc-build-frame');
      if (!frame || e.source !== frame.contentWindow) return;
      _build.ready = true;
      _buildDeliver();
    });
    const { _looksLikeDoc, _mdInline, _tableCells, _tableAligns, mdToHtml } = window.ThomasChatMarkdown.create({
      get esc() { return esc; },
    });

    // Code mode renders Thomas's replies too, and was showing the markdown raw:
    // "Built it as a standalone **Nova** calculator experience in `index.html`."
    // 16 of 17 real Code replies carry markdown, so nearly every one read as
    // punctuation noise while the identical prose in Chat rendered properly.
    //
    // Exposed rather than copied. `_mdInline` escapes FIRST (`s = esc(s)`) and
    // only then introduces tags, and its link rule accepts http(s) alone -- a
    // second implementation is how one of them stops doing that.
    // `mdInline` is exported too, for Code's progress notes. Those render inside
    // a <span> and are short prose: 54% of real ones carry backticks or bold,
    // only 11% carry bullet lines. The inline renderer emits <code>/<strong>/<em>
    // and nothing block-level, so it drops into the existing markup without a
    // container change -- and a leading "- " left as a literal dash reads fine.
    //
    // Guarded: the markdown contract harness evaluates this script in a VM with
    // no `window`, and an unguarded assignment took that test down.
    if (typeof window !== 'undefined') window.ThomasMarkdown = { mdToHtml, mdInline: _mdInline };
    // ---------- Tools (AI settings), attachments (+), voice (mic) ----------
    function saveDials() { window.ThomasChatPreferences.saveDials(state.dials); }
    const DIAL_FIELDS = window.ThomasChatPreferences.DIAL_FIELDS;

    const {
      toggleToolsMenu, closeToolsMenu, buildCanRunModel, hiddenForBuildNote,
      toggleLibraryMenu, closeLibraryMenu,
      libraryVisibleProjects, libraryCardHTML, mountLibraryPreviews,
      chooseLibraryProject, bindLibraryActions, onFiles, renderAttachments, setupMic, attachmentsReady, syncAttachmentState,
    } = window.ThomasChatComposerPanels.create({
      state, esc, inputEl, autosize, syncDynamic, DIAL_FIELDS, saveDials,
    });
    // Mid-reply sends park here (visible "Queued" note on their own bubble)
    // and drain, in order, as each reply finishes. Lives in js/chat_turn_flow.js.
    const turnFlow = window.ThomasChatTurnFlow.create({
      state, inputEl, msgRefs, autosize, syncDynamic, syncView, appendMessage, renderAttachments, scrollEnd,
      canSendQueued: selection => window.ThomasChatModelSelection.ensureCurrent(inputEl)
        && (!selection || (selection.profile === state.profile && selection.modelId === state.modelId)),
      sendNow: (text, files) => { _pendingCanvasIntent = !!detectVisualIntent(text); return streamReal(text, files); },
    });

    window.ThomasChatMediaBridge.bind({ state, inputEl, captureConversation, ensureSession, isChatBusy, attachmentsReady, appendMessage, updateStreamingBubble, buildMessageNode, threadEl, renderActivity, autosize, syncDynamic, syncView, scrollEnd, refreshChats });
    window.ThomasChatShellBindings.create({
      get autosize() { return autosize; },
      get bindLibraryActions() { return bindLibraryActions; },
      get closeCanvas() { return closeCanvas; },
      get closeLibraryMenu() { return closeLibraryMenu; },
      get closeModelMenu() { return closeModelMenu; },
      get closeToolsMenu() { return closeToolsMenu; },
      get esc() { return esc; },
      get inputEl() { return inputEl; },
      get isChatBusy() { return isChatBusy; },
      get libraryCardHTML() { return libraryCardHTML; },
      get libraryVisibleProjects() { return libraryVisibleProjects; },
      get mountLibraryPreviews() { return mountLibraryPreviews; },
      get newChat() { return newChat; },
      get onFiles() { return onFiles; },
      get openConversationCanvas() { return openConversationCanvas; },
      get openWorkspace() { return openWorkspace; },
      get renderChats() { return renderChats; },
      get send() { return send; },
      get state() { return state; },
      get stopChat() { return stopChat; },
      get syncDynamic() { return syncDynamic; },
      get toggleLibraryMenu() { return toggleLibraryMenu; },
      get toggleModelMenu() { return toggleModelMenu; },
      get toggleSidebar() { return toggleSidebar; },
      get toggleThemeMenu() { return toggleThemeMenu; },
      get toggleToolsMenu() { return toggleToolsMenu; },
    });


    function boot() {
      return window.ThomasChatBoot.start({
        state,
        search: window.location.search,
        getMode: () => state.surfaceMode,
        getInput: () => inputEl.value,
        captureConversation,
        storage: localStorage,
        fetch: (...args) => fetch(...args),
        getProfiles: () => profilesData,
        setProfiles: profiles => { profilesData = profiles; },
        hydrateProfileModels,
        setProfile,
        renderModelMenu,
        refreshChats,
        getChats: () => chatList,
        selectChat,
        ensureSession,
      }).ready;
    }
    // Reload on the Chat tab (js/browser_shell.js) calls this: history, model choices and the open
    // conversation are read again in place, so no other tab is closed and a running turn is left alone.
    window.ThomasChatSurface = { reload: async () => {
      await boot();
      const row = chatList.find(c => c.id === state.activeChat);
      if (row) await hydrateSelectedChat(row, chatSelectionToken);
    } };

    function modeChanged(nextMode) {
      state.surfaceMode = nextMode;
      state.search = '';
      const search = document.getElementById('tc-search'); if (search) search.value = '';
      showChat();
      if (nextMode !== 'chat') resetCanvasForConversation();
      const projectWrap = document.getElementById('tc-code-project-wrap');
      if (projectWrap) {
        projectWrap.hidden = nextMode !== 'code';
        projectWrap.style.display = nextMode === 'code' ? 'block' : 'none';
      }
      const codeHeader = document.getElementById('tc-code-header');
      if (codeHeader) codeHeader.hidden = nextMode !== 'code';
      closeLibraryMenu();
      renderChats();
      syncDynamic();
    }
    function setExternalBusy() {
      if (window.ThomasUnifiedModes && window.ThomasUnifiedModes.refreshChrome) window.ThomasUnifiedModes.refreshChrome();
      syncDynamic();
    }
    function announceModeStatus(message) {
      const surface = document.getElementById('tc-mode-surface');
      if (surface) surface.setAttribute('aria-label', String(message || 'Mode workspace'));
    }
    if (window.ThomasUnifiedModes) {
      window.ThomasUnifiedModes.connect({
        announce: announceModeStatus,
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, ...window.ThomasChatModelSelection.roleContext(), dials: Object.assign({}, state.dials) }),
        isBusy: isChatBusy,
        modeChanged,
        renderHistory: renderChats,
        setBusy: setExternalBusy,
      });
    }
    if (window.ThomasWorkspaceChat) {
      window.ThomasWorkspaceChat.connect({
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, ...window.ThomasChatModelSelection.roleContext(), dials: Object.assign({}, state.dials) }),
      });
    }

    // ---------- Init ----------
    hydrateBots();
    renderChats();
    renderWorkspaces();
    // Built-in workspaces paint first; plugin-claimed ones arrive when the
    // marketplace answers and re-render. A slow or failing marketplace costs a
    // moment, never the sidebar.
    void loadPluginWorkspaces();
    renderCards();
    renderThemeMenu();
    applyTheme(state.theme);
    syncView();
    syncDynamic();
    autosize();
    setupMic();
    renderAttachments();
    window.ThomasChatBoot.notifyReady();
    mountBuildBadge();
    boot();
  })();
