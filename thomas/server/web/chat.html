<!DOCTYPE html>
<!--
  Thomas Chat — faithful vanilla port of the "Thomas Chat.dc.html" design concept
  imported from claude.ai/design (project 85187ffb-...-d43e5033f957).

  This is a self-contained surface (markup + CSS + JS, no build step, no React/DC
  runtime). Served by Thomas at /static/thomas_chat.html. Five "living world"
  themes (Nebula / Dark / Light / Aurora / Sandstone), each with its own animated
  background, design tokens, fonts and welcome copy; sidebar, model pill, theme
  switcher, welcome hero, streaming message thread, composer, and the Thomas Canvas
  (whiteboard / document / chart). Behavior mirrors the design's DCLogic component.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thomas Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238b8cff'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='sans-serif' font-size='64' font-weight='700' fill='white'%3ET%3C/text%3E%3C/svg%3E">
  <!-- Shared shell rules FIRST: unified_modes.css owns the mode switch and the
       #tc-shell[data-surface-mode] visibility flips that reveal the Code/Work
       workspace. Dropping it during the CSS split left the mode surface
       display:none forever (P1 caught by the codex PR review, 2026-07-19). -->
  <link rel="stylesheet" href="/static/css/unified_modes.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_activity.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_results.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_work_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_work_details.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/ui_edit_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/workspace_chat_drawer.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/chat_shell.css?v=__THOMAS_WEB_BUILD__">
</head>
<body data-ui-workspace="chat">
  <!-- Shell. Default vars below = Nebula Core (mirrors the design's inline root). -->
  <div id="tc-shell" class="tc-shell" data-theme="nebula" data-ui-id="chat.shell" data-ui-label="Thomas Chat shell" data-ui-policy="root protected" style="position: relative; display: flex; height: 100vh; width: 100%; overflow: hidden; font-family: var(--font-sans); color: var(--c-text); background: var(--c-bg); --c-bg: #070912; --c-sidebar: rgba(11,14,26,0.72); --c-surface: rgba(255,255,255,0.04); --c-surface-2: rgba(255,255,255,0.08); --c-hover: rgba(255,255,255,0.06); --c-border: rgba(255,255,255,0.10); --c-border-2: rgba(255,255,255,0.17); --c-text: #eef0fb; --c-dim: rgba(238,240,251,0.66); --c-muted: rgba(238,240,251,0.42); --c-accent: #8b8cff; --c-accent-ink: #0a0b16; --c-accent-soft: rgba(139,140,255,0.16); --c-accent-line: rgba(139,140,255,0.45); --c-user-bg: rgba(124,118,235,0.20); --c-user-text: #eef0fb; --c-composer-bg: rgba(16,19,34,0.86); --c-menu-bg: #15142b; --c-shadow: 0 18px 50px rgba(2,4,12,0.55); --bot-primary: #9ad8ff; --bot-secondary: #5aaeff; --bot-glow: rgba(90,174,255,0.5); --bot-trim: #0d1117; --r-card: 14px; --r-composer: 18px; --font-head: 'Manrope', system-ui, sans-serif; --font-label: 'Manrope', system-ui, sans-serif; --font-sans: 'Manrope', system-ui, sans-serif; --font-serif: 'Newsreader', Georgia, serif; --font-mono: 'JetBrains Mono', ui-monospace, monospace; --sidebar-margin: 0;">

    <!-- ===================== LIVING WORLDS (behind everything) ===================== -->
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">

      <!-- NEBULA -->
      <div class="tc-world is-nebula">
        <div style="position: absolute; inset: -12%;">
          <div style="position: absolute; inset: 0; background:
              radial-gradient(42% 46% at 24% 30%, rgba(124,108,255,0.42), transparent 60%),
              radial-gradient(38% 42% at 80% 22%, rgba(64,196,224,0.28), transparent 62%),
              radial-gradient(48% 50% at 64% 82%, rgba(196,86,196,0.24), transparent 60%),
              radial-gradient(64% 64% at 50% 50%, rgba(38,28,86,0.32), transparent 72%);
              animation: tc-neb-drift 160s ease-in-out infinite alternate, tc-neb-hue 110s ease-in-out infinite alternate;"></div>
          <div style="position: absolute; inset: 0; background-image:
              radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,0.95), transparent),
              radial-gradient(1px 1px at 28% 64%, rgba(255,255,255,0.7), transparent),
              radial-gradient(1.6px 1.6px at 47% 32%, rgba(214,224,255,0.9), transparent),
              radial-gradient(1px 1px at 63% 72%, rgba(255,255,255,0.65), transparent),
              radial-gradient(1.3px 1.3px at 78% 44%, rgba(255,255,255,0.85), transparent),
              radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,0.6), transparent),
              radial-gradient(1px 1px at 38% 88%, rgba(255,255,255,0.7), transparent),
              radial-gradient(1.2px 1.2px at 8% 52%, rgba(255,255,255,0.8), transparent),
              radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,0.7), transparent),
              radial-gradient(1.5px 1.5px at 70% 58%, rgba(230,224,255,0.9), transparent);
              background-size: 360px 360px; animation: tc-stars 150s linear infinite, tc-twinkle 5s ease-in-out infinite;"></div>
        </div>
        <div style="position: absolute; right: 6%; bottom: -90px; width: 240px; height: 240px; animation: tc-planet-drift 90s ease-in-out infinite;">
          <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #8f8cff, #4b3fa6 58%, #221a52 100%); box-shadow: inset -26px -20px 50px rgba(0,0,0,0.55), 0 0 70px rgba(124,108,255,0.22);"></div>
          <div style="position: absolute; top: 44%; left: -22%; width: 144%; height: 36px; border-radius: 50%; border: 3px solid rgba(173,160,255,0.5); transform: rotate(-18deg) scaleY(0.34); animation: tc-spin 80s linear infinite;"></div>
        </div>
        <div style="position: absolute; left: 9%; top: 14%; width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #7fe4cf, #2f8f93 60%, #16454f 100%); box-shadow: inset -10px -8px 22px rgba(0,0,0,0.5), 0 0 36px rgba(71,215,172,0.25); animation: tc-planet-drift 70s ease-in-out infinite reverse;"></div>
        <div style="position: absolute; right: 26%; top: 22%; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #e7ecff, #97a0c8 70%, #5b6088); box-shadow: inset -4px -3px 8px rgba(0,0,0,0.4);"></div>
        <div style="position: absolute; top: 17%; left: 0; animation: tc-fly-right 30s linear infinite;">
          <div style="animation: tc-bob 4s ease-in-out infinite;" data-bot data-primary="#bcd8ff" data-secondary="#6f9bff" data-trim="#0a0e1c" data-glow="rgba(120,150,255,0.55)" data-scale="0.62" data-flame="true"></div>
        </div>
        <div style="position: absolute; top: 33%; left: 0; transform: scaleX(-1); animation: tc-fly-left 40s linear infinite;">
          <div style="animation: tc-bob 5s ease-in-out infinite;" data-bot data-primary="#c8b8ff" data-secondary="#8b7bff" data-trim="#0a0e1c" data-glow="rgba(150,120,255,0.5)" data-scale="0.5" data-flame="true"></div>
        </div>
        <div style="position: absolute; top: 64%; left: 0; animation: tc-fly-right 52s linear infinite;">
          <div style="animation: tc-bob 6s ease-in-out infinite;" data-bot data-primary="#a8e8ff" data-secondary="#5ec4e6" data-trim="#0a0e1c" data-glow="rgba(94,196,230,0.45)" data-scale="0.38" data-flame="true"></div>
        </div>
      </div>

      <!-- AURORA -->
      <div class="tc-world is-aurora">
        <div style="position: absolute; top: -34%; left: -20%; width: 140%; height: 95%; background: linear-gradient(115deg, transparent 22%, rgba(52,224,176,0.30) 42%, rgba(70,160,255,0.22) 56%, transparent 76%); filter: blur(44px); animation: tc-aurora 20s ease-in-out infinite;"></div>
        <div style="position: absolute; top: -44%; left: -10%; width: 130%; height: 100%; background: linear-gradient(98deg, transparent 30%, rgba(120,255,214,0.2) 50%, transparent 72%); filter: blur(54px); animation: tc-aurora 30s ease-in-out infinite reverse;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(1.6px 1.6px at 20% 16%, rgba(255,255,255,0.9), transparent), radial-gradient(1.2px 1.2px at 60% 8%, rgba(255,255,255,0.7), transparent), radial-gradient(1.4px 1.4px at 84% 22%, rgba(255,255,255,0.8), transparent), radial-gradient(1.2px 1.2px at 38% 30%, rgba(255,255,255,0.7), transparent); background-size: 100% 100%;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20% 20%, rgba(255,255,255,0.8), transparent), radial-gradient(2px 2px at 70% 40%, rgba(255,255,255,0.6), transparent), radial-gradient(1.5px 1.5px at 45% 70%, rgba(255,255,255,0.7), transparent); background-size: 260px 260px, 320px 320px, 200px 200px; animation: tc-snow 24s linear infinite; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, transparent, rgba(6,30,30,0.6)); clip-path: polygon(0 100%, 0 56%, 12% 38%, 24% 60%, 38% 30%, 52% 58%, 66% 26%, 80% 54%, 92% 36%, 100% 56%, 100% 100%);"></div>
        <div style="position: absolute; top: 38%; left: 0; animation: tc-fly-right 46s linear infinite;">
          <div style="animation: tc-bob 5.5s ease-in-out infinite;" data-bot data-primary="#a8f0da" data-secondary="#34e0b0" data-trim="#06302a" data-glow="rgba(52,224,176,0.5)" data-scale="0.52" data-flame="true"></div>
        </div>
      </div>

      <!-- SANDSTONE -->
      <div class="tc-world is-sandstone">
        <div style="position: absolute; top: 12%; right: 16%; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(255,214,150,0.95), rgba(240,170,90,0.5) 60%, transparent 72%); animation: tc-sun 14s ease-in-out infinite;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(120,90,50,0.05) 1px, transparent 1px); background-size: 4px 4px; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, transparent, rgba(206,158,104,0.28)); clip-path: ellipse(75% 100% at 30% 130%);"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 150px; background: linear-gradient(180deg, transparent, rgba(176,120,68,0.3)); clip-path: ellipse(70% 100% at 80% 140%);"></div>
        <div style="position: absolute; bottom: 92px; left: 0; animation: tc-sled 56s linear infinite;">
          <div style="position: relative; animation: tc-bob 6s ease-in-out infinite;">
            <div data-bot data-primary="#ffd6a7" data-secondary="#ffad60" data-trim="#3a2a1a" data-glow="rgba(192,96,60,0.45)" data-scale="0.5" data-flame="false"></div>
            <span style="position: absolute; left: -6px; bottom: -6px; width: 52px; height: 7px; border-radius: 6px; background: linear-gradient(90deg, rgba(192,96,60,0.2), #c0603c, rgba(192,96,60,0.2)); box-shadow: 0 6px 14px rgba(192,96,60,0.4);"></span>
          </div>
        </div>
      </div>

      <!-- DARK (blueprint workshop) -->
      <div class="tc-world is-dark">
        <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(110,155,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(110,155,255,0.06) 1px, transparent 1px); background-size: 44px 44px;"></div>
        <div style="position: absolute; left: 0; right: 0; height: 160px; background: linear-gradient(180deg, transparent, rgba(110,155,255,0.06), transparent); animation: tc-scan 11s linear infinite;"></div>
        <div style="position: absolute; left: 16%; top: 30%; width: 8px; height: 8px; border-radius: 50%; background: rgba(110,155,255,0.5); box-shadow: 0 0 12px rgba(110,155,255,0.6); animation: tc-node 9s ease-in-out infinite;"></div>
        <div style="position: absolute; left: 24%; top: 46%; width: 6px; height: 6px; border-radius: 50%; background: rgba(110,155,255,0.4); animation: tc-node 12s ease-in-out infinite reverse;"></div>
        <div style="position: absolute; right: 20%; top: 60%; width: 7px; height: 7px; border-radius: 50%; background: rgba(110,155,255,0.45); animation: tc-node 10s ease-in-out infinite;"></div>
        <div style="position: absolute; right: 13%; top: 26%; opacity: 0.85; animation: tc-bob 6s ease-in-out infinite;" data-bot data-primary="#9ad8ff" data-secondary="#5aaeff" data-trim="#0a0e16" data-glow="rgba(90,174,255,0.3)" data-scale="0.62" data-flame="false"></div>
      </div>

      <!-- LIGHT (daylight studio) -->
      <div class="tc-world is-light">
        <div style="position: absolute; top: 16%; left: 0; width: 200px; height: 64px; border-radius: 999px; background: radial-gradient(circle at 40% 50%, rgba(255,255,255,0.95), rgba(225,233,245,0.5) 70%, transparent); filter: blur(8px); animation: tc-cloud 70s linear infinite;"></div>
        <div style="position: absolute; top: 40%; left: 0; width: 150px; height: 52px; border-radius: 999px; background: radial-gradient(circle at 40% 50%, rgba(255,255,255,0.9), rgba(225,233,245,0.4) 70%, transparent); filter: blur(8px); animation: tc-cloud 96s linear infinite; animation-delay: -30s;"></div>
        <div style="position: absolute; left: 22%; top: 28%; width: 8px; height: 8px; border-radius: 2px; background: rgba(47,107,255,0.5); transform: rotate(45deg); animation: tc-spark 5s ease-in-out infinite;"></div>
        <div style="position: absolute; left: 70%; top: 34%; width: 6px; height: 6px; border-radius: 2px; background: rgba(47,107,255,0.4); transform: rotate(45deg); animation: tc-spark 6s ease-in-out infinite; animation-delay: -2s;"></div>
        <div style="position: absolute; right: 14%; top: 24%; animation: tc-hover 5s ease-in-out infinite;" data-bot data-primary="#7db0ff" data-secondary="#2f6bff" data-trim="#16233a" data-glow="rgba(47,107,255,0.28)" data-scale="0.6" data-flame="false"></div>
      </div>
    </div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="tc-sidebar" data-ui-id="chat.sidebar" data-ui-label="Chat sidebar" data-ui-policy="move resize" data-ui-constraints="minWidth=220;minHeight=420;maxWidth=420" style="position: relative; z-index: 2; flex: 0 0 auto; width: 280px; display: flex; flex-direction: column; background: var(--c-sidebar); border-right: 1px solid var(--c-border); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: margin-left 0.28s cubic-bezier(.4,0,.2,1); margin-left: var(--sidebar-margin, 0);">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 14px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 30px; height: 30px; border-radius: 9px; background: var(--c-accent); display: grid; place-items: center; box-shadow: 0 0 18px var(--c-accent-soft); flex: 0 0 auto;">
            <span style="display: flex; gap: 4px;">
              <span style="width: 5px; height: 6px; border-radius: 1px; background: var(--c-accent-ink);"></span>
              <span style="width: 5px; height: 6px; border-radius: 1px; background: var(--c-accent-ink);"></span>
            </span>
          </span>
          <span style="font-weight: 800; font-size: 18px; letter-spacing: -0.01em;">Thomas</span>
        </div>
        <button id="tc-newchat-top" class="hv-icon" title="New chat" data-ui-id="chat.action.new-top" data-ui-label="New chat" data-ui-policy="control" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer; transition: all .15s;">
          <i class="ph ph-pencil-simple-line" style="font-size: 17px;"></i>
        </button>
      </div>

      <div style="padding: 0 12px 12px;">
        <div id="tc-mode-switch" role="tablist" aria-label="Thomas mode" data-ui-id="chat.mode-switch" data-ui-label="Chat Code Work switch" data-ui-policy="move">
          <button type="button" class="tc-mode-button is-active" role="tab" aria-selected="true" tabindex="0" data-thomas-mode="chat"><i class="ph ph-chats-circle" aria-hidden="true"></i><span>Chat</span></button>
          <button type="button" class="tc-mode-button" role="tab" aria-selected="false" tabindex="-1" data-thomas-mode="code"><i class="ph ph-code" aria-hidden="true"></i><span>Code</span></button>
          <button type="button" class="tc-mode-button" role="tab" aria-selected="false" tabindex="-1" data-thomas-mode="work"><i class="ph ph-briefcase" aria-hidden="true"></i><span>Work</span></button>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; background: var(--c-surface); border: 1px solid var(--c-border); cursor: text;">
          <i class="ph ph-magnifying-glass" style="font-size: 15px; color: var(--c-muted);"></i>
          <input id="tc-search" placeholder="Search chats" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--c-text); font-family: inherit; font-size: 13.5px;" />
        </label>
      </div>

      <nav style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 4px 12px 12px;">
        <button id="tc-newchat" class="hv-newchat" data-ui-id="chat.action.new" data-ui-label="New chat button" data-ui-policy="control" style="flex: 0 0 auto; width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 11px; margin-bottom: 8px; border-radius: 10px; border: 1px dashed var(--c-border-2); background: transparent; color: var(--c-text); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .15s;">
          <i class="ph ph-plus" style="font-size: 15px;"></i> New chat
        </button>
        <div id="tc-history-label" style="flex: 0 0 auto; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 10px 6px 6px;">Recent chats</div>
        <div id="tc-chats" class="tc-scroll" data-ui-id="chat.history" data-ui-label="Recent chats" data-ui-policy="move resize" data-ui-constraints="minWidth=180;minHeight=60" style="flex: 1 1 auto; min-height: 60px; overflow-y: auto;"></div>
        <div style="flex: 0 0 auto; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 14px 6px 6px; border-top: 1px solid var(--c-border); margin-top: 6px;">Workspaces</div>
        <div id="tc-workspaces" data-ui-id="chat.workspaces" data-ui-label="Workspaces" data-ui-policy="move resize" data-ui-constraints="minWidth=180;minHeight=120" style="flex: 0 0 auto; max-height: 42%; overflow-y: auto;" class="tc-scroll"></div>
      </nav>

      <div style="padding: 10px 12px; border-top: 1px solid var(--c-border);">
        <button id="tc-settings" class="hv-soft" data-ui-id="chat.action.settings" data-ui-label="Settings button" data-ui-policy="control" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--c-dim); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all .14s;">
          <i class="ph ph-gear-six" style="font-size: 17px;"></i> Settings
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main data-ui-id="chat.main" data-ui-label="Chat workspace" data-ui-policy="root protected" style="position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <header data-ui-id="chat.topbar" data-ui-label="Top toolbar" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=50" style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--c-border);">
        <button id="tc-sidebar-toggle" class="hv-icon" title="Toggle sidebar" style="width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer; transition: all .15s;">
          <i class="ph ph-sidebar-simple" style="font-size: 17px;"></i>
        </button>
        <div style="position: relative;" data-model-switch="1">
          <button id="tc-model-btn" class="hv-pill" title="Switch model" data-ui-id="chat.action.model" data-ui-label="Model switcher" data-ui-policy="control" style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text); font-family: var(--font-label); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
            <span style="width: 7px; height: 7px; border-radius: 999px; background: var(--c-accent); box-shadow: 0 0 8px var(--c-accent);"></span>
            <!-- Neutral until the real selection arrives (setProfile fills it in).
                 A hardcoded model name here is a claim, and it survives a failed
                 /api/profiles fetch: the chip would sit there naming a model that
                 was never selected, which is the same lie the message labels had. -->
            <span id="tc-model">Loading…</span>
            <i class="ph ph-caret-down" style="font-size: 12px; color: var(--c-muted);"></i>
          </button>
          <div id="tc-model-menu" style="display: none; position: absolute; left: 0; top: calc(100% + 8px); z-index: 40; width: 300px; max-height: 60vh; overflow-y: auto; padding: 8px; border-radius: 14px; background: var(--c-menu-bg); border: 1px solid var(--c-border-2); box-shadow: var(--c-shadow);" class="tc-scroll">
            <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 6px 8px 8px;">Model</div>
            <div id="tc-model-options"></div>
          </div>
        </div>
        <div style="flex: 1;"></div>
        <button id="tc-canvas-btn" class="hv-surface" title="Open Thomas Canvas" data-ui-id="chat.action.canvas" data-ui-label="Canvas button" data-ui-policy="control" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--c-accent-line); background: var(--c-accent-soft); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">

         theme tokens. Quiet at rest, legible on hover, and it turns amber when
         the tree has uncommitted edits, because that build is not the commit
         it claims to be. -->
    <button id="tc-build-badge" type="button" hidden title="Copy this build's details"

  <style>
    /* Everything lives here rather than inline. An inline `color` outranks any
       stylesheet rule without !important, so styling the base state inline
       silently killed both the hover state and the uncommitted-tree state --
       the attribute was set and nothing changed colour. */
    #tc-build-badge {
      position: absolute; right: 10px; bottom: 8px; z-index: 40;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--c-border); background: var(--c-surface);
      font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .02em;
      line-height: 1; color: var(--c-muted); cursor: pointer; opacity: .55;
      transition: opacity .14s ease, color .14s ease, border-color .14s ease;
    }
    #tc-build-badge[hidden] { display: none; }
    #tc-build-badge:hover, #tc-build-badge:focus-visible { opacity: 1; color: var(--c-dim); border-color: var(--c-border-2); }
    #tc-build-badge:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
    /* An uncommitted tree is the one state worth interrupting for: what is
       running is not the commit named beside it. */
    #tc-build-badge[data-dirty="1"] { color: #e8b45c; border-color: rgba(232,180,92,.42); opacity: .82; }
    #tc-build-badge[data-dirty="1"]:hover, #tc-build-badge[data-dirty="1"]:focus-visible { color: #f5cd85; opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #tc-build-badge { transition: none; } }
    /* NOT FIXED, MEASURED 2026-07-30. This badge overlaps the "Thomas can make
       mistakes" line below about 1210px, and 640 is far too low to prevent it.
       Measured by comparing the PAINTED text extents (a Range over each text
       node, not the element boxes -- the disclaimer's box spans the whole
       composer column while its text is centred and much narrower, which
       reports a 168px overlap at 1280 where the picture shows a 37px gap):

         1220px  clear        1200px  1px        1160px  21px
         1120px  41px         1100px  46px       900px  133px

       Left alone deliberately. The crossover moves with the badge's own text --
       "uncommitted" adds roughly 60px, a shorter commit or port takes some
       back -- so any fixed breakpoint is approximate, and the honest ones are
       bad trades: 1280 hides a build identity the owner uses on the commonest
       laptop width, and anything lower still overlaps on a clean tree. The fix
       that would actually hold is structural -- disclaimer and badge in one
       flex row so the layout engine keeps them apart -- and that is a footer
       rewrite, not a number.

       Severity, stated plainly so the next person can weigh it: both elements
       are low-emphasis and the badge is 55% opaque, so this is untidy rather
       than misleading. Nothing reads as wrong; it just looks unfinished. */
    @media (max-width: 640px) { #tc-build-badge { display: none; } }
  </style>

      shell.style.setProperty('--sw-1', t.sw[0]); shell.style.setProperty('--sw-2', t.sw[1]); shell.style.setProperty('--sw-3', t.sw[2]);

        b.innerHTML = `<span style="display: inline-flex; border-radius: 7px; overflow: hidden; border: 1px solid var(--c-border-2); flex: 0 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.25);">

    // ---------- Model selector ----------
    function profileModelOptions(p) {
      if (p && Array.isArray(p.models) && p.models.length) return p.models;
      return [{ id: String(p && (p.model || p.name) || 'model'), display_name: String(p && (p.model || p.name) || 'model'), is_default: true, available: true }];
    }
    async function hydrateProfileModels() {
      await Promise.all(profilesData.map(async p => {
        const provider = String(p && p.provider || '').toLowerCase().replace(/-/g, '_');
        if (provider !== 'openai_codex') return;
        try {
          const r = await fetch('/api/openai-codex/models?profile=' + encodeURIComponent(p.name));
          if (!r.ok) return;
          const data = await r.json();
          if (Array.isArray(data.models) && data.models.length) p.models = data.models;
        } catch (e) {}
      }));
    }
    function persistModelSelection(profileName, modelId) {
      fetch('/api/preferences', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ advanced: { model: { active_profile: profileName, model_id: modelId } } }),
      }).catch(() => {});
    }
    function setProfile(p, modelOption) {
      if (!p) return;
      const models = profileModelOptions(p);
      const choice = modelOption || models.find(m => m.is_default && m.available !== false) || models.find(m => m.available !== false) || models[0];
      if (!choice || choice.available === false) return;
      state.profile = p.name;
      state.modelId = choice.id || p.model || '';
      state.modelLabel = String(choice.display_name || choice.id || p.model || p.name || 'model').split('/').pop();
      const el = document.getElementById('tc-model'); if (el) el.textContent = state.modelLabel;
      const effortControl = p.chat_controls && p.chat_controls.model && p.chat_controls.model.reasoning_effort;
      const validEfforts = effortControl && Array.isArray(effortControl.options) ? effortControl.options.map(o => String(o.value)) : [];
      if (validEfforts.length && !validEfforts.includes(String(state.dials.effort))) {
        state.dials.effort = String(effortControl.default_value || 'medium'); saveDials();
      }
      if (modelOption) persistModelSelection(state.profile, state.modelId);
    }
    function toggleModelMenu() {
      state.modelMenuOpen = !state.modelMenuOpen;
      document.getElementById('tc-model-menu').style.display = state.modelMenuOpen ? 'block' : 'none';
      if (state.modelMenuOpen) renderModelMenu();
    }
    function closeModelMenu() { state.modelMenuOpen = false; document.getElementById('tc-model-menu').style.display = 'none'; }
    // Which vendor a profile belongs to. Grouped by FAMILY rather than listed
    // flat because the flat list was one row per model across every profile,
    // and with only one provider holding a key the four models that actually
    // work were buried among fifteen that cannot run — so the picker read as
    // "you have one model" when it has four.
    const MODEL_FAMILIES = [
      // Matched on the profile NAME, never on `provider`: `openai_compat` is a
      // wire protocol, not a vendor, and almost every profile here speaks it —
      // Gemini, Mistral, Groq and xAI included. Matching the provider put all
      // of them under "OpenAI".
      { id: 'openai',    label: 'OpenAI',      match: p => /^(openai|openai_codex|litellm)$/.test(p.name) },
      { id: 'anthropic', label: 'Anthropic',   match: p => p.name === 'anthropic' || String(p.provider) === 'anthropic' },
      { id: 'google',    label: 'Google',      match: p => p.name === 'gemini' },
      { id: 'xai',       label: 'xAI',         match: p => p.name === 'xai' },
      { id: 'meta',      label: 'Meta Llama',  match: p => /^(groq|together|deepinfra|fireworks|cerebras)$/.test(p.name) },
      { id: 'mistral',   label: 'Mistral',     match: p => p.name === 'mistral' },
      { id: 'local',     label: 'On this PC',  match: p => p.name === 'local' },
    ];
    function modelFamilyOf(p) {
      const hit = MODEL_FAMILIES.find(f => { try { return f.match(p); } catch (e) { return false; } });
      return hit || { id: 'other', label: 'Other providers' };
    }
    function profileIsUsable(p) { return !!p.has_api_key || p.provider === 'openai_codex' || p.name === 'local'; }
    function renderModelMenu() {
      const wrap = document.getElementById('tc-model-options'); if (!wrap) return;
      wrap.innerHTML = '';
      // Build family -> [{profile, model}] in the declared order, so the list
      // does not reshuffle when a key is added.
      const groups = new Map();
      profilesData.forEach(p => {
        const fam = modelFamilyOf(p);
        if (!groups.has(fam.id)) groups.set(fam.id, { label: fam.label, entries: [] });
        profileModelOptions(p).forEach(m => groups.get(fam.id).entries.push({ p, m }));
      });
      const ordered = [...MODEL_FAMILIES, { id: 'other', label: 'Other providers' }]
        .map(f => [f.id, groups.get(f.id)]).filter(([, g]) => g && g.entries.length);

      // Seed ONCE, not per render. Opening the family that holds the current
      // selection is right the first time the menu is drawn and wrong every
      // time after: the accordion closes the others, this rule immediately
      // reopened the selected one, and two families ended up expanded.
      if (!state.modelFamilySeeded) {
        const owning = ordered.find(([, g]) => g.entries.some(e => e.p.name === state.profile && String(e.m.id || '') === String(state.modelId || '')));
        if (owning) state.modelFamilyOpen[owning[0]] = true;
        state.modelFamilySeeded = true;
      }

      ordered.forEach(([famId, group]) => {
        const ready = group.entries.filter(e => profileIsUsable(e.p) && e.m.available !== false).length;
        const holdsSelection = group.entries.some(e => e.p.name === state.profile && String(e.m.id || '') === String(state.modelId || ''));
        const isOpen = !!state.modelFamilyOpen[famId];

        const head = document.createElement('button');
        head.type = 'button'; head.className = 'hv-soft';
        head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        head.style.cssText = `width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 9px; margin-bottom: 2px; border-radius: 10px; border: 1px solid ${holdsSelection ? 'var(--c-accent-line)' : 'transparent'}; background: ${isOpen ? 'var(--c-surface-2)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: pointer; text-align: left; transition: all .14s;`;
        head.innerHTML = `<i class="ph ph-caret-right" style="font-size: 12px; color: var(--c-muted); transform: rotate(${isOpen ? '90deg' : '0deg'}); transition: transform .14s;"></i>
          <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700;">${esc(group.label)}</span>
          <span style="font-size: 10.5px; color: ${ready ? 'var(--c-accent)' : 'var(--c-muted)'};">${ready ? `${ready} ready` : 'needs key'}</span>`;
        head.addEventListener('click', () => {
          // Accordion: opening one closes the rest, so a long list never
          // stacks up and the menu keeps its height.
          const wasOpen = !!state.modelFamilyOpen[famId];
          state.modelFamilyOpen = {};
          state.modelFamilyOpen[famId] = !wasOpen;
          renderModelMenu();
        });
        wrap.appendChild(head);
        if (!isOpen) return;

        group.entries.forEach(({ p, m }) => {
          const sel = p.name === state.profile && String(m.id || '') === String(state.modelId || '');
          const usable = profileIsUsable(p) && m.available !== false;
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'hv-soft'; b.disabled = !usable;
          if (m.unavailable_reason) b.title = String(m.unavailable_reason);
          b.style.cssText = `width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 9px 7px 26px; border-radius: 10px; border: 1px solid ${sel ? 'var(--c-accent-line)' : 'transparent'}; background: ${sel ? 'var(--c-accent-soft)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: ${usable ? 'pointer' : 'not-allowed'}; text-align: left; transition: all .14s; margin-bottom: 2px; opacity: ${usable ? '1' : '0.45'};`;
          const status = !profileIsUsable(p) ? 'needs key' : (m.available === false ? 'unavailable on this connection' : esc(p.name));
          b.innerHTML = `<span style="flex: 1; min-width: 0;">
              <span style="display: block; font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${esc(String(m.display_name || m.id || p.name).split('/').pop())}</span>
              <span style="display: block; font-size: 10.5px; color: var(--c-muted);">${status}</span>
            </span>
            <i class="ph ph-check" style="font-size: 15px; color: var(--c-accent); opacity: ${sel ? '1' : '0'};"></i>`;
          if (usable) b.addEventListener('click', () => { setProfile(p, m); closeModelMenu(); });
          wrap.appendChild(b);
        });
      });
    }

    // ---------- Sidebar lists ----------
    function fmtChatDate(ms) {
      const n = Number(ms); if (!n) return '';
      const d = new Date(n), now = new Date();
      if (isNaN(d.getTime())) return '';
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const y = new Date(now); y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      const opts = d.getFullYear() === now.getFullYear() ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' };
      return d.toLocaleDateString([], opts);
    }
    function renderChats() {
      const query = String(state.search || '').trim().toLowerCase();
      const wrap = document.getElementById('tc-chats');
      if (window.ThomasUnifiedModes && window.ThomasUnifiedModes.renderHistory(wrap, query)) return;
      const chats = query
        ? chatList.filter(c => (String(c.title || '') + '\n' + String(c.preview || '')).toLowerCase().includes(query))
        : chatList;
      wrap.innerHTML = '';
      if (!chats.length) {
        wrap.innerHTML = `<div data-chat-empty style="padding:12px 10px;color:var(--c-muted);font-size:12px;line-height:1.5;">${query ? 'No matching chats.' : 'No chats yet.'}</div>`;
        return;
      }
      chats.forEach(c => {
        const sel = c.id === state.activeChat;
        const b = document.createElement('button');
        b.className = 'hv-soft';
        b.style.cssText = `width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 9px 11px; margin-bottom: 2px; border-radius: 10px; border: 1px solid transparent; background: ${sel ? 'var(--c-surface-2)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: pointer; transition: all .14s;`;
        const date = fmtChatDate(c.updatedAt);
        b.innerHTML = `<span style="display: flex; align-items: baseline; gap: 8px;">
            <span style="flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: ${sel ? '1' : '0.92'};">${esc(c.title)}</span>
            ${date ? `<span style="flex-shrink: 0; font-size: 11px; color: var(--c-muted);">${esc(date)}</span>` : ''}
          </span>
          <span style="font-size: 11.5px; color: var(--c-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(c.preview)}</span>`;
        b.addEventListener('click', () => selectChat(c.id));
        wrap.appendChild(b);

    // ---------- Composer dynamic state (send button) ----------

    // ---------- Artifact detection (mirrors _detectArtifact) ----------

    // A VISUAL request (chart, design, drawing, UI) — these go to the canvas WORKER,
    // which makes a real visual. Thomas's chat text must NEVER stand in for one.
    function detectVisualIntent(text) {
      const lc = String(text).toLowerCase().replace(/\b(chart of accounts|graph (database|query|theory)|(medical|patient|astrology|birth) chart|plot (summary|of (the )?(story|book|movie)))\b/g, ' ');
      const visual = /\b((pie|bar|line|area|scatter|gantt|org(anizational)?) (chart|graph|plot)|chart|graph|plot|dashboard|histogram|heat ?map|timeline|mind ?map|flow ?chart|diagram|mock ?up|wireframe|infographic|poster|banner|logo|landing page|web ?page|ui (design|mockup)|illustration|drawing|picture|image|svg|playable (browser )?game|interactive (chart|graph|dashboard|site|app|visual))\b/, action = /\b(create|make|draw|sketch|design|paint|illustrate|render|visuali[sz]e|generate|build|show|display|present)\b/, leading = /^\s*((please|can you|could you)\s+)?(a |an |the )?(chart|graph|plot|dashboard|histogram|heat ?map|timeline|mind ?map|flow ?chart|diagram|mock ?up|wireframe|infographic|logo|poster|banner|landing page|illustration|drawing)\b/;
      return visual.test(lc) && (action.test(lc) || leading.test(lc));

    function detectCanvasIntent(text) {
      if (detectArtifact(text)) return true;
      if (detectVisualIntent(text)) return true;
      const lc = String(text).toLowerCase();
      const verb = /\b(write|draft|compose|create|make|generate|build|design|put together|give me|outline|plan|list out|draw up|prepare|format)\b/;
      const noun = /\b(recipe|essay|letter|story|poem|poems|lyric|lyrics|song|list|plan|outline|guide|itinerary|schedule|agenda|table|article|post|blog|script|screenplay|instructions|steps|checklist|tutorial|walkthrough|summary|report|resume|cv|cover letter|email|template|menu|workout|routine|playbook|spec|readme|paragraph|paragraphs|write[- ]?up|document|doc)\b/;
      return verb.test(lc) && noun.test(lc);

    // ---------- Activity: thinking, tools, and the REAL handoff (delegation events) ----------
    // ONE consolidated, expandable activity card per turn. Header = current
    // "Handed off to <worker>" + the action underneath + status; the ▾ caret

    // as smaller lines, reasoning at the bottom). Steps update in place — never

    function _handoffStep(a, id) { return a.steps.find(s => s.kind === 'handoff' && s.id === id); }
    // Tick the running clocks in place rather than re-rendering: a re-render

    // would have sat frozen, which is the problem this is meant to solve.
    setInterval(() => {
      document.querySelectorAll('[data-act-elapsed]').forEach(el => {

    // "12s", "3m 48s", "1h 04m" — short, and always moving.
    function elapsedLabel(ms) {

      if (total < 60) return total + 's';
      const m = Math.floor(total / 60), s = total % 60;
      if (m < 60) return m + 'm ' + String(s).padStart(2, '0') + 's';
      return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
    }
    function activityHTML(m) {

      }

      const anyCancelled = a.cancelled || steps.some(s => s.status === 'cancelled');
      const anyFailed = steps.some(s => s.status === 'failed');
      const overall = anyRunning ? '' : anyCancelled ? 'Cancelled' : anyFailed ? 'Failed' : 'Done';
      const overallColor = anyFailed ? '#ff7a7a' : anyCancelled ? 'var(--c-muted)' : 'var(--c-accent)';
      const handoffSteps = steps.filter(s => s.kind === 'handoff');
      const primary = handoffSteps.length ? handoffSteps[handoffSteps.length - 1] : null;
      const groupSize = Math.max(handoffSteps.length, Number(a.expectedHandoffCount || 0));
      const grouped = groupSize > 1;
      const completedWorkers = handoffSteps.filter(s => s.status === 'completed').length;
      const failedWorkers = handoffSteps.filter(s => s.status === 'failed' || s.status === 'cancelled').length;
      // Thomas-first framing: the header reads like Thomas is doing the work

    // ---------- Thomas Library (choose what Thomas works on) ----------
    // A folder path is not how anyone remembers what they made. 88 of the 113
    // projects here are files called "index" — the only way to tell them apart
    // is to LOOK at them, so each card renders the real thing, live.
    //
    // Every preview is a grant against the deliverable preview service, which
    // keeps at most 32 alive and evicts by LRU. Mounting 113 iframes would
    // therefore destroy sockets while the user scrolled, so frames are mounted
    // only as cards come into view and never more than PREVIEW_BUDGET at once.
    const LIBRARY_PREVIEW_BUDGET = 12;
    // Every DISTINCT preview costs a cookie in the 127.0.0.1 jar for an hour,
    // and cookies carry no port, so the deliverable service's cookies are sent
    // to this app too. At ~71 bytes each, 115 of them exceed the 8190-byte
    // header limit and every request to Thomas starts failing with a 400 until
    // they expire. With 111 generated apps, one unbroken scroll of this shelf
    // very nearly gets there on its own -- no other surface mounts previews in
    // that quantity, so this panel is the only thing that can reach it.
    //
    // 32 is not arbitrary: it is the deliverable service's own concurrent-grant
    // ceiling (_MAX_ACTIVE_PREVIEW_GRANTS), so this asks for nothing the server
    // would not already hold. Past it, cards keep their title and monogram and
    // simply do not go live. Re-showing something already mounted is free --
    // the grant, and therefore the cookie, already exists.
    const LIBRARY_DISTINCT_PREVIEW_CAP = 32;
    let _librarySeenPreviews = new Set();
    state.libraryMenuOpen = false;
    state.libraryProjects = null;
    state.libraryLoading = false;
    state.libraryError = '';
    state.libraryFilter = '';
    let _libraryObserver = null;
    let _libraryMounted = [];

    function relativeWhen(iso) {
      const t = Date.parse(String(iso || ''));
      if (!Number.isFinite(t)) return '';
      const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
      const days = Math.round(hrs / 24);
      if (days < 7) return `${days} day${days === 1 ? '' : 's'} ago`;
      if (days < 31) return `${Math.round(days / 7)} week${Math.round(days / 7) === 1 ? '' : 's'} ago`;
      return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function libraryVisibleProjects() {
      const all = Array.isArray(state.libraryProjects) ? state.libraryProjects : [];

      return all.filter(p => `${p.name || ''} ${p.request_title || ''} ${p.entry_path || ''}`.toLowerCase().includes(q));
    }

    function teardownLibraryPreviews() {
      if (_libraryObserver) { try { _libraryObserver.disconnect(); } catch (e) {} _libraryObserver = null; }
      // Unload the frames as well as forgetting them. Dropping only the
      // bookkeeping left a dozen model-written pages running behind a closed
      // panel, still holding preview grants and still able to post messages at
      // this window. The LRU evictor already clears holders this way.
      _libraryMounted.forEach(function (holder) {
        try { libraryRestMonogram(holder); delete holder.dataset.libMountedFrame; } catch (e) {}
      });
      _libraryMounted = [];
    }

    function libraryMonogram(name, accent) {

      const monogram = libraryMonogram(p.request_title || p.name, accent);

          <button data-lib-action="browse" class="hv-icon" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--c-border);background:transparent;color:var(--c-dim);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;"><i class="ph ph-folder-open" style="font-size:15px;"></i>Browse my PC</button>
          <button data-lib-action="new" class="hv-icon" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--c-accent-line);background:var(--c-accent-soft);color:var(--c-text);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;"><i class="ph ph-plus" style="font-size:15px;"></i>New project</button>
        </div>

    function mountLibraryPreviews() {
      teardownLibraryPreviews();
      const holders = Array.from(document.querySelectorAll('#tc-code-library-menu [data-lib-frame]'));
      if (!holders.length) return;
      const mount = (holder) => {
        if (holder.dataset.libMountedFrame === '1') return;
        const key = holder.getAttribute('data-lib-frame') || '';
        // A grant already taken costs nothing to show again; a new one does.
        // Past the budget the tile simply keeps the monogram it was rendered
        // with, so it still reads as a project rather than as a blank.
        if (!_librarySeenPreviews.has(key) && _librarySeenPreviews.size >= LIBRARY_DISTINCT_PREVIEW_CAP) return;
        _librarySeenPreviews.add(key);
        if (_libraryMounted.length >= LIBRARY_PREVIEW_BUDGET) {
          // Budget is spent: release the least-recently shown frame first so the
          // preview service never sees more than LIBRARY_PREVIEW_BUDGET grants.
          const oldest = _libraryMounted.shift();
          if (oldest) { libraryRestMonogram(oldest); delete oldest.dataset.libMountedFrame; }
        }
        const src = holder.getAttribute('data-lib-frame') || '';
        // Render each app at a desktop width, then scale that down to exactly
        // fill this tile. The grid is fluid (auto-fill minmax), so a hard-coded
        // scale letterboxes every card with white margins -- measure instead.
        const box = holder.getBoundingClientRect();
        const logicalW = 1200;
        const logicalH = Math.round(logicalW * (box.height / (box.width || 1)) ) || 750;
        const scale = (box.width || 184) / logicalW;
        // These pages were written by a model, so pin their capabilities in the
        // markup as well as in the response. The iframe attribute INTERSECTS
        // with the server's CSP sandbox, so this is a floor, not a grant.
        //
        // allow-same-origin is included deliberately. The deliverable is served
        // from its own ephemeral 127.0.0.1:<port>, which is already a different
        // origin from the chat page -- "same-origin" here means the app's own
        // origin, never the parent's, and the parent stays unreachable either
        // way. Dropping it would give the frame an opaque origin instead, which
        // makes web storage throw: 15 of the 297 generated apps on this machine
        // use localStorage, including the snake game and Orbit. Breaking real
        // apps to re-state a boundary the origin already enforces is a bad
        // trade. allow-forms is not carried over from the CSP -- a preview is
        // pointer-events:none and has nothing to submit.
        holder.innerHTML = `<iframe src="${esc(src)}" sandbox="allow-scripts allow-same-origin" tabindex="-1" aria-hidden="true" scrolling="no" loading="lazy"
          style="position:absolute;top:0;left:0;width:${logicalW}px;height:${logicalH}px;border:0;transform:scale(${scale.toFixed(4)});transform-origin:top left;pointer-events:none;"></iframe>`;
        holder.dataset.libMountedFrame = '1';
        _libraryMounted.push(holder);
      };
      // Mount the first screenful immediately rather than waiting to be told
      // they are visible: they demonstrably are, an observer that never fires
      // leaves a wall of blank tiles, and previews arriving one beat late reads
      // as the panel being broken.
      holders.slice(0, LIBRARY_PREVIEW_BUDGET).forEach(mount);
      if (typeof IntersectionObserver !== 'function' || holders.length <= LIBRARY_PREVIEW_BUDGET) return;
      _libraryObserver = new IntersectionObserver((entries) => {
        entries.filter(e => e.isIntersecting).forEach(e => mount(e.target));
      }, { root: document.getElementById('tc-library-body'), rootMargin: '160px' });
      holders.slice(LIBRARY_PREVIEW_BUDGET).forEach(h => _libraryObserver.observe(h));
    }

    async function chooseLibraryProject(root, label) {
      if (!root) return;
      closeLibraryMenu();
      if (!window.ThomasUnifiedModes) return;
      try { await window.ThomasUnifiedModes.newConversation(root, label); }
      catch (e) { /* the mode surface reports its own failures */ }

    function readFile(file) {
      return new Promise(res => {
        const r = new FileReader();
        if (/^image\//.test(file.type)) { r.onload = () => res({ kind: 'image', data_url: r.result, name: file.name }); r.onerror = () => res(null); r.readAsDataURL(file); }
        else { r.onload = () => res({ kind: 'doc', name: file.name, text: String(r.result || '') }); r.onerror = () => res(null); r.readAsText(file); }
      });
    }
    async function onFiles(fileList) {
      const files = Array.from(fileList || []);
      for (const f of files) { const a = await readFile(f); if (!a) continue; if (a.kind === 'image') state.images.push({ data_url: a.data_url, name: a.name }); else state.docs.push({ name: a.name, text: a.text }); }
      renderAttachments();
    }
    function renderAttachments() {
      const row = document.getElementById('tc-attach-row'); if (!row) return;
      const items = state.docs.map((d, i) => ({ type: 'doc', i, name: d.name })).concat(state.images.map((im, i) => ({ type: 'img', i, name: im.name })));
      if (!items.length) { row.style.display = 'none'; row.innerHTML = ''; return; }
      row.style.display = 'flex'; row.innerHTML = '';
      items.forEach(it => {
        const chip = document.createElement('span');
        chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--c-surface-2);border:1px solid var(--c-border);font-size:12px;color:var(--c-text);max-width:200px;';
        chip.innerHTML = '<i class="ph ' + (it.type === 'img' ? 'ph-image' : 'ph-file-text') + '" style="font-size:13px;color:var(--c-accent);"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(it.name) + '</span>';
        const x = document.createElement('button'); x.innerHTML = '<i class="ph ph-x" style="font-size:12px;"></i>'; x.style.cssText = 'border:0;background:transparent;color:var(--c-muted);cursor:pointer;padding:0;display:flex;';
        x.addEventListener('click', () => { if (it.type === 'doc') state.docs.splice(it.i, 1); else state.images.splice(it.i, 1); renderAttachments(); });
        chip.appendChild(x); row.appendChild(chip);
      });
    }

    let recognition = null;
    function setupMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const btn = document.getElementById('tc-mic-btn'); if (!btn) return;
      if (!SR) { btn.title = 'Voice input not supported in this browser'; btn.style.opacity = '0.45'; return; }
      // Continuous listening: stays on through pauses, stops only after ~5s of
      // silence (or a manual click). No auto cut-off mid-sentence.
      recognition = new SR(); recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
      const SILENCE_MS = 5000;
      let base = '', finalChunk = '', silenceTimer = null, stopRequested = false;
      function micOn() { btn.style.color = 'var(--c-accent-ink)'; btn.style.background = 'var(--c-accent)'; btn.title = 'Listening… (stops after a pause)'; }
      function micOff() { btn.style.color = 'var(--c-dim)'; btn.style.background = 'transparent'; btn.title = 'Voice input'; }
      function resetSilence() { if (silenceTimer) clearTimeout(silenceTimer); silenceTimer = setTimeout(() => { stopRequested = true; try { recognition.stop(); } catch (e) {} }, SILENCE_MS); }
      recognition.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalChunk += r[0].transcript; else interim += r[0].transcript; }
        const combined = ((base ? base + ' ' : '') + finalChunk + interim).replace(/\s+/g, ' ').replace(/^\s+/, '');
        state.input = combined; inputEl.value = combined; autosize(); syncDynamic();
        resetSilence();
      };
      recognition.onerror = () => { /* keep listening; onend handles restart */ };
      recognition.onend = () => {
        if (state.listening && !stopRequested) { try { recognition.start(); return; } catch (e) {} }
        state.listening = false; if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; } micOff();
      };
      btn.addEventListener('click', () => {
        if (state.listening) { stopRequested = true; try { recognition.stop(); } catch (e) {} return; }
        base = state.input.trim(); finalChunk = ''; stopRequested = false; state.listening = true; micOn();
        try { recognition.start(); resetSilence(); } catch (e) { state.listening = false; micOff(); }
      });
    }

    // ---------- Wire up ----------
    inputEl.addEventListener('input', e => { state.input = e.target.value; autosize(); syncDynamic(); });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    document.getElementById('tc-send').addEventListener('click', () => {
      const unified = window.ThomasUnifiedModes;
      if (unified && unified.mode() !== 'chat') {
        // Typed text sends (queues if the mode is busy — Codex-style);
        // clicking with an EMPTY composer while busy stops the run.
        if (state.input.trim()) { send(); return; }
        if (unified.stop()) return;
      }
      if (state.streaming) { if (abortController) { try { abortController.abort(); } catch (e) {} } }
      else { send(); }
    });
    document.getElementById('tc-search').addEventListener('input', e => { state.search = e.target.value; renderChats(); });
    document.getElementById('tc-newchat').addEventListener('click', newChat);
    document.getElementById('tc-newchat-top').addEventListener('click', newChat);
    document.getElementById('tc-sidebar-toggle').addEventListener('click', toggleSidebar);
    document.getElementById('tc-settings').addEventListener('click', () => openWorkspace('settings'));
    // In Chat this button is the Canvas toggle — it opens the inline panel where
    // Thomas is drawing and closes it again, restoring whatever this conversation
    // last rendered. It must NOT navigate to the app_builder workspace: that hides
    // the chat AND the Canvas, which is the opposite of what the control says.
    // The full Canvas workspace is still reachable from the sidebar.
    // Inside a workspace the button keeps its other meaning (resident-Thomas drawer).
    document.getElementById('tc-canvas-btn').addEventListener('click', () => {
      if (state.workspaceOpen && window.ThomasWorkspaceChat) window.ThomasWorkspaceChat.toggle();
      else if (state.artifactOpen) closeCanvas();
      else openConversationCanvas();
    });
    document.getElementById('tc-canvas-close').addEventListener('click', closeCanvas);
    document.getElementById('tc-theme-btn').addEventListener('click', toggleThemeMenu);
    document.getElementById('tc-model-btn').addEventListener('click', toggleModelMenu);
    document.getElementById('tc-tools-btn').addEventListener('click', toggleToolsMenu);
    document.getElementById('tc-code-project-btn').addEventListener('click', toggleLibraryMenu);
    document.getElementById('tc-code-library-menu').addEventListener('click', (e) => {
      const action = e.target.closest('[data-lib-action]');
      if (action) {
        const kind = action.getAttribute('data-lib-action');
        closeLibraryMenu();
        if (kind === 'browse' && window.ThomasUnifiedModes) window.ThomasUnifiedModes.pickProject();
        if (kind === 'new' && window.ThomasUnifiedModes) {
          // A new project needs a name and its OWN folder. Sending nothing put
          // every "new" project into one shared scratch directory, which is how
          // pacman, star-catcher and museum ended up in the same folder.
          const suggested = 'Project ' + new Date().toISOString().slice(0, 10);
          const name = window.prompt('Name your new project', suggested);
          if (name !== null) window.ThomasUnifiedModes.newConversation('', name.trim() || suggested, { newProjectName: name.trim() || suggested });
        }
        return;
      }
      const card = e.target.closest('[data-lib-card]');
      if (card) chooseLibraryProject(card.getAttribute('data-lib-card'), card.getAttribute('data-lib-label'));
    });
    document.getElementById('tc-code-library-menu').addEventListener('input', (e) => {
      if (e.target && e.target.id === 'tc-library-filter') {
        state.libraryFilter = e.target.value;
        const body = document.getElementById('tc-library-body');
        const items = libraryVisibleProjects();
        if (!body) return;
        // Re-render only the results, so the field keeps focus and the caret.
        body.innerHTML = items.length
          ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px;">${items.map(libraryCardHTML).join('')}</div>`
          : `<div style="padding:30px 16px;text-align:center;color:var(--c-muted);font-size:13px;">No project matches “${esc(state.libraryFilter)}”.</div>`;
        mountLibraryPreviews();
      }
    });
    document.getElementById('tc-attach-btn').addEventListener('click', () => document.getElementById('tc-file-input').click());
    document.getElementById('tc-file-input').addEventListener('change', (e) => { onFiles(e.target.files); e.target.value = ''; });
    document.addEventListener('mousedown', e => {
      if (state.themeMenuOpen && !e.target.closest('[data-theme-switch]')) { state.themeMenuOpen = false; document.getElementById('tc-theme-menu').style.display = 'none'; }
      if (state.modelMenuOpen && !e.target.closest('[data-model-switch]')) { closeModelMenu(); }
      if (state.toolsMenuOpen && !e.target.closest('[data-tools-wrap]')) { closeToolsMenu(); }
      if (state.libraryMenuOpen && !e.target.closest('[data-code-library-wrap]')) { closeLibraryMenu(); }
    });
    // Escape closes the library. Nothing in this page handled Escape before, so
    // the guard matters: UI Edit Mode uses Escape too and must keep it.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (document.body.classList.contains('thomas-ui-editing')) return;
      if (state.libraryMenuOpen) { e.preventDefault(); closeLibraryMenu({ restoreFocus: true }); }
    });

    // ---------- Boot: pull live model + chats + session from the backend ----------
    // The conversation row carries the model that actually answered it. Stamping
    // `state.modelLabel` here instead credited every historical reply to whatever
    // is selected in the picker right now: measured on this machine, 370 of 476
    // saved chats carry a real model across NINE of them -- 185 gpt-5.6-sol, 136
    // codex, 37 openai_codex, 5 local, 4 qwen2.5-coder:7b, plus gpt-5.5, terra
    // and luna -- and all 370 were displayed as the current selection. Opening a
    // codex chat with Terra selected put "GPT-5.6 Terra" on a reply codex wrote.
    //
    // The raw id is shown rather than a prettied name: it is what was recorded,
    // and inventing a display name for a model no longer in the picker is how the
    // wrong label got here in the first place.
    //
    // 106 rows carry no model at all. Those now show NOTHING, because the honest
    // answer to "which model wrote this" is sometimes "not recorded" -- the same
    // reason the run report has a "Nothing was checked" state instead of dressing
    // an unknown up as a pass.
    function mapRealMessages(list, rowModel) {
      const answered = String(rowModel || '').trim();
      return (Array.isArray(list) ? list : []).map(m => ({
        role: (m.role === 'assistant' ? 'assistant' : 'user'),
        text: String(m.content != null ? m.content : (m.text || '')),
        model: (m.role === 'assistant' ? answered : ''),
      }));
    }
    // Pull the real recent-chat list (legacy store + live v2 sessions) into the sidebar.
    // Called on boot AND after each turn so a brand-new chat shows up in Recent without
    // a reload, with its real title + date. (chat history fix, 2026-06-28)
    async function refreshChats() {
      try {
        const r = await fetch('/api/chats?mode=chat');
        if (!r.ok) return;
        const d = await r.json();
        const rows = d.chats || (d.data && d.data.chats) || [];
        if (!Array.isArray(rows)) return;
        const active = state.activeChat;
        chatList = rows.map(row => {
          const msgs = mapRealMessages(row.messages, row.model);
          const firstUser = msgs.find(m => m.role === 'user');
          return { id: String(row.id || row.session_id || ''), title: String(row.title || 'Untitled chat'), preview: String(row.preview || (firstUser ? firstUser.text : '')).slice(0, 60), msgs, sessionId: row.sessionId || row.session_id || null, surfaceMode: String(row.surfaceMode || 'chat'), contextId: String(row.contextId || ''), updatedAt: Number(row.updatedAt || row.createdAt || 0) };
        }).filter(c => c.id);
        state.activeChat = active;
        renderChats();
      } catch (e) {}
    }
    // Which Thomas is this? The version alone cannot answer that when several
    // worktrees are checked out at once and all report the same string, so the
    // chip carries the port, the version and the commit, and marks a tree with
    // uncommitted edits. Clicking copies the whole line, which is the fastest
    // way to answer "what build are you on".
    async function mountBuildBadge() {
      const badge = document.getElementById('tc-build-badge');
      const label = document.getElementById('tc-build-text');
      if (!badge || !label) return;
      const port = location.port || (location.protocol === 'https:' ? '443' : '80');
      let build = null;
      try {
        const r = await fetch('/api/health', { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          build = (d && typeof d.build === 'object' && d.build) ? d.build : { version: d && d.version };
        }
      } catch (e) { /* offline is itself worth showing */ }

      const parts = [':' + port];
      if (build && build.version) parts.push('v' + build.version);
      if (build && build.commit) parts.push(build.commit);
      // "uncommitted" rather than the git term: it states the fact plainly for
      // anyone reading the corner of their screen.
      if (build && build.dirty) parts.push('uncommitted');
      const line = build ? parts.join(' · ') : ':' + port + ' · no answer';

      label.textContent = line;
      badge.hidden = false;
      if (build && build.dirty) badge.setAttribute('data-dirty', '1');
      const detail = [
        line,
        build && build.branch ? 'branch ' + build.branch : '',
        build && build.root ? build.root : '',
        build && build.dirty ? 'Uncommitted changes: this is not exactly the commit named above.' : '',
      ].filter(Boolean).join('\n');
      badge.title = detail + '\n\nClick to copy.';

      badge.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(detail.split('\n\n')[0]); }
        catch (e) {
          const t = document.createElement('textarea');
          t.value = line; document.body.appendChild(t); t.select();
          try { document.execCommand('copy'); } catch (e2) {}
          t.remove();
        }
        label.textContent = 'Copied';
        setTimeout(() => { label.textContent = line; }, 1200);
      });
    }

    async function boot() {
      // live model → header pill + send payload
      try {
        const r = await fetch('/api/models');
        if (r.ok) {
          const d = await r.json();
          profilesData = Array.isArray(d.profiles) ? d.profiles : [];
          await hydrateProfileModels();
          const prefs = d.preferences || {};
          const active = String(prefs.active_profile || d.default || '').trim().toLowerCase();
          const usable = (p) => !!p && (!!p.has_api_key || p.provider === 'openai_codex' || p.name === 'local');
          // Prefer the configured active profile; if it isn't usable (e.g. a keyless
          // cloud provider, or an unreachable local), fall back to the first profile
          // that can actually answer. Profile names are case-insensitive because the
          // preferences API historically returned display-cased values such as "Local".
          let pick = profilesData.find(p => String(p.name || '').trim().toLowerCase() === active);
          if (!usable(pick)) pick = profilesData.find(usable) || profilesData[0];
          if (pick) setProfile(pick);
          renderModelMenu();
        }
      } catch (e) {}
      // real recent chats → sidebar
      await refreshChats();
      // Restore the conversation that was open before the reload — reloading
      // must never LOOK like losing your chat. Falls through to a fresh
      // session only when there is nothing to come back to.
      try {
        const lastChat = localStorage.getItem('thomas_last_chat') || '';
        const lastSession = localStorage.getItem('thomas_last_session') || '';
        const row = chatList.find(c => c.id === lastChat) || chatList.find(c => c.sessionId && c.sessionId === lastSession);
        if (row) { selectChat(row.id); return; }
      } catch (e) {}
      // fresh session id for this tab
      try {
        const r = await fetch('/api/session/new', { method: 'POST' });
        if (r.ok) { const d = await r.json(); state.sessionId = d.session_id || (d.data && d.data.session_id) || state.sessionId; try { if (state.sessionId) localStorage.setItem('thomas_last_session', state.sessionId); } catch (e) {} }
      } catch (e) {}
    }

    function modeChanged(nextMode) {
      state.surfaceMode = nextMode;
      state.search = '';
      const search = document.getElementById('tc-search'); if (search) search.value = '';
      showChat();
      if (nextMode !== 'chat') resetCanvasForConversation();
      const projectWrap = document.getElementById('tc-code-project-wrap');
      if (projectWrap) {
        projectWrap.hidden = nextMode !== 'code';
        projectWrap.style.display = nextMode === 'code' ? 'block' : 'none';
      }
      closeLibraryMenu();
      renderChats();
      syncDynamic();
    }
    function setExternalBusy() {
      if (window.ThomasUnifiedModes && window.ThomasUnifiedModes.refreshChrome) window.ThomasUnifiedModes.refreshChrome();
      syncDynamic();
    }
    function announceModeStatus(message) {
      const surface = document.getElementById('tc-mode-surface');
      if (surface) surface.setAttribute('aria-label', String(message || 'Mode workspace'));
    }
    if (window.ThomasUnifiedModes) {
      window.ThomasUnifiedModes.connect({
        announce: announceModeStatus,
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, dials: Object.assign({}, state.dials) }),
        isBusy: () => !!state.streaming,
        modeChanged,
        renderHistory: renderChats,
        setBusy: setExternalBusy,
      });
    }
    if (window.ThomasWorkspaceChat) {
      window.ThomasWorkspaceChat.connect({
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, dials: Object.assign({}, state.dials) }),
      });
    }

    // ---------- Init ----------
    hydrateBots();
    renderChats();
    renderWorkspaces();
    renderCards();
    renderThemeMenu();
    applyTheme(state.theme);
    syncView();
    syncDynamic();
    autosize();
    setupMic();
    renderAttachments();
    mountBuildBadge();
    boot();
  })();
  </script>
</body>
</html>
