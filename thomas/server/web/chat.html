<!DOCTYPE html>
<!--
  Thomas Chat — faithful vanilla port of the "Thomas Chat.dc.html" design concept
  imported from claude.ai/design (project 85187ffb-...-d43e5033f957).

  This is a self-contained surface (markup + CSS + JS, no build step, no React/DC
  runtime). Served by Thomas at / (the unified shell). Five "living world"
  themes (Nebula / Dark / Light / Aurora / Sandstone), each with its own animated
  background, design tokens, fonts and welcome copy; sidebar, model pill, theme
  switcher, welcome hero, streaming message thread, composer, and the Thomas Canvas
  (whiteboard / document / chart). Behavior mirrors the design's DCLogic component.
-->

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2730%27%20fill%3D%27%238b8cff%27%2F%3E%3Crect%20x%3D%2734%27%20y%3D%2740%27%20width%3D%2713%27%20height%3D%2720%27%20rx%3D%273.5%27%20fill%3D%27%230a0b16%27%2F%3E%3Crect%20x%3D%2753%27%20y%3D%2740%27%20width%3D%2713%27%20height%3D%2720%27%20rx%3D%273.5%27%20fill%3D%27%230a0b16%27%2F%3E%3C%2Fsvg%3E">

    <!-- ===================== LIVING WORLDS (behind everything) =====================
         KNOWN, MEASURED, DELIBERATELY NOT CHANGED — and z-index: 0 is correct
         here, so do not "fix" it to -1. See below for what that costs.

         At 900px on the Code empty state, a drifting 30px moon sits under the
         subtitle and "Describe the outcome in the composer below." reads as
         "...the composer belo(sphere) Keep using this same" -- the w and the
         full stop apparently swallowed. Cropped at 3x, it looks like the sprite
         is painted on top.

         It is NOT. `main` is `position: relative; z-index: 1` and this wrapper is
         `z-index: 0`, both children of #tc-shell, so the text genuinely paints
         above the sprite. What actually fails is contrast: the subtitle is
         `--c-dim`, rgba(238,240,251,.66), and light grey on a bright sphere has
         almost none. The sprites are animated, so the same line is legible a few
         seconds later -- which is why this reads as intermittent rather than
         broken.

         Two measurements that are worth nothing here, both tried:
           * `elementFromPoint` reports the TEXT as topmost, but this layer is
             `pointer-events: none` and that API skips it either way.
           * A screenshot alone cannot separate "covered" from "no contrast".
             Hiding this wrapper removes the sphere AND the whole background,
             which proves only that the sprite belongs to it.

         One measurement that DOES separate them, if this comes up again:
         repaint the transcript in a hue absent from both the page and the
         sprite (`.tc-code-turn * { color:#ff0000 !important }`), then compare
         the fraction of red pixels inside the sprite's own rect against the
         same-height strip beside it on the same line. Covered would read near
         zero on the sprite; contrast reads comparable. Measured 0.188 on the
         sprite against 0.257 beside it -- the glyphs are there, just washed
         out, confirming the paragraph above.
         Do NOT threshold on "dark" pixels: `--c-bg` is #070912, every channel
         under 90, so a brightness test scores the BACKGROUND as text and
         returns a confident wrong answer (it reported the control strip as
         100% "text").

         Setting this wrapper to `z-index: -1` was tried and REVERTED: a negative
         z-index puts it behind #tc-shell's own opaque `--c-bg`, and every theme
         goes flat black -- verified by screenshot, the entire nebula gone. It
         trades an intermittent contrast dip for losing the design.

         A real fix is a design decision, not a z-index: dim or exclude sprites
         beneath running text, or give the empty-state copy its own backdrop.
         Left alone rather than guessed at. -->

    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">

        </div>
        <div style="position: absolute; top: 64%; left: 0; animation: tc-fly-right 52s linear infinite;">

        <div style="position: absolute; inset: 0; background-image: radial-gradient(1.6px 1.6px at 20% 16%, rgba(255,255,255,0.9), transparent), radial-gradient(1.2px 1.2px at 60% 8%, rgba(255,255,255,0.7), transparent), radial-gradient(1.4px 1.4px at 84% 22%, rgba(255,255,255,0.8), transparent), radial-gradient(1.2px 1.2px at 38% 30%, rgba(255,255,255,0.7), transparent); background-size: 100% 100%;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20% 20%, rgba(255,255,255,0.8), transparent), radial-gradient(2px 2px at 70% 40%, rgba(255,255,255,0.6), transparent), radial-gradient(1.5px 1.5px at 45% 70%, rgba(255,255,255,0.7), transparent); background-size: 260px 260px, 320px 320px, 200px 200px; animation: tc-snow 24s linear infinite; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, transparent, rgba(6,30,30,0.6)); clip-path: polygon(0 100%, 0 56%, 12% 38%, 24% 60%, 38% 30%, 52% 58%, 66% 26%, 80% 54%, 92% 36%, 100% 56%, 100% 100%);"></div>
        <div style="position: absolute; top: 38%; left: 0; animation: tc-fly-right 46s linear infinite;">
          <div style="animation: tc-bob 5.5s ease-in-out infinite;" data-bot data-primary="#a8f0da" data-secondary="#34e0b0" data-trim="#06302a" data-glow="rgba(52,224,176,0.5)" data-scale="0.52" data-flame="true"></div>
        </div>
      </div>

      <!-- SANDSTONE -->
      <div class="tc-world is-sandstone">
        <div style="position: absolute; top: 12%; right: 16%; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(255,214,150,0.95), rgba(240,170,90,0.5) 60%, transparent 72%); animation: tc-sun 14s ease-in-out infinite;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(120,90,50,0.05) 1px, transparent 1px); background-size: 4px 4px; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, transparent, rgba(206,158,104,0.28)); clip-path: ellipse(75% 100% at 30% 130%);"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 150px; background: linear-gradient(180deg, transparent, rgba(176,120,68,0.3)); clip-path: ellipse(70% 100% at 80% 140%);"></div>
        <div style="position: absolute; bottom: 92px; left: 0; animation: tc-sled 56s linear infinite;">
          <div style="position: relative; animation: tc-bob 6s ease-in-out infinite;">
            <div data-bot data-primary="#ffd6a7" data-secondary="#ffad60" data-trim="#3a2a1a" data-glow="rgba(192,96,60,0.45)" data-scale="0.5" data-flame="false"></div>
            <span style="position: absolute; left: -6px; bottom: -6px; width: 52px; height: 7px; border-radius: 6px; background: linear-gradient(90deg, rgba(192,96,60,0.2), #c0603c, rgba(192,96,60,0.2)); box-shadow: 0 6px 14px rgba(192,96,60,0.4);"></span>

      <!-- DARK (blueprint workshop) -->
      <div class="tc-world is-dark">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="tc-sidebar" data-ui-id="chat.sidebar" data-ui-label="Chat sidebar" data-ui-policy="move resize" data-ui-constraints="minWidth=220;minHeight=420;maxWidth=420" style="position: relative; z-index: 2; flex: 0 0 auto; width: 280px; display: flex; flex-direction: column; background: var(--c-sidebar); border-right: 1px solid var(--c-border); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: margin-left 0.28s cubic-bezier(.4,0,.2,1); margin-left: var(--sidebar-margin, 0);">
      <div style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px;">
        <!-- The Thomas brand mark. The anvil belongs to Code, not here. -->
        <span style="width: 30px; height: 30px; border-radius: 9px; background: var(--c-accent); display: grid; place-items: center; box-shadow: 0 0 18px var(--c-accent-soft); flex: 0 0 auto;">
          <span style="display: flex; gap: 4px;">
            <span style="width: 5px; height: 6px; border-radius: 1px; background: var(--c-accent-ink);"></span>
            <span style="width: 5px; height: 6px; border-radius: 1px; background: var(--c-accent-ink);"></span>
          </span>
        </span>
        <span style="font-weight: 800; font-size: 18px; letter-spacing: -0.01em;">Thomas</span>
      </div>

      <div style="padding: 0 12px 12px;">
        <div id="tc-mode-switch" role="tablist" aria-label="Thomas mode" data-ui-id="chat.mode-switch" data-ui-label="Chat Code Work switch" data-ui-policy="move">

               tool. The head with two eyes IS the Thomas mark, so the three read
               as aspects of one thing rather than three unrelated tabs.
               data-thomas-mode stays "code": it is the adapter's id, not a label. -->
          <button type="button" class="tc-mode-button is-active" role="tab" aria-selected="true" tabindex="0" data-thomas-mode="chat"><span class="tc-mode-icon" data-thomas-icon="chat" aria-hidden="true"></span><span>Chat</span></button>
          <button type="button" class="tc-mode-button" role="tab" aria-selected="false" tabindex="-1" data-thomas-mode="code"><span class="tc-mode-icon" data-thomas-icon="build" aria-hidden="true"></span><span>Build</span></button>
          <button type="button" class="tc-mode-button" role="tab" aria-selected="false" tabindex="-1" data-thomas-mode="work"><span class="tc-mode-icon" data-thomas-icon="work" aria-hidden="true"></span><span>Work</span></button>
        </div>
        <!-- Starting something new is ONE control now, and it sits above the
             search box: you create far more often than you search. -->
        <button id="tc-newchat" class="hv-newchat" data-ui-id="chat.action.new" data-ui-label="New chat button" data-ui-policy="control" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 30px; padding: 0 11px; margin-bottom: 8px; border-radius: 9px; border: 1px dashed var(--c-border-2); background: transparent; color: var(--c-text); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s;">
          <span data-thomas-icon="plus" data-thomas-icon-size="14" aria-hidden="true" style="display: grid; place-items: center;"></span> New chat
        </button>
        <label style="display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; background: var(--c-surface); border: 1px solid var(--c-border); cursor: text;">
          <span data-thomas-icon="search" data-thomas-icon-size="15" aria-hidden="true" style="display: grid; place-items: center; color: var(--c-muted);"></span>
          <input id="tc-search" placeholder="Search chats" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--c-text); font-family: inherit; font-size: 13.5px;" />
        </label>
      </div>

      <nav style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 4px 12px 12px;">
        <!-- The list collapses: the side panel carries workspaces too, and a
             long history used to bury them. -->
        <div class="tc-history-head" style="flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 10px 2px 6px;">
          <!-- A drawn chevron, not the "\2304" glyph the icon map falls back
               on, which renders as a thin stray mark. -->
          <button id="tc-history-collapse" class="hv-icon" aria-expanded="true" aria-controls="tc-chats" title="Collapse the list" style="width: 18px; height: 18px; display: grid; place-items: center; border: 0; border-radius: 5px; background: transparent; color: var(--c-muted); cursor: pointer; transition: all .14s;">
            <svg id="tc-history-collapse-icon" viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform .16s ease;"><path d="M3.5 6 L8 10.5 L12.5 6"/></svg>
          </button>
          <div id="tc-history-label" style="flex: 1; min-width: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Recent chats</div>
          <!-- Names the sort it is currently using. A bare icon here was a
               control nobody could read — and the funnel glyph was missing from
               the icon map, so it rendered as a literal dot. -->
          <button id="tc-history-filter" class="hv-icon" title="Sort and filter" aria-haspopup="menu" aria-expanded="false" style="flex: 0 0 auto; display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px; border: 1px solid var(--c-border); border-radius: 6px; background: transparent; color: var(--c-dim); font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; transition: all .14s;">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M6.75 12.5h2.5"/></svg><span id="tc-history-sort-label">Recent</span>
          </button>
        </div>
        <div id="tc-chats" class="tc-scroll" data-ui-id="chat.history" data-ui-label="Recent chats" data-ui-policy="move resize" data-ui-constraints="minWidth=180;minHeight=60" style="flex: 1 1 auto; min-height: 60px; overflow-y: auto;"></div>
        <div style="flex: 0 0 auto; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 14px 6px 6px; border-top: 1px solid var(--c-border); margin-top: 6px;">Workspaces</div>
        <div id="tc-workspaces" data-ui-id="chat.workspaces" data-ui-label="Workspaces" data-ui-policy="move resize" data-ui-constraints="minWidth=180;minHeight=120" style="flex: 0 0 auto; max-height: 42%; overflow-y: auto;" class="tc-scroll"></div>
      </nav>

      <div style="padding: 10px 12px; border-top: 1px solid var(--c-border);">
        <button id="tc-settings" class="hv-soft" data-ui-id="chat.action.settings" data-ui-label="Settings button" data-ui-policy="control" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--c-dim); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all .14s;">
          <span data-thomas-icon="settings" data-thomas-icon-size="17" aria-hidden="true" style="display: grid; place-items: center;"></span> Settings
        </button>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main data-ui-id="chat.main" data-ui-label="Chat workspace" data-ui-policy="root protected" style="position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <!-- position: relative anchors the centred chat title below; the pills
           stay a plain flex row and the title never becomes a flex item, so it
           cannot push them around no matter how long the name is. -->
      <header data-ui-id="chat.topbar" data-ui-label="Top toolbar" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=50" style="position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--c-border);">
        <button id="tc-sidebar-toggle" class="hv-icon" title="Toggle sidebar" style="width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer; transition: all .15s;">
          <i class="ph ph-sidebar-simple" style="font-size: 17px;"></i>
        </button>
        <div style="position: relative;" data-model-switch="1">
          <button id="tc-model-btn" class="hv-pill" title="Switch model" data-ui-id="chat.action.model" data-ui-label="Model switcher" data-ui-policy="control" style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text); font-family: var(--font-label); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
            <span style="width: 7px; height: 7px; border-radius: 999px; background: var(--c-accent); box-shadow: 0 0 8px var(--c-accent);"></span>
            <!-- Neutral until the real selection arrives (setProfile fills it in).
                 A hardcoded model name here is a claim, and it survives a failed
                 /api/profiles fetch: the chip would sit there naming a model that
                 was never selected, which is the same lie the message labels had. -->
            <span id="tc-model">Loading…</span>
            <i class="ph ph-caret-down" style="font-size: 12px; color: var(--c-muted);"></i>
          </button>
          <div id="tc-model-menu" style="display: none; position: absolute; left: 0; top: calc(100% + 8px); z-index: 40; width: 300px; max-height: 60vh; overflow-y: auto; padding: 8px; border-radius: 14px; background: var(--c-menu-bg); border: 1px solid var(--c-border-2); box-shadow: var(--c-shadow);" class="tc-scroll">
            <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 6px 8px 8px;">Model</div>
            <!-- Which account is answering. /api/openai-codex/status has always
                 returned logged_in, email and plan_type, and the unified shell
                 showed none of it -- so "4 ready" was the only signal that a
                 provider was usable, and nothing said WHOSE account it was or
                 what plan it was spending. Filled by refreshAccountLine(); the
                 element stays empty and takes no space when signed out. -->
            <div id="tc-model-account" style="display: none; padding: 0 8px 8px; font-size: 11px; color: var(--c-dim); line-height: 1.35;"></div>
            <div id="tc-model-options"></div>
          </div>
        </div>
        <!-- The conversation's own name, on the model row, centred. Its only
             other home would be a heading above the thread, and a full-width
             heading there eats the reading area it exists to name. Absolutely
             centred and ellipsised: long names truncate, the pills never move.
             Empty and hidden until a named conversation is open, so a new chat
             shows nothing rather than a placeholder that claims a name. -->
        <div id="tc-chat-title" data-ui-id="chat.title" data-ui-label="Chat title" data-ui-policy="control" hidden></div>
        <div style="flex: 1;"></div>
        <button id="tc-canvas-btn" class="hv-surface" title="Open Thomas Canvas" data-ui-id="chat.action.canvas" data-ui-label="Canvas button" data-ui-policy="control" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--c-accent-line); background: var(--c-accent-soft); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
          <i id="tc-primary-action-icon" class="ph ph-chalkboard-simple" style="font-size: 16px; color: var(--c-accent);"></i><span id="tc-primary-action-label">Canvas</span>
        </button>
        <!-- Redesign with AI is a permanent, every-page control, not a Work
             dashboard footer button. Press it, point at anything on screen,
             lock the selection in, then say what should change. -->
        <button id="tc-redesign-btn" class="hv-pill" title="Redesign with AI — select anything on screen and tell Thomas what to change" aria-pressed="false" data-ui-id="chat.action.redesign" data-ui-label="Redesign with AI" data-ui-policy="control" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-dim); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
          <i class="ph ph-sparkle" style="font-size: 16px;"></i><span>Redesign</span>
        </button>
        <div style="position: relative;" data-theme-switch="1">
          <button id="tc-theme-btn" class="hv-pill" title="Switch theme" data-ui-id="chat.action.theme" data-ui-label="Theme switcher" data-ui-policy="control" style="display: flex; align-items: center; gap: 9px; padding: 7px 11px 7px 9px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;">
            <span style="display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--c-border-2);">
              <span id="tc-sw1" style="width: 11px; height: 18px; background: var(--sw-1);"></span>
              <span id="tc-sw2" style="width: 11px; height: 18px; background: var(--sw-2);"></span>
              <span id="tc-sw3" style="width: 11px; height: 18px; background: var(--sw-3);"></span>
            </span>
            <span id="tc-theme-name">Nebula Core</span>
            <i class="ph ph-caret-down" style="font-size: 12px; color: var(--c-muted);"></i>
          </button>
          <div id="tc-theme-menu" style="display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 268px; padding: 8px; border-radius: 14px; background: var(--c-menu-bg); border: 1px solid var(--c-border-2); box-shadow: var(--c-shadow);">
            <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-muted); padding: 6px 8px 8px;">Theme — each its own world</div>
            <div id="tc-theme-options"></div>
          </div>
        </div>
      </header>

      <!-- body row: chat column + canvas column -->
      <div id="tc-body-row" data-ui-id="chat.body" data-ui-label="Conversation workspace" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=360" style="position: relative; flex: 1; min-height: 0; display: flex;">
        <!-- The one live workspace frame is deliberately inside the body row. The
             literal Chat top bar above it never disappears or gets duplicated. -->
        <iframe id="tc-ws-frame" class="tc-workspace-frame" title="Workspace" style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 20; background: var(--c-bg); background: color-mix(in srgb, var(--c-bg) 82%, transparent); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);"></iframe>
        <div id="tc-primary-column" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <section id="tc-mode-surface" aria-live="polite" aria-label="Mode workspace" data-ui-id="chat.mode.surface" data-ui-label="Mode workspace" data-ui-policy="move resize" data-ui-constraints="minWidth=360;minHeight=280" style="display:none;"></section>
          <div id="tc-scroll" class="tc-scroll" style="flex: 1; min-height: 0; overflow-y: auto;">
            <!-- WELCOME -->
            <div id="tc-welcome" class="tc-rail" data-ui-id="chat.welcome" data-ui-label="Welcome dashboard" data-ui-policy="move resize" data-ui-constraints="minWidth=320;minHeight=260" style="max-width: 720px; margin: 0 auto; padding: clamp(20px, 4vh, 56px) 24px 32px; display: flex; flex-direction: column; align-items: center; text-align: center;">
              <div style="height: 124px; display: grid; place-items: center; margin-bottom: 2px; animation: tc-hover 4.2s ease-in-out infinite;" data-bot data-primary="var(--bot-primary)" data-secondary="var(--bot-secondary)" data-trim="var(--bot-trim)" data-glow="var(--bot-glow)" data-scale="2.5" data-flame="true"></div>
              <h1 id="tc-welcome-title" style="margin: 0; font-family: var(--font-head); font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -0.02em;">Where to, Captain?</h1>
              <p id="tc-welcome-sub" style="margin: 10px 0 0; font-size: 16px; color: var(--c-dim); max-width: 460px; line-height: 1.6;">Thomas understands the ask, acts within your boundaries, and shows you what changed.</p>
              <div id="tc-cards" data-ui-id="chat.prompt-cards" data-ui-label="Prompt cards" data-ui-policy="move resize" data-ui-constraints="minWidth=280;minHeight=100" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; width: 100%;"></div>
            </div>

            <!-- THREAD -->
            <!-- Vertical padding only. The horizontal inset used to live here
                 (24px) while the composer's inset lived on ITS wrapper (18px),
                 so the two columns sat on different edges. Both are now plain
                 .tc-rail boxes and chat_shell.css owns the one shared inset. -->
            <div id="tc-thread" class="tc-rail" style="display: none; max-width: 768px; margin: 0 auto; flex-direction: column; gap: 28px;"></div>
          </div>

          <!-- Peek strip. The one place a mode may show conversation next to
               the composer. It sits here, above the single composer, so a
               second composer can never come back: there is nowhere to put
               one. Work fills it; other modes leave it empty. -->
          <div id="tc-mode-peek" class="tc-mode-peek" data-ui-id="chat.mode.peek" data-ui-label="Conversation peek" data-ui-policy="control" hidden></div>

          <!-- composer -->
          <div data-ui-id="chat.composer" data-ui-label="Message composer" data-ui-policy="move resize" data-ui-constraints="minWidth=320;minHeight=90" style="flex: 0 0 auto; padding: 6px 0 18px;">
            <div id="tc-composer-rail" class="tc-rail" style="max-width: 768px; margin: 0 auto;">
              <div style="position: relative; display: flex; flex-direction: column; gap: 8px; background: var(--c-composer-bg); border: 1px solid var(--c-border-2); border-radius: var(--r-composer); padding: 12px 14px; box-shadow: var(--c-shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); overflow: visible;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--composer-accent, transparent);"></div>
                <div id="tc-attach-row" style="display: none; flex-wrap: wrap; gap: 8px; padding: 2px 2px 0;"></div>
                <textarea id="tc-input" rows="1" placeholder="Message Thomas&hellip;  (try &ldquo;draw how Thomas works&rdquo; or &ldquo;make a PDF&rdquo;)" style="width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--c-text); font-family: inherit; font-size: 16px; line-height: 1.55; max-height: 180px; padding: 4px 4px 0; min-height: 26px;"></textarea>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <input id="tc-file-input" type="file" multiple style="display: none;" />
                  <button id="tc-attach-btn" class="hv-icon" title="Add files" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer; transition: all .15s;"><i class="ph ph-plus" style="font-size: 18px;"></i></button>
                  <div style="position: relative;" data-tools-wrap="1">
                    <button id="tc-tools-btn" class="hv-icon" title="Tools — AI settings" style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;"><i class="ph ph-sliders-horizontal" style="font-size: 16px;"></i> Tools</button>
                    <div id="tc-tools-menu" style="display: none; position: absolute; bottom: calc(100% + 10px); left: 0; z-index: 60; width: 312px; padding: 12px; border-radius: 14px; background: var(--c-menu-bg, var(--c-surface)); border: 1px solid var(--c-border-2); box-shadow: var(--c-shadow);" class="tc-scroll"></div>
                  </div>
                  <div id="tc-code-project-wrap" style="position: relative; display: none;" data-code-library-wrap="1">
                    <!-- One line, and the same 36px height as Tools beside it.
                         The stacked "SELECTED PROJECT" caption made this 44px
                         tall and 173px wide against Tools' 36x80, so the
                         composer read as one big button and one small one. The
                         caption said nothing the folder icon and the tooltip do
                         not, and it was the half forcing the second line. A
                         generated project is named after the whole request, so
                         the name is capped tighter and ellipsised. -->
                    <button id="tc-code-project-btn" class="hv-icon" title="Choose what Thomas works on" aria-haspopup="dialog" aria-expanded="false" aria-controls="tc-code-library-menu" style="display: flex; align-items: center; gap: 7px; max-width: 200px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); font-family: inherit; cursor: pointer; transition: all .15s; text-align: left;">
                      <i class="ph ph-folder-simple" style="font-size: 15px; flex: 0 0 auto;"></i>
                      <span class="sr-only">Selected project</span>
                      <span id="tc-code-project-label" style="font-size: 13px; font-weight: 650; color: var(--c-text); line-height: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Thomas library</span>
                      <i class="ph ph-caret-up" style="font-size: 11px; flex: 0 0 auto; opacity: .6;"></i>
                    </button>
                    <div id="tc-code-library-menu" role="dialog" aria-modal="false" aria-label="Choose what Thomas works on" style="display: none; position: absolute; bottom: calc(100% + 10px); left: 0; z-index: 60; width: min(760px, calc(100vw - 48px)); max-height: min(64vh, 540px); padding: 0; border-radius: 14px; background: var(--c-menu-bg, var(--c-surface)); border: 1px solid var(--c-border-2); box-shadow: var(--c-shadow); overflow: hidden; flex-direction: column;"></div>
                  </div>
                  <div style="flex: 1;"></div>
                  <button id="tc-mic-btn" class="hv-icon" title="Voice input" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer; transition: all .15s;"><i class="ph ph-microphone" style="font-size: 18px;"></i></button>
                  <button id="tc-send" title="Send" data-ui-id="chat.action.send" data-ui-label="Send message" data-ui-policy="control" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--send-bg, var(--c-surface-2)); color: var(--send-ink, var(--c-muted)); display: grid; place-items: center; cursor: var(--send-cursor, default); transition: all .18s; opacity: var(--send-op, 0.85);"><i id="tc-send-icon" class="ph ph-arrow-up" style="font-size: 19px; font-weight: 700;"></i></button>
                </div>
              </div>
              <p style="text-align: center; margin: 9px 0 0; font-size: 11.5px; color: var(--c-muted);">Thomas can make mistakes. Consider verifying important information.</p>
            </div>
          </div>
        </div>

        <!-- ===================== THOMAS CANVAS ===================== -->
        <aside id="tc-canvas" data-ui-id="chat.canvas-panel" data-ui-label="Thomas Canvas panel" data-ui-policy="move resize" data-ui-constraints="minWidth=320;minHeight=360;maxWidth=760" style="display: none; flex: 0 0 auto; width: clamp(340px, 40vw, 560px); border-left: 1px solid var(--c-border); background: var(--c-sidebar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); flex-direction: column;">
          <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--c-border);">
            <span style="width: 28px; height: 28px; border-radius: 8px; background: var(--c-accent); display: grid; place-items: center; flex: 0 0 auto;">
              <span style="display: flex; gap: 3px;"><span style="width: 4px; height: 5px; border-radius: 1px; background: var(--c-accent-ink);"></span><span style="width: 4px; height: 5px; border-radius: 1px; background: var(--c-accent-ink);"></span></span>
            </span>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 13.5px; font-weight: 700;">Thomas Canvas</div>
              <div id="tc-canvas-status" style="font-size: 11px; color: var(--c-muted);">Sketching it out&hellip;</div>
            </div>
            <button id="tc-canvas-close" class="hv-icon" title="Close canvas" style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--c-border); background: transparent; color: var(--c-dim); display: grid; place-items: center; cursor: pointer;"><i class="ph ph-x" style="font-size: 15px;"></i></button>
          </div>
          <div id="tc-canvas-body" class="tc-scroll" style="flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 14px; display: flex; flex-direction: column;"></div>
        </aside>
      </div>
    </main>

    <!-- Build identity. Several worktrees of this repo run at once and can all
         report the same version, so the chip names the port, the version AND
         the commit -- the commit is the only one of the three that actually
         tells two instances apart. It sits inside the shell to inherit the
         theme tokens. Quiet at rest, legible on hover, and it turns amber when
         the tree has uncommitted edits, because that build is not the commit
         it claims to be. -->
    <button id="tc-build-badge" type="button" hidden title="Copy this build's details"
      aria-label="Build identity. Click to copy.">
      <span id="tc-build-text">&#8230;</span>
    </button>
  </div>

  <script src="/static/js/chat_themes.js?v=__THOMAS_WEB_BUILD__"></script>
  <script src="/static/js/chat_connect_prompt.js?v=__THOMAS_WEB_BUILD__"></script>
  <script>
  (function () {
    "use strict";

    // ---------- Theme data ----------
    // Lives in js/chat_themes.js (mirrors tokens.css - the single source).
    const THEMES = window.ThomasChatThemes.THEMES;
    const THEME_META = window.ThomasChatThemes.THEME_META;
    // ---------- State ----------
    const state = { theme: loadTheme(), surfaceMode: 'chat', themeMenuOpen: false, input: '', search: '', messages: [], activeChat: null, streaming: false, artifactOpen: false, artifactKind: 'board', sessionId: null, restoredCanvas: null, profile: '', modelId: '', modelLabel: '' };
    let timer = null, abortController = null;
    let chatSelectionToken = 0;
    const msgRefs = []; // per-message { bubbleEl } for in-place streaming updates
    // Sidebar chat list — starts EMPTY and is populated only from the real server
    // (GET /api/chats below). It must never be seeded with demo/placeholder chats:
    // on a fresh load with no history the sidebar shows nothing real, never fabricated
    // threads with fake "Done — ..." replies. (chat sweep, 2026-06-27)
    let chatList = [];
    let profilesData = [];        // model profiles from GET /api/models
    state.modelMenuOpen = false;
    // Which model families are expanded in the picker. Survives re-renders of
    // the menu so clicking a family header does not collapse it again.
    state.modelFamilyOpen = {};
    state.modelFamilySeeded = false;
    // AI settings ("Tools"), attachments ("+"), and voice ("mic") state
    // Autonomy defaults to Agent (3): a fresh chat must be able to EXECUTE an
    // ask, not tell the owner to raise a dial and resend. Guardrails stay
    // 'guarded' — dangerous actions still gate on approval. (Calvin, 2026-07-18.)
    const DIAL_DEFAULTS = { autonomy: 3, effort: 'medium', tokenEconomy: 'balanced', fileAccess: 'workspace', guardrails: 'guarded', memory: true };
    state.dials = (function () {
      try {
        const stored = JSON.parse(localStorage.getItem('thomas_dials') || '{}');
        // One-time migration: autonomy 1 stored before 2026-07-18 was the OLD
        // default, not a user choice. Lift it to the new default once; after
        // that the user's own dial changes always stick.
        if (stored.autonomy === 1 && !localStorage.getItem('thomas_dials_autonomy_migrated')) {
          stored.autonomy = DIAL_DEFAULTS.autonomy;
          localStorage.setItem('thomas_dials_autonomy_migrated', '1');
          localStorage.setItem('thomas_dials', JSON.stringify(stored));
        }
        return Object.assign({}, DIAL_DEFAULTS, stored);
      } catch (e) { return Object.assign({}, DIAL_DEFAULTS); }
    })();
    state.docs = []; state.images = []; state.toolsMenuOpen = false; state.listening = false;

    // ---------- Element refs ----------
    const shell = document.getElementById('tc-shell');
    const scrollEl = document.getElementById('tc-scroll');
    const inputEl = document.getElementById('tc-input');
    const welcomeEl = document.getElementById('tc-welcome');
    const threadEl = document.getElementById('tc-thread');
    const sendIconEl = document.getElementById('tc-send-icon');
    const canvasEl = document.getElementById('tc-canvas');
    const canvasBody = document.getElementById('tc-canvas-body');
    const canvasStatus = document.getElementById('tc-canvas-status');

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    // Activity cards and status lines render as PLAIN text — worker prose with
    // markdown markers ("**360**", "`file`") must not leak raw syntax there.
    function deMd(s) { return String(s == null ? '' : s).replace(/\*\*/g, '').replace(/__/g, '').replace(/`/g, '').replace(/(^|\s)#{1,6}\s+/gm, '$1'); } // markers strip even unpaired: upstream truncation eats closing ** and headings appear mid-sentence

    // ---------- Bot mascot (mirrors Bot.dc.html) ----------
    function botHTML(p) {
      const flame = (p.flame === true || p.flame === 'true');
      const trim = p.trim, primary = p.primary, secondary = p.secondary;
      return `<div style="position: relative; width: 58px; height: 54px; image-rendering: pixelated; transform: scale(${p.scale}); transform-origin: center; filter: drop-shadow(0 8px 16px ${p.glow});">
        ${flame ? `<span style="position: absolute; top: 22px; left: 1px; width: 8px; height: 16px; background: linear-gradient(180deg, #5a6e8a, #3b4d66); border: 1px solid ${trim}; border-radius: 2px;"></span>
        <span style="position: absolute; top: 38px; left: -3px; width: 16px; height: 13px; background: radial-gradient(ellipse at 50% 0%, #ffd54f 0%, #ff9800 35%, #ff5722 65%, transparent 100%); border-radius: 0 0 50% 50%; filter: blur(0.6px); transform-origin: 50% 0; animation: bot-flame 0.22s linear infinite;"></span>` : ''}
        <span style="position: absolute; top: 2px; left: 16px; width: 24px; height: 14px; border: 2px solid ${trim}; background: ${primary};">
          <span style="position: absolute; top: 3px; left: 4px; width: 4px; height: 4px; background: #0b1726; transform-origin: center; animation: bot-blink 4.6s ease-in-out infinite;"></span>
          <span style="position: absolute; top: 3px; left: 13px; width: 4px; height: 4px; background: #0b1726; transform-origin: center; animation: bot-blink 4.6s ease-in-out infinite;"></span>
        </span>
        <span style="position: absolute; top: 18px; left: 13px; width: 30px; height: 18px; border: 2px solid ${trim}; background: linear-gradient(to bottom, ${primary} 0, ${primary} 44%, ${secondary} 45%, ${secondary} 100%);">
          <span style="position: absolute; top: 5px; left: 6px; width: 18px; height: 3px; background: rgba(11,23,38,0.5); border-radius: 2px;"></span>
        </span>
        <span style="position: absolute; top: 36px; left: 18px; width: 8px; height: 10px; border: 2px solid ${trim}; background: ${secondary};"></span>
        <span style="position: absolute; top: 36px; left: 32px; width: 8px; height: 10px; border: 2px solid ${trim}; background: ${secondary};"></span>
      </div>`;
    }
    function hydrateBots() {
      document.querySelectorAll('[data-bot]').forEach(el => {
        el.innerHTML = botHTML({ primary: el.dataset.primary, secondary: el.dataset.secondary, trim: el.dataset.trim, glow: el.dataset.glow, scale: el.dataset.scale, flame: el.dataset.flame });
      });
    }

    // ---------- Avatar (the little accent square with two dots) ----------
    function avatar(size, radius, dotW, dotH) {
      return `<span style="width: ${size}px; height: ${size}px; border-radius: ${radius}px; background: var(--c-accent); display: grid; place-items: center; flex: 0 0 auto;">
        <span style="display: flex; gap: 3px;"><span style="width: ${dotW}px; height: ${dotH}px; border-radius: 1px; background: var(--c-accent-ink);"></span><span style="width: ${dotW}px; height: ${dotH}px; border-radius: 1px; background: var(--c-accent-ink);"></span></span>
      </span>`;
    }

    // ---------- Theme ----------
    function loadTheme() { try { const t = localStorage.getItem('thomas_chat_theme'); if (t && THEMES[t]) return t; } catch (e) {} return 'nebula'; }

    function applyTheme(name) {
      const t = THEMES[name]; if (!t) return;
      Object.entries(t.vars).forEach(([k, v]) => shell.style.setProperty(k, v));
      if (window.ThomasWorkspaceShell) window.ThomasWorkspaceShell.applyTheme(name, { vars: t.vars, persist: false });
      shell.style.setProperty('--sw-1', t.sw[0]); shell.style.setProperty('--sw-2', t.sw[1]); shell.style.setProperty('--sw-3', t.sw[2]);
      const m = THEME_META[name];
      if (m) {
        shell.style.setProperty('--bot-primary', m.bot[0]); shell.style.setProperty('--bot-secondary', m.bot[1]); shell.style.setProperty('--bot-glow', m.bot[2]); shell.style.setProperty('--bot-trim', m.trim);
        shell.style.setProperty('--font-head', m.fontHead); shell.style.setProperty('--font-label', m.fontLabel);
        shell.style.setProperty('--r-card', m.rCard); shell.style.setProperty('--r-composer', m.rComposer);
        shell.style.setProperty('--c-menu-bg', m.menuBg); shell.style.setProperty('--composer-accent', m.composerAccent); shell.style.setProperty('--msg-rule-on', m.msgRule);
      }
      shell.dataset.theme = name;
      document.getElementById('tc-theme-name').textContent = t.name;
      if (m) { document.getElementById('tc-welcome-title').textContent = m.welcome[0]; document.getElementById('tc-welcome-sub').textContent = m.welcome[1]; }
      // re-tint the welcome hero bot (it reads --bot-* vars, so re-render to pick up new values)
      const heroBot = welcomeEl.querySelector('[data-bot]');
      if (heroBot) heroBot.innerHTML = botHTML({ primary: 'var(--bot-primary)', secondary: 'var(--bot-secondary)', trim: 'var(--bot-trim)', glow: 'var(--bot-glow)', scale: heroBot.dataset.scale, flame: heroBot.dataset.flame });
      document.querySelectorAll('.tc-workspace-frame').forEach((frame) => {
        if (frame.contentWindow && window.ThomasWorkspaceShell) window.ThomasWorkspaceShell.sendTheme(frame, name, t.vars);
      });
    }
    function selectTheme(name) {
      state.theme = name; state.themeMenuOpen = false; applyTheme(name);
      try { localStorage.setItem('thomas_chat_theme', name); } catch (e) {}
      renderThemeMenu(); document.getElementById('tc-theme-menu').style.display = 'none';
    }
    function toggleThemeMenu() {
      state.themeMenuOpen = !state.themeMenuOpen;
      document.getElementById('tc-theme-menu').style.display = state.themeMenuOpen ? 'block' : 'none';
      if (state.themeMenuOpen) renderThemeMenu();
    }
    function renderThemeMenu() {
      const wrap = document.getElementById('tc-theme-options');
      wrap.innerHTML = '';
      Object.keys(THEMES).forEach(key => {
        const t = THEMES[key], sel = key === state.theme;
        const b = document.createElement('button');
        b.className = 'hv-soft';
        b.style.cssText = `width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 9px; border-radius: 10px; border: 1px solid ${sel ? 'var(--c-accent-line)' : 'transparent'}; background: ${sel ? 'var(--c-accent-soft)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: pointer; text-align: left; transition: all .14s; margin-bottom: 2px;`;
        b.innerHTML = `<span style="display: inline-flex; border-radius: 7px; overflow: hidden; border: 1px solid var(--c-border-2); flex: 0 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.25);">
            <span style="width: 14px; height: 30px; background: ${t.sw[0]};"></span>
            <span style="width: 14px; height: 30px; background: ${t.sw[1]};"></span>
            <span style="width: 14px; height: 30px; background: ${t.sw[2]};"></span>
          </span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 13.5px; font-weight: 700;">${esc(t.name)}</span>
            <span style="display: block; font-size: 11.5px; color: var(--c-muted);">${esc(t.tagline)}</span>
          </span>
          <i class="ph ph-check" style="font-size: 15px; color: var(--c-accent); opacity: ${sel ? '1' : '0'};"></i>`;
        b.addEventListener('click', () => selectTheme(key));
        wrap.appendChild(b);
      });
    }

    // ---------- Model selector ----------
    function profileModelOptions(p) {
      if (p && Array.isArray(p.models) && p.models.length) return p.models;
      return [{ id: String(p && (p.model || p.name) || 'model'), display_name: String(p && (p.model || p.name) || 'model'), is_default: true, available: true }];
    }
    async function hydrateProfileModels() {
      await Promise.all(profilesData.map(async p => {
        const provider = String(p && p.provider || '').toLowerCase().replace(/-/g, '_');
        if (provider !== 'openai_codex') return;
        try {
          const r = await fetch('/api/openai-codex/models?profile=' + encodeURIComponent(p.name));
          if (!r.ok) return;
          const data = await r.json();
          if (Array.isArray(data.models) && data.models.length) p.models = data.models;
        } catch (e) {}
      }));
    }
    function persistModelSelection(profileName, modelId) {
      fetch('/api/preferences', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ advanced: { model: { active_profile: profileName, model_id: modelId } } }),
      }).catch(() => {});
    }
    function setProfile(p, modelOption) {
      if (!p) return;
      const models = profileModelOptions(p);
      const choice = modelOption || models.find(m => m.is_default && m.available !== false) || models.find(m => m.available !== false) || models[0];
      if (!choice || choice.available === false) return;
      state.profile = p.name;
      state.modelId = choice.id || p.model || '';
      state.modelLabel = String(choice.display_name || choice.id || p.model || p.name || 'model').split('/').pop();
      const el = document.getElementById('tc-model'); if (el) el.textContent = state.modelLabel;
      const effortControl = p.chat_controls && p.chat_controls.model && p.chat_controls.model.reasoning_effort;
      const validEfforts = effortControl && Array.isArray(effortControl.options) ? effortControl.options.map(o => String(o.value)) : [];
      if (validEfforts.length && !validEfforts.includes(String(state.dials.effort))) {
        state.dials.effort = String(effortControl.default_value || 'medium'); saveDials();
      }
      if (modelOption) persistModelSelection(state.profile, state.modelId);
    }
    function toggleModelMenu() {
      state.modelMenuOpen = !state.modelMenuOpen;
      document.getElementById('tc-model-menu').style.display = state.modelMenuOpen ? 'block' : 'none';
      if (state.modelMenuOpen) renderModelMenu();
    }
    function closeModelMenu() { state.modelMenuOpen = false; document.getElementById('tc-model-menu').style.display = 'none'; }
    // Which vendor a profile belongs to. Grouped by FAMILY rather than listed
    // flat because the flat list was one row per model across every profile,
    // and with only one provider holding a key the four models that actually
    // work were buried among fifteen that cannot run — so the picker read as
    // "you have one model" when it has four.
    const MODEL_FAMILIES = [
      // Matched on the profile NAME, never on `provider`: `openai_compat` is a
      // wire protocol, not a vendor, and almost every profile here speaks it —
      // Gemini, Mistral, Groq and xAI included. Matching the provider put all
      // of them under "OpenAI".
      { id: 'openai',    label: 'OpenAI',      match: p => /^(openai|openai_codex|litellm)$/.test(p.name) },
      { id: 'anthropic', label: 'Anthropic',   match: p => p.name === 'anthropic' || String(p.provider) === 'anthropic' },
      { id: 'google',    label: 'Google',      match: p => p.name === 'gemini' },
      { id: 'xai',       label: 'xAI',         match: p => p.name === 'xai' },
      { id: 'meta',      label: 'Meta Llama',  match: p => /^(groq|together|deepinfra|fireworks|cerebras)$/.test(p.name) },
      { id: 'mistral',   label: 'Mistral',     match: p => p.name === 'mistral' },
      { id: 'local',     label: 'On this PC',  match: p => p.name === 'local' },
    ];
    function modelFamilyOf(p) {
      const hit = MODEL_FAMILIES.find(f => { try { return f.match(p); } catch (e) { return false; } });
      return hit || { id: 'other', label: 'Other providers' };
    }
    function profileIsUsable(p) { return !!p.has_api_key || p.provider === 'openai_codex' || p.name === 'local'; }
    function renderModelMenu() {
      const wrap = document.getElementById('tc-model-options'); if (!wrap) return;
      wrap.innerHTML = '';
      // Build family -> [{profile, model}] in the declared order, so the list
      // does not reshuffle when a key is added.
      const groups = new Map();
      profilesData.forEach(p => {
        const fam = modelFamilyOf(p);
        if (!groups.has(fam.id)) groups.set(fam.id, { label: fam.label, entries: [] });
        profileModelOptions(p).forEach(m => groups.get(fam.id).entries.push({ p, m }));
      });
      const ordered = [...MODEL_FAMILIES, { id: 'other', label: 'Other providers' }]
        .map(f => [f.id, groups.get(f.id)]).filter(([, g]) => g && g.entries.length);

      // Seed ONCE, not per render. Opening the family that holds the current
      // selection is right the first time the menu is drawn and wrong every
      // time after: the accordion closes the others, this rule immediately
      // reopened the selected one, and two families ended up expanded.
      if (!state.modelFamilySeeded) {
        const owning = ordered.find(([, g]) => g.entries.some(e => e.p.name === state.profile && String(e.m.id || '') === String(state.modelId || '')));
        if (owning) state.modelFamilyOpen[owning[0]] = true;
        state.modelFamilySeeded = true;
      }

      ordered.forEach(([famId, group]) => {
        const ready = group.entries.filter(e => profileIsUsable(e.p) && e.m.available !== false).length;
        const holdsSelection = group.entries.some(e => e.p.name === state.profile && String(e.m.id || '') === String(state.modelId || ''));
        const isOpen = !!state.modelFamilyOpen[famId];

        const head = document.createElement('button');
        head.type = 'button'; head.className = 'hv-soft';
        head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        head.style.cssText = `width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 9px; margin-bottom: 2px; border-radius: 10px; border: 1px solid ${holdsSelection ? 'var(--c-accent-line)' : 'transparent'}; background: ${isOpen ? 'var(--c-surface-2)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: pointer; text-align: left; transition: all .14s;`;
        head.innerHTML = `<i class="ph ph-caret-right" style="font-size: 12px; color: var(--c-muted); transform: rotate(${isOpen ? '90deg' : '0deg'}); transition: transform .14s;"></i>
          <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700;">${esc(group.label)}</span>
          <span style="font-size: 10.5px; color: ${ready ? 'var(--c-accent)' : 'var(--c-muted)'};">${ready ? `${ready} ready` : 'needs key'}</span>`;
        head.addEventListener('click', () => {
          // Accordion: opening one closes the rest, so a long list never
          // stacks up and the menu keeps its height.
          const wasOpen = !!state.modelFamilyOpen[famId];
          state.modelFamilyOpen = {};
          state.modelFamilyOpen[famId] = !wasOpen;
          renderModelMenu();
        });
        wrap.appendChild(head);
        if (!isOpen) return;

        group.entries.forEach(({ p, m }) => {
          const sel = p.name === state.profile && String(m.id || '') === String(state.modelId || '');
          const usable = profileIsUsable(p) && m.available !== false;
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'hv-soft'; b.disabled = !usable;
          if (m.unavailable_reason) b.title = String(m.unavailable_reason);
          b.style.cssText = `width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 9px 7px 26px; border-radius: 10px; border: 1px solid ${sel ? 'var(--c-accent-line)' : 'transparent'}; background: ${sel ? 'var(--c-accent-soft)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: ${usable ? 'pointer' : 'not-allowed'}; text-align: left; transition: all .14s; margin-bottom: 2px; opacity: ${usable ? '1' : '0.45'};`;
          const status = !profileIsUsable(p) ? 'needs key' : (m.available === false ? 'unavailable on this connection' : esc(p.name));
          b.innerHTML = `<span style="flex: 1; min-width: 0;">
              <span style="display: block; font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${esc(String(m.display_name || m.id || p.name).split('/').pop())}</span>
              <span style="display: block; font-size: 10.5px; color: var(--c-muted);">${status}</span>
            </span>
            <i class="ph ph-check" style="font-size: 15px; color: var(--c-accent); opacity: ${sel ? '1' : '0'};"></i>`;
          if (usable) b.addEventListener('click', () => { setProfile(p, m); closeModelMenu(); });
          wrap.appendChild(b);
        });
        // A dead end otherwise. The menu lists Anthropic, Google, xAI, Meta
        // Llama and Mistral, marks every one "needs key", and the unified shell
        // had NO way to supply one -- the only code that can POST a key lives in
        // model_settings_dropdown.js, which nothing loads. So five providers
        // were visible, unusable, and unfixable from the UI.
        const keyless = [];
        group.entries.forEach(({ p }) => {
          if (!profileIsUsable(p) && !keyless.some(x => x.name === p.name)) keyless.push(p);
        });
        keyless.forEach(p => wrap.appendChild(buildKeyRow(p)));
      });
      renderSpecialistModels(wrap);
      refreshAccountLine();
    }

    // Which model handles research, coding, and the rest.
    //
    // This is a feature Thomas already HAD and stopped showing. The whole path
    // works: `worker_runtime._resolve_profile` consults the per-role override
    // before the chat default, `GET /api/models` returns the maps, and
    // `PATCH /api/preferences` writes them (verified by round-trip). The only
    // missing piece was a control -- `persist_user_model_role_preference` has no
    // production caller at all, and nothing in the unified shell ever mentioned
    // `role_profiles`. Set it, and it takes effect immediately.
    //
    // The six ids are the ones the delegation runner accepts; anything else is
    // coerced to "reasoning" (chat_delegation.py: specialist_id not in {...}).
    // Inventing prettier names here would write overrides that never match.
    //
    // It lives at the foot of the model menu rather than behind a new modal:
    // the menu is already where a model is chosen, and a settings surface the
    // owner has to discover is how this got buried the first time.
    const SPECIALIST_ROLES = [
      ['reasoning', 'Reasoning'],
      ['coding', 'Coding'],
      ['research', 'Research'],
      ['tools', 'Tools'],
      ['writing', 'Writing'],
      ['data', 'Data'],
    ];

    // Re-read the profile list from the server and redraw the menu.
    //
    // The load in boot() is inline and also picks the active profile, which is
    // wrong to redo here: saving a key for Mistral must not silently switch the
    // conversation to Mistral. This refreshes what is USABLE and leaves the
    // selection alone.
    async function reloadModelProfiles() {
      const r = await fetch('/api/models');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      profilesData = Array.isArray(d.profiles) ? d.profiles : [];
      await hydrateProfileModels();
      renderModelMenu();
    }

    // Somewhere to put the key for a provider that needs one.
    //
    // POST /api/secrets/{profile} {api_key} has always existed and the unified
    // shell never called it, so "needs key" was a verdict with no remedy. The
    // input is type=password so the value is not shoulder-readable and does not
    // land in the DOM as text; it is never logged, and the field is cleared the
    // moment the request is sent.
    //
    // On success the whole model list is reloaded rather than patched locally:
    // the server decides what is usable (has_api_key, reachability, per-model
    // availability), and guessing "it works now" in the client is how a menu
    // ends up claiming a provider is ready when the key was rejected.
    function buildKeyRow(profile) {
      const row = document.createElement('div');
      row.style.cssText = 'display: flex; align-items: center; gap: 6px; padding: 4px 9px 8px 26px;';
      const input = document.createElement('input');
      input.type = 'password';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.placeholder = `Paste ${profile.name} API key`;
      input.setAttribute('aria-label', `API key for ${profile.name}`);
      input.style.cssText = 'flex: 1; min-width: 0; padding: 5px 7px; border-radius: 8px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text); font-family: inherit; font-size: 11.5px;';
      const save = document.createElement('button');
      save.type = 'button'; save.className = 'hv-soft'; save.textContent = 'Save';
      save.style.cssText = 'flex: 0 0 auto; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--c-border); background: var(--c-surface); color: var(--c-text); font-family: inherit; font-size: 11.5px; cursor: pointer;';
      const note = document.createElement('div');
      note.style.cssText = 'display: none; padding: 0 9px 6px 26px; font-size: 10.5px; color: var(--c-danger, #ff9a9a);';

      const submit = () => {
        const key = input.value.trim();
        if (!key) return;
        input.value = '';

    function bubbleInner(m) {

      const showCursor = !isUser && m.streaming && m.text && m.text.length > 0;

      if (showCursor) html += `<span style="display: inline-block; width: 8px; height: 17px; transform: translateY(2px); margin-left: 2px; background: var(--c-accent); animation: tc-blink 1s step-end infinite;"></span>`;

    // A delegation opens with a present-tense bubble — "On it — this is running now, and I'll share the result when it's ready." (reasoning.py stores it verbatim; reasoning_context.py a sibling wording). The Done pill and deliverable card render ABOVE it, so a finished task's transcript ENDED on a false statement, on every store re-render, forever (measured live, 2026-08-05). The stored text is history; the rendering is ours: once every handoff on this message is terminal, the ONE stale sentence renders as what actually happened, naming the deliverable when known — surrounding prose survives untouched.
    // Null = nothing to settle: no promise in the text, no delegation activity attached, or a handoff genuinely still running. Honest text and user text are never touched — this never fires while the claim is still true.
    function _settledStatusText(m) {
      const text = String(m.text || ''), sentence = /[^.!?\n]*\b(?:running now|getting this done now)\b[^.!?\n]*[.!?]?/i;
      if (!sentence.test(text) || !/\bshare the result\b/i.test(text)) return null;
      const a = m.activity, handoffs = ((a && a.steps) || []).filter(s => s && s.kind === 'handoff');
      if (!handoffs.length || handoffs.some(s => s.status === 'running')) return null;
      const names = ((Array.isArray(m.artifacts) && m.artifacts.length) ? m.artifacts : (Array.isArray(a.artifacts) && a.artifacts.length) ? a.artifacts : (a.artifact ? [a.artifact] : [])).map(x => String((x && (x.name || x.path)) || '')).filter(Boolean);
      const done = handoffs.some(s => s.status === 'failed') ? 'This ran into a problem — the details are in the card above.' : (a.cancelled || handoffs.some(s => s.status === 'cancelled')) ? 'Stopped — this task was cancelled before it finished.' : names.length === 1 ? ('Done — ' + names[0] + ' is ready above.') : names.length > 1 ? ('Done — ' + names.length + ' results are ready above.') : 'Done — the result is ready above.';
      return text.replace(sentence, done);
    }
    async function copyMessageText(text, button) {

        <button type="button" data-msg-copy class="hv-soft" title="Copy message" aria-label="Copy message" style="width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--c-muted);display:grid;place-items:center;cursor:pointer;transition:all .14s;"><i class="ph ph-copy" style="font-size:15px;"></i></button>
        ${m.role === 'user' ? `<button type="button" data-msg-edit class="hv-soft" title="Edit &amp; resend from here" aria-label="Edit and resend from here" style="width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--c-muted);display:grid;place-items:center;cursor:pointer;transition:all .14s;"><i class="ph ph-pencil-simple" style="font-size:15px;"></i></button>` : ''}

      wrap.innerHTML = html;
      const bubbleEl = wrap.querySelector('.tc-bubble');
      const activityEl = wrap.querySelector('.tc-activity');

      if (m.activity) renderActivity(idx);
      const artBtn = wrap.querySelector('.tc-art');
      if (artBtn && m.artifact) artBtn.addEventListener('click', () => { void canvasRender(m.artifact.url, m.artifact.name, m.artifact.kind || ''); });

      const artHolder = wrap.querySelector('.tc-msg-artifacts');

        artHolder.querySelectorAll('[data-artifact-open]').forEach(button => button.addEventListener('click', (e) => { e.stopPropagation(); void canvasRender(button.dataset.artifactUrl || '', button.dataset.artifactName || 'result', button.dataset.artifactKind || ''); }));

    }
    // Edit-and-resend: fork the conversation at a past user message. The
    // server truncates the stored history to BEFORE that message (and evicts
    // the live LLM so removed turns can't leak back), the client mirrors the
    // cut, and the old text lands in the composer ready to edit and send.
    // Friction telemetry: retries, cancels, and edit-resends are "this didn't
    // land" signals — they feed the issue ledger so the self-review sees them.
    function reportFriction(kind, message) {
      try { fetch('/api/issues', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ surface: 'chat-ui', kind: 'friction', message: kind + ': ' + String(message || '').slice(0, 200), context: { session: state.sessionId || '' } }) }); } catch (e) {}
    }
    // Uncaught page errors feed the same ledger: a broken send path took the
    // whole surface down for days while the self-review saw nothing, because
    // only deliberate friction was reported. Capped so a render-loop error
    // cannot flood the ledger.
    let _jsErrorsReported = 0;
    function reportPageError(message) {
      if (_jsErrorsReported >= 5) return;
      _jsErrorsReported += 1;
      reportFriction('js_error', message);
    }
    window.addEventListener('error', (e) => reportPageError(e.message || 'unknown error'));
    window.addEventListener('unhandledrejection', (e) => reportPageError(String((e.reason && e.reason.message) || e.reason || 'unhandled rejection')));
    async function editMessageFrom(idx) {
      if (state.streaming) return;
      const m = state.messages[idx];
      if (!m || m.role !== 'user') return;
      reportFriction('edit_resend', m.text);
      const sid = state.sessionId;
      if (sid) {
        try {
          await fetch('/api/v2/chat/session/' + encodeURIComponent(sid) + '/truncate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keep_messages: idx }),
          });
        } catch (e) {}
      }
      state.messages = state.messages.slice(0, idx);
      threadEl.innerHTML = ''; msgRefs.length = 0;
      state.messages.forEach((msg, i) => threadEl.appendChild(buildMessageNode(msg, i)));
      state.input = m.text; inputEl.value = m.text;
      autosize(); syncDynamic(); inputEl.focus(); scrollEnd();
    }
    function appendMessage(m) {
      const idx = state.messages.length - 1;
      threadEl.appendChild(buildMessageNode(m, idx));
    }
    function updateStreamingBubble(idx) {
      const ref = msgRefs[idx]; if (!ref) return;
      ref.bubbleEl.innerHTML = bubbleInner(state.messages[idx]);
    }
    // ---------- The open conversation's name, in the top bar ----------
    // Chat mode only: Build and Work name their own surfaces, and borrowing
    // this slot for them would put a chat's name over a build's transcript.
    // Nothing is shown when there is no named conversation open — an empty
    // string beats a placeholder, which would be a claim about a chat that
    // does not exist yet.
    const chatTitleEl = document.getElementById('tc-chat-title');
    function syncChatTitle() {
      if (!chatTitleEl) return;
      const open = state.surfaceMode === 'chat' && state.activeChat
        ? chatList.find(c => c.id === state.activeChat)
        : null;
      // The sidebar's own name wins. A chat's readable name (a rename the owner
      // typed, or the short one the title service wrote back) lives in the
      // history overlay, NOT in chatList — reading chatList alone would put the
      // raw first prompt in the top bar while the row beside it said something
      // else, and two names for one chat is worse than none.
      const named = open && window.ThomasSidebarHistory && window.ThomasSidebarHistory.displayTitle
        ? String(window.ThomasSidebarHistory.displayTitle(open.id) || '').trim()
        : '';
      const name = named || (open ? String(open.title || '').trim() : '');
      chatTitleEl.textContent = name;
      // The full name on hover: the element ellipsises, so the tooltip is the
      // only place a truncated name stays readable.
      if (name) chatTitleEl.title = name; else chatTitleEl.removeAttribute('title');
      chatTitleEl.hidden = !name;
    }
    function syncView() {
      const hasMsgs = state.messages.length > 0;
      welcomeEl.style.display = hasMsgs ? 'none' : 'flex';
      threadEl.style.display = hasMsgs ? 'flex' : 'none';
      syncChatTitle();
    }

    // ---------- Composer dynamic state (send button) ----------
    function syncDynamic() {
      const modeBusy = window.ThomasUnifiedModes && window.ThomasUnifiedModes.isBusy
        ? window.ThomasUnifiedModes.isBusy()
        : state.streaming;

      shell.style.setProperty('--send-ink', active ? 'var(--c-accent-ink)' : 'var(--c-muted)');
      shell.style.setProperty('--send-op', active ? '1' : '0.85');
      shell.style.setProperty('--send-cursor', active ? 'pointer' : 'default');

      // send arrow because clicking it queues the new task (Codex-style).
      sendIconEl.className = 'ph ' + (modeBusy && !state.input.trim() ? 'ph-stop' : 'ph-arrow-up');
    }
    function autosize() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px'; }
    function scrollEnd() { requestAnimationFrame(() => { scrollEl.scrollTop = scrollEl.scrollHeight; }); }

    // ---------- Artifact detection (mirrors _detectArtifact) ----------
    function detectArtifact(text) {
      const lc = text.toLowerCase();
      if (/\b(pdf|document|\bdoc\b|report|write[- ]?up|memo|brief|letter|note|draft)\b/.test(lc)) return { kind: 'pdf', title: 'Launch note', sub: 'PDF · 1 page', icon: 'ph-file-text' };
      if (/\b(chart|graph|plot|data|metrics|numbers|trend|stats|compare|breakdown)\b/.test(lc)) return { kind: 'chart', title: 'Weekly active by theme', sub: 'Chart · live', icon: 'ph-chart-bar' };
      if (/\b(draw|sketch|diagram|whiteboard|board|flow|map|explain|show me|visual|architecture|wireframe|how .* works)\b/.test(lc)) return { kind: 'board', title: 'How Thomas works', sub: 'Sketch · whiteboard', icon: 'ph-scribble-loop' };
      return null;
    }
    // Broader "this turn wants something on the Canvas" test: the artifact intents
    // above PLUS written content Thomas streams directly (recipe, essay, list…), so
    // we can render it live as he writes it — the real "watch it build" effect.
    // A VISUAL request (chart, design, drawing, UI) — these go to the canvas WORKER,
    // which makes a real visual. Thomas's chat text must NEVER stand in for one.
    function detectVisualIntent(text) {
      const lc = String(text).toLowerCase().replace(/\b(chart of accounts|graph (database|query|theory)|(medical|patient|astrology|birth) chart|plot (summary|of (the )?(story|book|movie)))\b/g, ' ');
      const visual = /\b((pie|bar|line|area|scatter|gantt|org(anizational)?) (chart|graph|plot)|chart|graph|plot|dashboard|histogram|heat ?map|timeline|mind ?map|flow ?chart|diagram|mock ?up|wireframe|infographic|poster|banner|logo|landing page|web ?page|ui (design|mockup)|illustration|drawing|picture|image|svg|playable (browser )?game|interactive (chart|graph|dashboard|site|app|visual))\b/, action = /\b(create|make|draw|sketch|design|paint|illustrate|render|visuali[sz]e|generate|build|show|display|present)\b/, leading = /^\s*((please|can you|could you)\s+)?(a |an |the )?(chart|graph|plot|dashboard|histogram|heat ?map|timeline|mind ?map|flow ?chart|diagram|mock ?up|wireframe|infographic|logo|poster|banner|landing page|illustration|drawing)\b/;
      return visual.test(lc) && (action.test(lc) || leading.test(lc));
    }
    function detectCanvasIntent(text) {
      if (detectArtifact(text)) return true;
      if (detectVisualIntent(text)) return true;
      const lc = String(text).toLowerCase();
      const verb = /\b(write|draft|compose|create|make|generate|build|design|put together|give me|outline|plan|list out|draw up|prepare|format)\b/;
      const noun = /\b(recipe|essay|letter|story|poem|poems|lyric|lyrics|song|list|plan|outline|guide|itinerary|schedule|agenda|table|article|post|blog|script|screenplay|instructions|steps|checklist|tutorial|walkthrough|summary|report|resume|cv|cover letter|email|template|menu|workout|routine|playbook|spec|readme|paragraph|paragraphs|write[- ]?up|document|doc)\b/;
      return verb.test(lc) && noun.test(lc);
    }

    // ---------- Activity: thinking, tools, and the REAL handoff (delegation events) ----------
    // ONE consolidated, expandable activity card per turn. Header = current
    // "Handed off to <worker>" + the action underneath + status; the ▾ caret
    // drops down the full step log (handoffs as bold milestones, tools/progress
    // as smaller lines, reasoning at the bottom). Steps update in place — never
    // duplicate bubbles.
    function _handoffStep(a, id) { return a.steps.find(s => s.kind === 'handoff' && s.id === id); }
    // Tick the running clocks in place rather than re-rendering: a re-render
    // while the user is typing a steer note would wipe what they had typed, and
    // the poll only repaints when the card is expanded — so a collapsed card
    // would have sat frozen, which is the problem this is meant to solve.
    setInterval(() => {
      document.querySelectorAll('[data-act-elapsed]').forEach(el => {
        const started = Number(el.getAttribute('data-started') || 0);
        if (started) el.textContent = elapsedLabel(Date.now() - started);
      });
    }, 1000);
    // "12s", "3m 48s", "1h 04m" — short, and always moving.
    function elapsedLabel(ms) {
      const total = Math.max(0, Math.round(Number(ms || 0) / 1000));
      if (total < 60) return total + 's';
      const m = Math.floor(total / 60), s = total % 60;
      if (m < 60) return m + 'm ' + String(s).padStart(2, '0') + 's';
      return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
    }
    function activityHTML(m) {
      const a = m.activity; if (!a) return '';

        // no separate "Thinking…" label. Once a reply exists, the reasoning is

      const primary = handoffSteps.length ? handoffSteps[handoffSteps.length - 1] : null;

      const completedWorkers = handoffSteps.filter(s => s.status === 'completed').length;
      const failedWorkers = handoffSteps.filter(s => s.status === 'failed' || s.status === 'cancelled').length;
      // Thomas-first framing: the header reads like Thomas is doing the work

        ? (completedWorkers === groupSize ? `Done — ${groupSize} results` : anyRunning ? `Working on ${groupSize} things` : `${completedWorkers} of ${groupSize} done`)

      // emitting 1,926 events nobody surfaced -- and a frozen sentence with no
      // clock is indistinguishable from a hang. The owner reasonably gave up on
      // work that then finished. The elapsed figure is the cheapest honest
      // signal available: it always moves, even when nothing else does.

      let html = `<div style="align-self:flex-start;width:fit-content;max-width:480px;border:1px solid var(--c-accent-line);border-radius:12px;background:var(--c-accent-soft);overflow:hidden;">

            ${current ? `<span style="font-size:11px;color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;">${esc(deMd(current))}</span>` : ''}
          </span>
          <span style="flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:${overallColor};margin-left:6px;">${anyRunning ? '<i class="ph ph-circle-notch" style="animation:tc-spin 1s linear infinite;font-size:14px;color:var(--c-dim);"></i>' : overall}</span>
          ${anyRunning ? `<button data-act-cancel aria-label="${a.cancelling ? 'Cancelling task' : 'Cancel task'}" title="${a.cancelling ? 'Cancelling task' : 'Cancel task'}" ${a.cancelling ? 'disabled' : ''} style="flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--c-border-2);background:transparent;color:var(--c-muted);display:grid;place-items:center;cursor:${a.cancelling ? 'wait' : 'pointer'};padding:0;"><i class="ph ${a.cancelling ? 'ph-circle-notch' : 'ph-x'}" style="font-size:12px;${a.cancelling ? 'animation:tc-spin 1s linear infinite;' : ''}"></i></button>` : ''}

    }
    // Inline document preview: a mini first-page thumbnail; click to render the
    // PDF right inside the chat (no new tab). Non-PDF falls back to an open chip.
    function artifactDownloadUrl(url) {
      const value = String(url || '');

    }
    function artifactHTML(a) {
      const many = Array.isArray(a.artifacts) ? a.artifacts.filter(art => art && (art.url || art.name)) : [];
      if (many.length > 1) {
        return `<div style="margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted);">${many.length} verified deliverables</div><div data-artifact-list style="display:flex;flex-direction:column;gap:7px;margin-top:7px;width:100%;max-width:420px;">${many.map((art, index) => {
          const name = String(art.name || art.path || ('Deliverable ' + (index + 1)));

          return `<div style="display:flex;align-items:stretch;gap:7px;"><button type="button" data-artifact-open="${index}" data-artifact-url="${esc(url)}" data-artifact-name="${esc(name)}" data-artifact-kind="${esc(String(art.kind || ''))}" ${url ? '' : 'disabled'} style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding:10px 12px;border:1px solid var(--c-border-2);border-radius:11px;background:var(--c-surface);color:var(--c-text);font-family:inherit;text-align:left;cursor:${url ? 'pointer' : 'default'};opacity:${url ? '1' : '.72'};"><span style="width:30px;height:30px;border-radius:8px;background:var(--c-accent-soft);color:var(--c-accent);display:grid;place-items:center;flex:0 0 auto;"><i class="ph ${icon}" style="font-size:16px;"></i></span><span style="min-width:0;flex:1;"><span style="display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(name)}</span><span style="display:block;margin-top:2px;font-size:11px;color:var(--c-muted);">${url ? 'Open verified result' : 'Verified result recorded'}</span></span>${url ? '<i class="ph ph-arrow-right" style="font-size:14px;color:var(--c-muted);"></i>' : ''}</button>${url ? `<a data-artifact-download href="${esc(artifactDownloadUrl(url))}" download="${esc(name)}" title="Download ${esc(name)}" style="display:grid;place-items:center;width:42px;border:1px solid var(--c-border-2);border-radius:11px;background:var(--c-surface);color:var(--c-accent);text-decoration:none;"><i class="ph ph-download-simple" style="font-size:17px;"></i><span class="sr-only">Download ${esc(name)}</span></a>` : ''}</div>`;
        }).join('')}</div>`;
      }

      const url = art.url || '', name = art.name || 'document';
      // No URL → just show the name (nothing to open). With a URL → ALWAYS render

      if (!url) {
        return `<span style="display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border:1px solid var(--c-border-2);border-radius:10px;background:var(--c-surface);color:var(--c-text);font-size:12.5px;width:max-content;"><i class="ph ph-file-text" style="color:var(--c-accent);font-size:15px;"></i> ${esc(name)}</span>`;
      }
