        return `<div style="display:flex;align-items:stretch;gap:7px;margin-top:8px;width:100%;max-width:390px;"><button type="button" data-artifact-open="0" data-artifact-url="${esc(url)}" data-artifact-name="${esc(name)}" data-artifact-kind="${esc(String(art.kind || ''))}" style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding:11px 13px;border:1px solid var(--c-border-2);border-radius:12px;background:var(--c-surface);color:var(--c-text);cursor:pointer;text-align:left;font-family:inherit;"><i class="ph ph-file-text" style="color:var(--c-accent);font-size:17px;"></i><span style="flex:1;min-width:0;"><span style="display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(name)}</span><span style="display:block;margin-top:2px;font-size:11.5px;color:var(--c-muted);">Preview</span></span><i class="ph ph-arrow-right" style="font-size:14px;color:var(--c-muted);"></i></button><a data-artifact-download href="${esc(artifactDownloadUrl(url))}" download="${esc(name)}" title="Download ${esc(name)}" style="display:grid;place-items:center;width:42px;border:1px solid var(--c-border-2);border-radius:12px;background:var(--c-surface);color:var(--c-accent);text-decoration:none;"><i class="ph ph-download-simple" style="font-size:17px;"></i><span class="sr-only">Download ${esc(name)}</span></a></div>`;

      if (a.artifactOpen) {
        return `<div style="margin-top:8px;border:1px solid var(--c-border-2);border-radius:12px;overflow:hidden;background:var(--c-surface);width:100%;max-width:560px;">
          <div style="display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--c-border);">
            <i class="ph ph-file-text" style="color:var(--c-accent);font-size:15px;flex:0 0 auto;"></i>
            <span style="flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(name)}</span>
            <a data-artifact-download href="${esc(artifactDownloadUrl(url))}" download="${esc(name)}" title="Download ${esc(name)}" style="color:var(--c-accent);display:flex;"><i class="ph ph-download-simple" style="font-size:14px;"></i><span class="sr-only">Download ${esc(name)}</span></a>
            <a href="${esc(url)}" target="_blank" rel="noopener" title="Open in new tab" style="color:var(--c-muted);display:flex;"><i class="ph ph-arrow-square-out" style="font-size:14px;"></i></a>
            <button data-artifact-toggle title="Collapse" style="border:0;background:transparent;color:var(--c-muted);cursor:pointer;display:flex;padding:0;"><i class="ph ph-caret-up" style="font-size:14px;"></i></button>

               frames show whatever the deliverable is, and most of them are

          <div style="font-size:12.5px;color:var(--c-muted);max-width:280px;line-height:1.5;min-height:18px;">${line}</div>
          <div style="width:210px;height:4px;border-radius:3px;background:var(--c-surface-2);overflow:hidden;"><div style="height:100%;width:38%;border-radius:3px;background:var(--c-accent);animation:tc-indeterminate 1.4s ease-in-out infinite;"></div></div>
          <div style="font-size:11px;color:var(--c-dim);max-width:260px;line-height:1.45;">The finished result renders here the moment it's ready.</div>
        </div>`;
        return;
      }
      if (canvasState.mode === 'ended') {
        canvasStatus.textContent = canvasState.worker ? (canvasState.worker + ' stopped') : 'Stopped';
        canvasBody.innerHTML = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--c-muted);text-align:center;padding:28px;"><i class="ph ph-warning-circle" style="font-size:28px;color:var(--c-dim);"></i><div style="font-size:13px;line-height:1.5;max-width:260px;color:var(--c-text);">${esc(canvasState.progress)}</div><div style="font-size:11.5px;color:var(--c-dim);max-width:260px;line-height:1.45;">Nothing was rendered. You can try again from the chat.</div></div>`;
        return;
      }
      canvasStatus.textContent = 'Ready';
      canvasBody.innerHTML = `<div style="flex:1;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--c-muted);text-align:center;padding:24px;"><i class="ph ph-cards-three" style="font-size:30px;color:var(--c-border-2);"></i><div style="font-size:13px;line-height:1.5;max-width:240px;">When a worker builds something renderable, it shows up here — live as it works, then rendered.</div></div>`;
    }
    // ---------- Tools (AI settings), attachments (+), voice (mic) ----------
    function saveDials() { try { localStorage.setItem('thomas_dials', JSON.stringify(state.dials)); } catch (e) {} }
    const DIAL_FIELDS = [
      { key: 'autonomy', label: 'Autonomy', num: true, opts: [[1, '1 · Chat'], [2, '2 · Assist'], [3, '3 · Agent'], [4, '4 · Full autonomy']] },
      { key: 'effort', label: 'Reasoning effort', opts: [['none', 'None'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['xhigh', 'xHigh'], ['max', 'Max']] },
      { key: 'tokenEconomy', label: 'Token economy', opts: [['cheap', 'Cheap'], ['balanced', 'Balanced'], ['max', 'Max']] },
      { key: 'fileAccess', label: 'File access', opts: [['read_only', 'Read only'], ['workspace', 'Workspace'], ['project', 'Project'], ['pc', 'Full PC'], ['full', 'Full']] },
      { key: 'guardrails', label: 'Guardrails', opts: [['open', 'Open'], ['guarded', 'Guarded'], ['fortress', 'Fortress']] },
    ];
    // The menus and inputs those controls open -- the AI-settings sheet, the
    // Thomas Library picker, the attachment chips and the mic -- now live in
    // js/chat_composer_panels.js, lifted out when this page passed its
    // 3000-line ceiling. The module is handed the closure values they used to
    // read directly and returns them under the same names, so every call site
    // below is unchanged.
    const {
      toggleToolsMenu, closeToolsMenu, toggleLibraryMenu, closeLibraryMenu,
      libraryVisibleProjects, libraryCardHTML, mountLibraryPreviews,
      chooseLibraryProject, onFiles, renderAttachments, setupMic,
    } = window.ThomasChatComposerPanels.create({
      state, esc, inputEl, autosize, syncDynamic, DIAL_FIELDS, saveDials,
    });
    // Mid-reply sends park here (visible "Queued" note on their own bubble)
    // and drain, in order, as each reply finishes. Lives in js/chat_turn_flow.js.
    const turnFlow = window.ThomasChatTurnFlow.create({
      state, inputEl, msgRefs, autosize, syncDynamic, syncView, appendMessage, renderAttachments, scrollEnd,
      sendNow: (text) => { _pendingCanvasIntent = !!detectVisualIntent(text); streamReal(text); },
    });

    // ---------- Wire up ----------
    inputEl.addEventListener('input', e => { state.input = e.target.value; autosize(); syncDynamic(); });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    document.getElementById('tc-send').addEventListener('click', () => {
      const unified = window.ThomasUnifiedModes;
      if (unified && unified.mode() !== 'chat') {
        // Typed text sends (queues if the mode is busy — Codex-style);
        // clicking with an EMPTY composer while busy stops the run.
        if (state.input.trim()) { send(); return; }
        if (unified.stop()) return;
      }
      // Same rule in Chat: typed text sends (send() queues it mid-reply, which
      // is what the arrow icon promises); only an EMPTY composer stops the run.
      if (state.streaming && !state.input.trim()) { if (abortController) { try { abortController.abort(); } catch (e) {} } }
      else { send(); }
    });
    document.getElementById('tc-search').addEventListener('input', e => { state.search = e.target.value; renderChats(); });
    // Renaming, pinning, archiving or deleting a row re-renders through the
    // owner of the list rather than the decorator patching the DOM behind it.
    if (window.ThomasSidebarHistory) window.ThomasSidebarHistory.onRefresh(renderChats);
    document.getElementById('tc-newchat').addEventListener('click', newChat);
    document.getElementById('tc-sidebar-toggle').addEventListener('click', toggleSidebar);
    document.getElementById('tc-settings').addEventListener('click', () => openWorkspace('settings'));
    // In Chat this button is the Canvas toggle — it opens the inline panel where
    // Thomas is drawing and closes it again, restoring whatever this conversation
    // last rendered. It must NOT navigate to the app_builder workspace: that hides
    // the chat AND the Canvas, which is the opposite of what the control says.
    // The full Canvas workspace is still reachable from the sidebar.
    // Inside a workspace the button keeps its other meaning (resident-Thomas drawer).
    document.getElementById('tc-canvas-btn').addEventListener('click', () => {
      if (state.workspaceOpen && window.ThomasWorkspaceChat) window.ThomasWorkspaceChat.toggle();
      else if (state.artifactOpen) closeCanvas();
      else openConversationCanvas();
    });
    document.getElementById('tc-canvas-close').addEventListener('click', closeCanvas);
    document.getElementById('tc-theme-btn').addEventListener('click', toggleThemeMenu);
    document.getElementById('tc-model-btn').addEventListener('click', toggleModelMenu);
    document.getElementById('tc-tools-btn').addEventListener('click', toggleToolsMenu);
    document.getElementById('tc-code-project-btn').addEventListener('click', toggleLibraryMenu);
    document.getElementById('tc-code-library-menu').addEventListener('click', (e) => {
      const action = e.target.closest('[data-lib-action]');
      if (action) {
        const kind = action.getAttribute('data-lib-action');
        closeLibraryMenu();
        if (kind === 'browse' && window.ThomasUnifiedModes) window.ThomasUnifiedModes.pickProject();
        if (kind === 'new' && window.ThomasUnifiedModes) {
          // A new project needs a name and its OWN folder. Sending nothing put
          // every "new" project into one shared scratch directory, which is how
          // pacman, star-catcher and museum ended up in the same folder.
          const suggested = 'Project ' + new Date().toISOString().slice(0, 10);
          const name = window.prompt('Name your new project', suggested);
          if (name !== null) window.ThomasUnifiedModes.newConversation('', name.trim() || suggested, { newProjectName: name.trim() || suggested });
        }
        return;
      }
      const card = e.target.closest('[data-lib-card]');
      if (card) chooseLibraryProject(card.getAttribute('data-lib-card'), card.getAttribute('data-lib-label'));
    });
    document.getElementById('tc-code-library-menu').addEventListener('input', (e) => {
      if (e.target && e.target.id === 'tc-library-filter') {
        state.libraryFilter = e.target.value;
        const body = document.getElementById('tc-library-body');
        const items = libraryVisibleProjects();
        if (!body) return;
        // Re-render only the results, so the field keeps focus and the caret.
        body.innerHTML = items.length
          ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px;">${items.map(libraryCardHTML).join('')}</div>`
          : `<div style="padding:30px 16px;text-align:center;color:var(--c-muted);font-size:13px;">No project matches “${esc(state.libraryFilter)}”.</div>`;
        mountLibraryPreviews();
      }
    });
    document.getElementById('tc-attach-btn').addEventListener('click', () => document.getElementById('tc-file-input').click());
    document.getElementById('tc-file-input').addEventListener('change', (e) => { onFiles(e.target.files); e.target.value = ''; });
    document.addEventListener('mousedown', e => {
      if (state.themeMenuOpen && !e.target.closest('[data-theme-switch]')) { state.themeMenuOpen = false; document.getElementById('tc-theme-menu').style.display = 'none'; }
      if (state.modelMenuOpen && !e.target.closest('[data-model-switch]')) { closeModelMenu(); }
      if (state.toolsMenuOpen && !e.target.closest('[data-tools-wrap]')) { closeToolsMenu(); }
      if (state.libraryMenuOpen && !e.target.closest('[data-code-library-wrap]')) { closeLibraryMenu(); }
    });
    // Escape closes the library. Nothing in this page handled Escape before, so
    // the guard matters: UI Edit Mode uses Escape too and must keep it.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (document.body.classList.contains('thomas-ui-editing')) return;
      if (state.libraryMenuOpen) { e.preventDefault(); closeLibraryMenu({ restoreFocus: true }); }
    });

    // ---------- Boot: pull live model + chats + session from the backend ----------
    // The conversation row carries the model that actually answered it. Stamping
    // `state.modelLabel` here instead credited every historical reply to whatever
    // is selected in the picker right now: measured on this machine, 370 of 476
    // saved chats carry a real model across EIGHT of them -- 185 gpt-5.6-sol, 136
    // codex, 37 openai_codex, 5 local, 4 qwen2.5-coder:7b, plus gpt-5.5, terra
    // and luna -- and all 370 were displayed as the current selection. Opening a
    // codex chat with Terra selected put "GPT-5.6 Terra" on a reply codex wrote.
    //
    // The raw id is shown rather than a prettied name: it is what was recorded,
    // and inventing a display name for a model no longer in the picker is how the
    // wrong label got here in the first place.
    //
    // 106 rows carry no model at all. Those now show NOTHING, because the honest
    // answer to "which model wrote this" is sometimes "not recorded" -- the same
    // reason the run report has a "Nothing was checked" state instead of dressing
    // an unknown up as a pass.
    function mapRealMessages(list, rowModel) {
      const answered = String(rowModel || '').trim();
      return (Array.isArray(list) ? list : []).map(m => ({
        role: (m.role === 'assistant' ? 'assistant' : 'user'),
        text: String(m.content != null ? m.content : (m.text || '')),
        model: (m.role === 'assistant' ? answered : ''),
      }));
    }
    // Pull the real recent-chat list (legacy store + live v2 sessions) into the sidebar.
    // Called on boot AND after each turn so a brand-new chat shows up in Recent without
    // a reload, with its real title + date. (chat history fix, 2026-06-28)
    async function refreshChats() {
      try {
        const r = await fetch('/api/chats?mode=chat');
        if (!r.ok) return;
        const d = await r.json();
        const rows = d.chats || (d.data && d.data.chats) || [];
        if (!Array.isArray(rows)) return;
        const active = state.activeChat;
        chatList = rows.map(row => {
          const msgs = mapRealMessages(row.messages, row.model);
          const firstUser = msgs.find(m => m.role === 'user');
          return { id: String(row.id || row.session_id || ''), title: String(row.title || 'Untitled chat'), preview: String(row.preview || (firstUser ? firstUser.text : '')).slice(0, 60), msgs, sessionId: row.sessionId || row.session_id || null, surfaceMode: String(row.surfaceMode || 'chat'), contextId: String(row.contextId || ''), updatedAt: Number(row.updatedAt || row.createdAt || 0) };
        }).filter(c => c.id);
        state.activeChat = active;
        renderChats();
      } catch (e) {}
    }
    // Which Thomas is this? The version alone cannot answer that when several
    // worktrees are checked out at once and all report the same string, so the
    // chip carries the port, the version and the commit, and marks a tree with
    // uncommitted edits. Clicking copies the whole line, which is the fastest
    // way to answer "what build are you on".
    async function mountBuildBadge() {
      const badge = document.getElementById('tc-build-badge');
      const label = document.getElementById('tc-build-text');
      if (!badge || !label) return;
      const port = location.port || (location.protocol === 'https:' ? '443' : '80');
      let build = null;
      try {
        const r = await fetch('/api/health', { cache: 'no-store' });
        if (r.ok) {
          const d = await r.json();
          build = (d && typeof d.build === 'object' && d.build) ? d.build : { version: d && d.version };
        }
      } catch (e) { /* offline is itself worth showing */ }

      const parts = [':' + port];
      if (build && build.version) parts.push('v' + build.version);
      if (build && build.commit) parts.push(build.commit);
      // "uncommitted" rather than the git term: it states the fact plainly for
      // anyone reading the corner of their screen.
      if (build && build.dirty) parts.push('uncommitted');
      const line = build ? parts.join(' · ') : ':' + port + ' · no answer';

      label.textContent = line;
      badge.hidden = false;
      if (build && build.dirty) badge.setAttribute('data-dirty', '1');
      const detail = [
        line,
        build && build.branch ? 'branch ' + build.branch : '',
        build && build.root ? build.root : '',
        build && build.dirty ? 'Uncommitted changes: this is not exactly the commit named above.' : '',
      ].filter(Boolean).join('\n');
      badge.title = detail + '\n\nClick to copy.';

      badge.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(detail.split('\n\n')[0]); }
        catch (e) {
          const t = document.createElement('textarea');
          t.value = line; document.body.appendChild(t); t.select();
          try { document.execCommand('copy'); } catch (e2) {}
          t.remove();
        }
        label.textContent = 'Copied';
        setTimeout(() => { label.textContent = line; }, 1200);
      });
    }

    async function boot() {
      // live model → header pill + send payload
      try {
        const r = await fetch('/api/models');
        if (r.ok) {
          const d = await r.json();
          profilesData = Array.isArray(d.profiles) ? d.profiles : [];
          await hydrateProfileModels();
          const prefs = d.preferences || {};
          // Per-specialist overrides, so the selects at the foot of the model
          // menu open showing what is actually set rather than "Same as chat".
          // This payload has always carried them; nothing in the shell read it.
          state.roleProfiles = Object.assign({}, prefs.role_profiles || {});
          state.roleModelIds = Object.assign({}, prefs.role_model_ids || {});
          const active = String(prefs.active_profile || d.default || '').trim().toLowerCase();
          const usable = (p) => !!p && (!!p.has_api_key || p.provider === 'openai_codex' || p.name === 'local');
          // Prefer the configured active profile; if it isn't usable (e.g. a keyless
          // cloud provider, or an unreachable local), fall back to the first profile
          // that can actually answer. Profile names are case-insensitive because the
          // preferences API historically returned display-cased values such as "Local".
          let pick = profilesData.find(p => String(p.name || '').trim().toLowerCase() === active);
          if (!usable(pick)) pick = profilesData.find(usable) || profilesData[0];
          if (pick) setProfile(pick);
          renderModelMenu();
        }
      } catch (e) {}
      // real recent chats → sidebar
      await refreshChats();
      // Restore the conversation that was open before the reload — reloading
      // must never LOOK like losing your chat. Falls through to a fresh
      // session only when there is nothing to come back to.
      try {
        const lastChat = localStorage.getItem('thomas_last_chat') || '';
        const lastSession = localStorage.getItem('thomas_last_session') || '';
        const row = chatList.find(c => c.id === lastChat) || chatList.find(c => c.sessionId && c.sessionId === lastSession);
        if (row) { selectChat(row.id); return; }
      } catch (e) {}
      // fresh session id for this tab
      try {
        const r = await fetch('/api/session/new', { method: 'POST' });
        if (r.ok) { const d = await r.json(); state.sessionId = d.session_id || (d.data && d.data.session_id) || state.sessionId; try { if (state.sessionId) localStorage.setItem('thomas_last_session', state.sessionId); } catch (e) {} }
      } catch (e) {}
    }

    function modeChanged(nextMode) {
      state.surfaceMode = nextMode;
      state.search = '';
      const search = document.getElementById('tc-search'); if (search) search.value = '';
      showChat();
      if (nextMode !== 'chat') resetCanvasForConversation();
      const projectWrap = document.getElementById('tc-code-project-wrap');
      if (projectWrap) {
        projectWrap.hidden = nextMode !== 'code';
        projectWrap.style.display = nextMode === 'code' ? 'block' : 'none';
      }
      closeLibraryMenu();
      renderChats();
      syncDynamic();
    }
    function setExternalBusy() {
      if (window.ThomasUnifiedModes && window.ThomasUnifiedModes.refreshChrome) window.ThomasUnifiedModes.refreshChrome();
      syncDynamic();
    }
    function announceModeStatus(message) {
      const surface = document.getElementById('tc-mode-surface');
      if (surface) surface.setAttribute('aria-label', String(message || 'Mode workspace'));
    }
    if (window.ThomasUnifiedModes) {
      window.ThomasUnifiedModes.connect({
        announce: announceModeStatus,
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, dials: Object.assign({}, state.dials) }),
        isBusy: () => !!state.streaming,
        modeChanged,
        renderHistory: renderChats,
        setBusy: setExternalBusy,
      });
    }
    if (window.ThomasWorkspaceChat) {
      window.ThomasWorkspaceChat.connect({
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, dials: Object.assign({}, state.dials) }),
      });
    }

    // ---------- Init ----------
    hydrateBots();
    renderChats();
    renderWorkspaces();
    renderCards();
    renderThemeMenu();
    applyTheme(state.theme);
    syncView();
    syncDynamic();
    autosize();
    setupMic();
    renderAttachments();
    mountBuildBadge();
    boot();
  })();
  </script>
</body>
</html>
