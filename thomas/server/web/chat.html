<!DOCTYPE html>
<!--
  Thomas Chat — faithful vanilla port of the "Thomas Chat.dc.html" design concept
  imported from claude.ai/design (project 85187ffb-...-d43e5033f957).

  This is a self-contained surface (markup + CSS + JS, no build step, no React/DC
  runtime). Served by Thomas at /static/thomas_chat.html. Five "living world"
  themes (Nebula / Dark / Light / Aurora / Sandstone), each with its own animated
  background, design tokens, fonts and welcome copy; sidebar, model pill, theme
  switcher, welcome hero, streaming message thread, composer, and the Thomas Canvas
  (whiteboard / document / chart). Behavior mirrors the design's DCLogic component.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thomas Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238b8cff'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='sans-serif' font-size='64' font-weight='700' fill='white'%3ET%3C/text%3E%3C/svg%3E">
  <!-- Shared shell rules FIRST: unified_modes.css owns the mode switch and the
       #tc-shell[data-surface-mode] visibility flips that reveal the Code/Work
       workspace. Dropping it during the CSS split left the mode surface
       display:none forever (P1 caught by the codex PR review, 2026-07-19). -->
  <link rel="stylesheet" href="/static/css/unified_modes.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_activity.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_code_results.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_work_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/unified_work_details.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/ui_edit_mode.css?v=__THOMAS_WEB_BUILD__">
  <link rel="stylesheet" href="/static/css/workspace_chat_drawer.css?v=__THOMAS_WEB_BUILD__">
  <style>
    /* Local, deterministic icon fallback: the chat shell must boot offline. */
    .ph { display: inline-grid; place-items: center; width: 1.1em; font-style: normal; font-weight: 700; }
    .ph::before { content: "\2022"; }
    .ph-pencil-simple-line::before { content: "\270E"; }
    .ph-magnifying-glass::before { content: "\2315"; }
    .ph-plus::before { content: "+"; }
    .ph-gear-six::before { content: "\2699"; }
    .ph-sidebar-simple::before { content: "\25EB"; }
    .ph-caret-down::before { content: "\2304"; }
    .ph-caret-right::before { content: "\203A"; }
    .ph-file::before { content: "\25A1"; }
    .ph-file-code::before { content: "\226A\226B"; font-size: .72em; letter-spacing: -.12em; }
    .ph-chalkboard-simple::before, .ph-desktop::before { content: "\25A3"; }
    .ph-sliders-horizontal::before { content: "\2261"; }
    .ph-microphone::before { content: "\25C9"; }
    .ph-arrow-up::before { content: "\2191"; }
    .ph-arrow-right::before { content: "\2192"; }
    .ph-arrow-clockwise::before { content: "\21BB"; }
    .ph-arrow-square-out::before { content: "\2197"; }
    .ph-download-simple::before { content: "\2193"; }
    .ph-check::before { content: "\2713"; }
    .ph-x::before, .ph-stop::before { content: "\00D7"; }
    .ph-hammer::before { content: "\2692"; }
    .ph-crosshair-simple::before { content: "\2295"; }
    .ph-buildings::before { content: "\25A6"; }
    .ph-pencil-ruler::before { content: "\270E"; }
    .ph-cards::before, .ph-grid-four::before { content: "\25A6"; }
    .ph-broadcast::before { content: "\224B"; }
    .ph-coins::before { content: "\25C9"; }
    .ph-storefront::before { content: "\25A3"; }
    .ph-users-three::before { content: "\25C9"; }
    .ph-chart-line-up::before, .ph-chart-bar::before { content: "\2197"; }
    .ph-scribble-loop::before { content: "\223F"; }
    .ph-file-text::before { content: "\25A4"; }
    .ph-code::before { content: "<>"; font-size: .72em; }
    .ph-copy::before { content: "\25A3"; }
    .ph-thumbs-up::before { content: "+"; }
    html, body { margin: 0; padding: 0; height: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    .tc-scroll { scrollbar-width: thin; scrollbar-color: var(--c-border-2) transparent; }
    .tc-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
    .tc-scroll::-webkit-scrollbar-thumb { background: var(--c-border-2); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    .tc-scroll::-webkit-scrollbar-thumb:hover { background: var(--c-muted); background-clip: padding-box; }
    /* UI */
    @keyframes tc-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes tc-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes tc-dot { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
    @keyframes tc-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes tc-pop { from { transform: scale(0.97) translateY(6px); } to { transform: scale(1) translateY(0); } }
    /* Nebula */
    @keyframes tc-twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.45; } }
    @keyframes tc-neb-drift { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(-3%,-2%,0) scale(1.08); } }
    @keyframes tc-neb-hue { 0% { filter: blur(10px) hue-rotate(0deg); } 100% { filter: blur(10px) hue-rotate(26deg); } }
    @keyframes tc-stars { 0% { transform: translateY(0); } 100% { transform: translateY(-360px); } }
    @keyframes tc-planet-drift { 0% { transform: translate(0,0); } 50% { transform: translate(-26px,-16px); } 100% { transform: translate(0,0); } }
    @keyframes tc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes tc-fly-right { from { transform: translateX(-16vw); } to { transform: translateX(116vw); } }
    @keyframes tc-fly-left { from { transform: translateX(116vw); } to { transform: translateX(-16vw); } }
    @keyframes tc-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
    /* Aurora */
    @keyframes tc-aurora { 0% { transform: translateX(-6%) skewX(-8deg) scaleY(1); } 50% { transform: translateX(6%) skewX(6deg) scaleY(1.16); } 100% { transform: translateX(-4%) skewX(-6deg) scaleY(1); } }
    @keyframes tc-snow { 0% { background-position: 0 0, 0 0, 0 0; } 100% { background-position: 0 700px, 0 500px, 0 900px; } }
    /* Sandstone */
    @keyframes tc-sun { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.9; } 50% { transform: translateY(-8px) scale(1.03); opacity: 1; } }
    @keyframes tc-sled { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
    /* Dark */
    @keyframes tc-scan { 0% { transform: translateY(-10%); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
    @keyframes tc-node { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(10px,-12px); } }
    /* Light */
    @keyframes tc-cloud { from { transform: translateX(-10vw); } to { transform: translateX(110vw); } }
    @keyframes tc-spark { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.9; transform: scale(1.1); } }
    /* Canvas */
    @keyframes tc-slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes tc-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes tc-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes tc-shimmer { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    @keyframes tc-bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    /* Bot mascot */
    @keyframes bot-flame { 0% { transform: scaleY(1) scaleX(1); } 33% { transform: scaleY(1.3) scaleX(0.82); } 66% { transform: scaleY(0.8) scaleX(1.12); } 100% { transform: scaleY(1) scaleX(1); } }
    @keyframes bot-blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

    /* Living-world visibility is driven by [data-theme] on the shell. */
    .tc-world { display: none; }
    .tc-shell[data-theme="nebula"]    .tc-world.is-nebula    { display: block; }
    .tc-shell[data-theme="aurora"]    .tc-world.is-aurora    { display: block; }
    .tc-shell[data-theme="sandstone"] .tc-world.is-sandstone { display: block; }
    .tc-shell[data-theme="dark"]      .tc-world.is-dark      { display: block; }
    .tc-shell[data-theme="light"]     .tc-world.is-light     { display: block; }

    /* Hover utilities (the design used a DC-only style-hover attribute). */
    .hv-icon:hover   { background: var(--c-hover) !important; color: var(--c-text) !important; border-color: var(--c-border-2) !important; }
    .hv-soft:hover   { background: var(--c-hover) !important; color: var(--c-text) !important; }
    .hv-pill:hover   { border-color: var(--c-border-2) !important; background: var(--c-surface-2) !important; }
    .hv-surface:hover{ background: var(--c-surface-2) !important; }
    .hv-newchat:hover{ background: var(--c-accent-soft) !important; border-color: var(--c-accent-line) !important; }
    .hv-card:hover   { border-color: var(--c-accent-line) !important; background: var(--c-surface-2) !important; transform: translateY(-2px); }

    /* Assistant answers keep the open Chat layout, but read like finished work. */
    .tc-markdown { white-space: normal !important; }
    .tc-markdown > *:first-child { margin-top: 0 !important; }
    .tc-markdown > *:last-child { margin-bottom: 0 !important; }
    .tc-markdown h1, .tc-markdown h2, .tc-markdown h3 { color: var(--c-text); font-family: var(--font-head); letter-spacing: -0.018em; }
    .tc-markdown h1 { margin: 0 0 14px; font-size: 23px; line-height: 1.25; }
    .tc-markdown h2 { margin: 24px 0 9px; font-size: 19px; line-height: 1.3; }
    .tc-markdown h3 { margin: 21px 0 8px; font-size: 16px; line-height: 1.35; }
    .tc-markdown p { margin: 0 0 11px; }
    .tc-markdown ul, .tc-markdown ol { margin: 5px 0 13px; padding-left: 22px; }
    .tc-markdown li { margin: 4px 0; padding-left: 2px; }
    .tc-markdown strong { color: var(--c-text); font-weight: 750; }
    .tc-markdown code { border: 1px solid var(--c-border); border-radius: 5px; background: var(--c-surface-2); padding: 1px 5px; font-family: var(--font-mono); font-size: .88em; }
    .tc-markdown pre { margin: 12px 0 15px; overflow-x: auto; border: 1px solid var(--c-border); border-radius: 11px; background: rgba(3,5,13,.62); padding: 13px 15px; color: var(--c-text); font: 13px/1.6 var(--font-mono); white-space: pre; }
    .tc-markdown pre code { border: 0; background: transparent; padding: 0; font: inherit; }
    .tc-markdown hr { margin: 19px 0; border: 0; border-top: 1px solid var(--c-border); }
    .tc-markdown a { color: var(--c-accent); text-underline-offset: 3px; }

    /* Chat content "rail": its left edge is anchored to a VIEWPORT-relative
       position (not the column's width), so when the Canvas opens and the chat
       column shrinks from the right, the composer/thread DON'T slide — they only
       narrow. 524 = 140 (half sidebar) + 384 (half of the 768 content width). */
    .tc-rail { margin-left: max(16px, calc(50vw - 524px)) !important; margin-right: auto !important; }
    @media (max-width: 1080px) {
      /* Small screens: space "demands it" — re-center content and let the Canvas
         overlay the chat instead of squeezing it. */
      .tc-rail { margin-left: auto !important; }
      #tc-canvas { position: absolute !important; top: 0; right: 0; bottom: 0; z-index: 40; width: min(94vw, 540px) !important; box-shadow: var(--c-shadow); }
    }
    @media (max-width: 760px) {
      .tc-sidebar { position: absolute !important; inset: 0 auto 0 0; z-index: 80 !important; margin-left: -280px !important; box-shadow: var(--c-shadow); }
      .tc-shell.is-mobile-sidebar-open .tc-sidebar { margin-left: 0 !important; }
      #tc-canvas { width: 100vw !important; }
    }
    @keyframes tc-shimmer-loop { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes tc-indeterminate { 0% { transform: translateX(-130%); } 100% { transform: translateX(380%); } }
    /* Canvas live document — Thomas's streamed content rendered as a real page,
       growing as he writes (the Claude-design "watch it build" effect). */
    .tc-doc-page { flex: 0 0 auto; align-self: stretch; background: #fff; color: #1d2330; border-radius: 10px; padding: 30px 32px; box-shadow: 0 12px 34px rgba(0,0,0,0.28); font-family: var(--font-serif, Georgia, 'Times New Roman', serif); line-height: 1.7; font-size: 15px; }
    .tc-doc-page > *:first-child { margin-top: 0; }
    .tc-doc-page h1 { font-size: 25px; line-height: 1.25; margin: 0 0 12px; font-weight: 700; }
    .tc-doc-page h2 { font-size: 19px; margin: 22px 0 8px; font-weight: 700; }
    .tc-doc-page h3 { font-size: 16px; margin: 18px 0 6px; font-weight: 700; }
    .tc-doc-page p { margin: 0 0 12px; }
    .tc-doc-page ul, .tc-doc-page ol { margin: 0 0 12px; padding-left: 24px; }
    .tc-doc-page li { margin: 3px 0; }
    .tc-doc-page code { background: #eef1f7; border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.9em; }
    .tc-doc-page strong { font-weight: 700; } .tc-doc-page em { font-style: italic; }
    .tc-doc-page hr { border: 0; border-top: 1px solid #e4e7ef; margin: 18px 0; }
    .tc-doc-page a { color: #2f6bff; }
    .tc-doc-cursor { display: inline-block; width: 6px; height: 1.02em; background: #2f6bff; margin-left: 1px; vertical-align: text-bottom; border-radius: 1px; animation: tc-blink 1s step-end infinite; }
    @keyframes tc-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  </style>
</head>
<body data-ui-workspace="chat">
  <!-- Shell. Default vars below = Nebula Core (mirrors the design's inline root). -->
  <div id="tc-shell" class="tc-shell" data-theme="nebula" data-ui-id="chat.shell" data-ui-label="Thomas Chat shell" data-ui-policy="root protected" style="position: relative; display: flex; height: 100vh; width: 100%; overflow: hidden; font-family: var(--font-sans); color: var(--c-text); background: var(--c-bg); --c-bg: #070912; --c-sidebar: rgba(11,14,26,0.72); --c-surface: rgba(255,255,255,0.04); --c-surface-2: rgba(255,255,255,0.08); --c-hover: rgba(255,255,255,0.06); --c-border: rgba(255,255,255,0.10); --c-border-2: rgba(255,255,255,0.17); --c-text: #eef0fb; --c-dim: rgba(238,240,251,0.66); --c-muted: rgba(238,240,251,0.42); --c-accent: #8b8cff; --c-accent-ink: #0a0b16; --c-accent-soft: rgba(139,140,255,0.16); --c-accent-line: rgba(139,140,255,0.45); --c-user-bg: rgba(124,118,235,0.20); --c-user-text: #eef0fb; --c-composer-bg: rgba(16,19,34,0.86); --c-menu-bg: #15142b; --c-shadow: 0 18px 50px rgba(2,4,12,0.55); --bot-primary: #9ad8ff; --bot-secondary: #5aaeff; --bot-glow: rgba(90,174,255,0.5); --bot-trim: #0d1117; --r-card: 14px; --r-composer: 18px; --font-head: 'Manrope', system-ui, sans-serif; --font-label: 'Manrope', system-ui, sans-serif; --font-sans: 'Manrope', system-ui, sans-serif; --font-serif: 'Newsreader', Georgia, serif; --font-mono: 'JetBrains Mono', ui-monospace, monospace; --sidebar-margin: 0;">

    <!-- ===================== LIVING WORLDS (behind everything) ===================== -->
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;">

      <!-- NEBULA -->
      <div class="tc-world is-nebula">
        <div style="position: absolute; inset: -12%;">
          <div style="position: absolute; inset: 0; background:
              radial-gradient(42% 46% at 24% 30%, rgba(124,108,255,0.42), transparent 60%),
              radial-gradient(38% 42% at 80% 22%, rgba(64,196,224,0.28), transparent 62%),
              radial-gradient(48% 50% at 64% 82%, rgba(196,86,196,0.24), transparent 60%),
              radial-gradient(64% 64% at 50% 50%, rgba(38,28,86,0.32), transparent 72%);
              animation: tc-neb-drift 160s ease-in-out infinite alternate, tc-neb-hue 110s ease-in-out infinite alternate;"></div>
          <div style="position: absolute; inset: 0; background-image:
              radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,0.95), transparent),
              radial-gradient(1px 1px at 28% 64%, rgba(255,255,255,0.7), transparent),
              radial-gradient(1.6px 1.6px at 47% 32%, rgba(214,224,255,0.9), transparent),
              radial-gradient(1px 1px at 63% 72%, rgba(255,255,255,0.65), transparent),
              radial-gradient(1.3px 1.3px at 78% 44%, rgba(255,255,255,0.85), transparent),
              radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,0.6), transparent),
              radial-gradient(1px 1px at 38% 88%, rgba(255,255,255,0.7), transparent),
              radial-gradient(1.2px 1.2px at 8% 52%, rgba(255,255,255,0.8), transparent),
              radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,0.7), transparent),
              radial-gradient(1.5px 1.5px at 70% 58%, rgba(230,224,255,0.9), transparent);
              background-size: 360px 360px; animation: tc-stars 150s linear infinite, tc-twinkle 5s ease-in-out infinite;"></div>
        </div>
        <div style="position: absolute; right: 6%; bottom: -90px; width: 240px; height: 240px; animation: tc-planet-drift 90s ease-in-out infinite;">
          <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #8f8cff, #4b3fa6 58%, #221a52 100%); box-shadow: inset -26px -20px 50px rgba(0,0,0,0.55), 0 0 70px rgba(124,108,255,0.22);"></div>
          <div style="position: absolute; top: 44%; left: -22%; width: 144%; height: 36px; border-radius: 50%; border: 3px solid rgba(173,160,255,0.5); transform: rotate(-18deg) scaleY(0.34); animation: tc-spin 80s linear infinite;"></div>
        </div>
        <div style="position: absolute; left: 9%; top: 14%; width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #7fe4cf, #2f8f93 60%, #16454f 100%); box-shadow: inset -10px -8px 22px rgba(0,0,0,0.5), 0 0 36px rgba(71,215,172,0.25); animation: tc-planet-drift 70s ease-in-out infinite reverse;"></div>
        <div style="position: absolute; right: 26%; top: 22%; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #e7ecff, #97a0c8 70%, #5b6088); box-shadow: inset -4px -3px 8px rgba(0,0,0,0.4);"></div>
        <div style="position: absolute; top: 17%; left: 0; animation: tc-fly-right 30s linear infinite;">
          <div style="animation: tc-bob 4s ease-in-out infinite;" data-bot data-primary="#bcd8ff" data-secondary="#6f9bff" data-trim="#0a0e1c" data-glow="rgba(120,150,255,0.55)" data-scale="0.62" data-flame="true"></div>
        </div>
        <div style="position: absolute; top: 33%; left: 0; transform: scaleX(-1); animation: tc-fly-left 40s linear infinite;">
          <div style="animation: tc-bob 5s ease-in-out infinite;" data-bot data-primary="#c8b8ff" data-secondary="#8b7bff" data-trim="#0a0e1c" data-glow="rgba(150,120,255,0.5)" data-scale="0.5" data-flame="true"></div>
        </div>
        <div style="position: absolute; top: 64%; left: 0; animation: tc-fly-right 52s linear infinite;">
          <div style="animation: tc-bob 6s ease-in-out infinite;" data-bot data-primary="#a8e8ff" data-secondary="#5ec4e6" data-trim="#0a0e1c" data-glow="rgba(94,196,230,0.45)" data-scale="0.38" data-flame="true"></div>
        </div>
      </div>

      <!-- AURORA -->
      <div class="tc-world is-aurora">
        <div style="position: absolute; top: -34%; left: -20%; width: 140%; height: 95%; background: linear-gradient(115deg, transparent 22%, rgba(52,224,176,0.30) 42%, rgba(70,160,255,0.22) 56%, transparent 76%); filter: blur(44px); animation: tc-aurora 20s ease-in-out infinite;"></div>
        <div style="position: absolute; top: -44%; left: -10%; width: 130%; height: 100%; background: linear-gradient(98deg, transparent 30%, rgba(120,255,214,0.2) 50%, transparent 72%); filter: blur(54px); animation: tc-aurora 30s ease-in-out infinite reverse;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(1.6px 1.6px at 20% 16%, rgba(255,255,255,0.9), transparent), radial-gradient(1.2px 1.2px at 60% 8%, rgba(255,255,255,0.7), transparent), radial-gradient(1.4px 1.4px at 84% 22%, rgba(255,255,255,0.8), transparent), radial-gradient(1.2px 1.2px at 38% 30%, rgba(255,255,255,0.7), transparent); background-size: 100% 100%;"></div>
        <div style="position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20% 20%, rgba(255,255,255,0.8), transparent), radial-gradient(2px 2px at 70% 40%, rgba(255,255,255,0.6), transparent), radial-gradient(1.5px 1.5px at 45% 70%, rgba(255,255,255,0.7), transparent); background-size: 260px 260px, 320px 320px, 200px 200px; animation: tc-snow 24s linear infinite; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, transparent, rgba(6,30,30,0.6)); clip-path: polygon(0 100%, 0 56%, 12% 38%, 24% 60%, 38% 30%, 52% 58%, 66% 26%, 80% 54%, 92% 36%, 100% 56%, 100% 100%);"></div>
        <div style="position: absolute; top: 38%; left: 0; animation: tc-fly-right 46s linear infinite;">
          <div style="animation: tc-bob 5.5s ease-in-out infinite;" data-bot data-primary="#a8f0da" data-secondary="#34e0b0" data-trim="#06302a" data-glow="rgba(52,224,176,0.5)" data-scale="0.52" data-flame="true"></div>
        </div>
      </div>

      aurora:    { bot: ['#a8f0da', '#34e0b0', 'rgba(52,224,176,0.45)'], trim: '#06302a', fontHead: "'Manrope', system-ui, sans-serif", fontLabel: "'Manrope', system-ui, sans-serif", rCard: '14px', rComposer: '18px', menuBg: '#0c2226', composerAccent: 'linear-gradient(90deg, transparent, rgba(52,224,176,0.7), rgba(70,160,255,0.5), transparent)', msgRule: '0', welcome: ['Good evening.', 'A calm place to think. Thomas takes the ask, hands it off, and reports back.'] },

    };

    // ---------- State ----------
    const state = { theme: loadTheme(), surfaceMode: 'chat', themeMenuOpen: false, input: '', search: '', messages: [], activeChat: null, streaming: false, artifactOpen: false, artifactKind: 'board', sessionId: null, restoredCanvas: null, profile: '', modelId: '', modelLabel: '' };
    let timer = null, abortController = null;

    const msgRefs = []; // per-message { bubbleEl } for in-place streaming updates

    let chatList = [];
    let profilesData = [];        // model profiles from GET /api/models
    state.modelMenuOpen = false;
    // AI settings ("Tools"), attachments ("+"), and voice ("mic") state

    const DIAL_DEFAULTS = { autonomy: 3, effort: 'medium', tokenEconomy: 'balanced', fileAccess: 'workspace', guardrails: 'guarded', memory: true };
    state.dials = (function () {
      try {
        const stored = JSON.parse(localStorage.getItem('thomas_dials') || '{}');
        // One-time migration: autonomy 1 stored before 2026-07-18 was the OLD
        // default, not a user choice. Lift it to the new default once; after
        // that the user's own dial changes always stick.
        if (stored.autonomy === 1 && !localStorage.getItem('thomas_dials_autonomy_migrated')) {
          stored.autonomy = DIAL_DEFAULTS.autonomy;
          localStorage.setItem('thomas_dials_autonomy_migrated', '1');
          localStorage.setItem('thomas_dials', JSON.stringify(stored));
        }
        return Object.assign({}, DIAL_DEFAULTS, stored);
      } catch (e) { return Object.assign({}, DIAL_DEFAULTS); }
    })();
    state.docs = []; state.images = []; state.toolsMenuOpen = false; state.listening = false;

    // ---------- Element refs ----------
    const shell = document.getElementById('tc-shell');

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // ---------- Bot mascot (mirrors Bot.dc.html) ----------
    function botHTML(p) {
      const flame = (p.flame === true || p.flame === 'true');
      const trim = p.trim, primary = p.primary, secondary = p.secondary;
      return `<div style="position: relative; width: 58px; height: 54px; image-rendering: pixelated; transform: scale(${p.scale}); transform-origin: center; filter: drop-shadow(0 8px 16px ${p.glow});">
        ${flame ? `<span style="position: absolute; top: 22px; left: 1px; width: 8px; height: 16px; background: linear-gradient(180deg, #5a6e8a, #3b4d66); border: 1px solid ${trim}; border-radius: 2px;"></span>
        <span style="position: absolute; top: 38px; left: -3px; width: 16px; height: 13px; background: radial-gradient(ellipse at 50% 0%, #ffd54f 0%, #ff9800 35%, #ff5722 65%, transparent 100%); border-radius: 0 0 50% 50%; filter: blur(0.6px); transform-origin: 50% 0; animation: bot-flame 0.22s linear infinite;"></span>` : ''}
        <span style="position: absolute; top: 2px; left: 16px; width: 24px; height: 14px; border: 2px solid ${trim}; background: ${primary};">
          <span style="position: absolute; top: 3px; left: 4px; width: 4px; height: 4px; background: #0b1726; transform-origin: center; animation: bot-blink 4.6s ease-in-out infinite;"></span>
          <span style="position: absolute; top: 3px; left: 13px; width: 4px; height: 4px; background: #0b1726; transform-origin: center; animation: bot-blink 4.6s ease-in-out infinite;"></span>
        </span>
        <span style="position: absolute; top: 18px; left: 13px; width: 30px; height: 18px; border: 2px solid ${trim}; background: linear-gradient(to bottom, ${primary} 0, ${primary} 44%, ${secondary} 45%, ${secondary} 100%);">
          <span style="position: absolute; top: 5px; left: 6px; width: 18px; height: 3px; background: rgba(11,23,38,0.5); border-radius: 2px;"></span>
        </span>
        <span style="position: absolute; top: 36px; left: 18px; width: 8px; height: 10px; border: 2px solid ${trim}; background: ${secondary};"></span>
        <span style="position: absolute; top: 36px; left: 32px; width: 8px; height: 10px; border: 2px solid ${trim}; background: ${secondary};"></span>
      </div>`;
    }
    function hydrateBots() {
      document.querySelectorAll('[data-bot]').forEach(el => {
        el.innerHTML = botHTML({ primary: el.dataset.primary, secondary: el.dataset.secondary, trim: el.dataset.trim, glow: el.dataset.glow, scale: el.dataset.scale, flame: el.dataset.flame });
      });
    }

    // ---------- Avatar (the little accent square with two dots) ----------
    function avatar(size, radius, dotW, dotH) {
      return `<span style="width: ${size}px; height: ${size}px; border-radius: ${radius}px; background: var(--c-accent); display: grid; place-items: center; flex: 0 0 auto;">
        <span style="display: flex; gap: 3px;"><span style="width: ${dotW}px; height: ${dotH}px; border-radius: 1px; background: var(--c-accent-ink);"></span><span style="width: ${dotW}px; height: ${dotH}px; border-radius: 1px; background: var(--c-accent-ink);"></span></span>
      </span>`;
    }

    // ---------- Theme ----------
    function loadTheme() { try { const t = localStorage.getItem('thomas_chat_theme'); if (t && THEMES[t]) return t; } catch (e) {} return 'nebula'; }

    function applyTheme(name) {
      const t = THEMES[name]; if (!t) return;
      Object.entries(t.vars).forEach(([k, v]) => shell.style.setProperty(k, v));
      if (window.ThomasWorkspaceShell) window.ThomasWorkspaceShell.applyTheme(name, { vars: t.vars, persist: false });
      shell.style.setProperty('--sw-1', t.sw[0]); shell.style.setProperty('--sw-2', t.sw[1]); shell.style.setProperty('--sw-3', t.sw[2]);
      const m = THEME_META[name];
      if (m) {
        shell.style.setProperty('--bot-primary', m.bot[0]); shell.style.setProperty('--bot-secondary', m.bot[1]); shell.style.setProperty('--bot-glow', m.bot[2]); shell.style.setProperty('--bot-trim', m.trim);
        shell.style.setProperty('--font-head', m.fontHead); shell.style.setProperty('--font-label', m.fontLabel);
        shell.style.setProperty('--r-card', m.rCard); shell.style.setProperty('--r-composer', m.rComposer);
        shell.style.setProperty('--c-menu-bg', m.menuBg); shell.style.setProperty('--composer-accent', m.composerAccent); shell.style.setProperty('--msg-rule-on', m.msgRule);
      }
      shell.dataset.theme = name;
      document.getElementById('tc-theme-name').textContent = t.name;
      if (m) { document.getElementById('tc-welcome-title').textContent = m.welcome[0]; document.getElementById('tc-welcome-sub').textContent = m.welcome[1]; }
      // re-tint the welcome hero bot (it reads --bot-* vars, so re-render to pick up new values)
      const heroBot = welcomeEl.querySelector('[data-bot]');
      if (heroBot) heroBot.innerHTML = botHTML({ primary: 'var(--bot-primary)', secondary: 'var(--bot-secondary)', trim: 'var(--bot-trim)', glow: 'var(--bot-glow)', scale: heroBot.dataset.scale, flame: heroBot.dataset.flame });
      document.querySelectorAll('.tc-workspace-frame').forEach((frame) => {
        if (frame.contentWindow && window.ThomasWorkspaceShell) window.ThomasWorkspaceShell.sendTheme(frame, name, t.vars);
      });
    }
    function selectTheme(name) {
      state.theme = name; state.themeMenuOpen = false; applyTheme(name);
      try { localStorage.setItem('thomas_chat_theme', name); } catch (e) {}
      renderThemeMenu(); document.getElementById('tc-theme-menu').style.display = 'none';
    }
    function toggleThemeMenu() {
      state.themeMenuOpen = !state.themeMenuOpen;
      document.getElementById('tc-theme-menu').style.display = state.themeMenuOpen ? 'block' : 'none';
      if (state.themeMenuOpen) renderThemeMenu();
    }
    function renderThemeMenu() {
      const wrap = document.getElementById('tc-theme-options');
      wrap.innerHTML = '';
      Object.keys(THEMES).forEach(key => {
        const t = THEMES[key], sel = key === state.theme;
        const b = document.createElement('button');
        b.className = 'hv-soft';
        b.style.cssText = `width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 9px; border-radius: 10px; border: 1px solid ${sel ? 'var(--c-accent-line)' : 'transparent'}; background: ${sel ? 'var(--c-accent-soft)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: pointer; text-align: left; transition: all .14s; margin-bottom: 2px;`;
        b.innerHTML = `<span style="display: inline-flex; border-radius: 7px; overflow: hidden; border: 1px solid var(--c-border-2); flex: 0 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.25);">
            <span style="width: 14px; height: 30px; background: ${t.sw[0]};"></span>
            <span style="width: 14px; height: 30px; background: ${t.sw[1]};"></span>
            <span style="width: 14px; height: 30px; background: ${t.sw[2]};"></span>
          </span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 13.5px; font-weight: 700;">${esc(t.name)}</span>
            <span style="display: block; font-size: 11.5px; color: var(--c-muted);">${esc(t.tagline)}</span>

        b.addEventListener('click', () => selectTheme(key));
        wrap.appendChild(b);
      });
    }

    // ---------- Model selector ----------
    function profileModelOptions(p) {
      if (p && Array.isArray(p.models) && p.models.length) return p.models;
      return [{ id: String(p && (p.model || p.name) || 'model'), display_name: String(p && (p.model || p.name) || 'model'), is_default: true, available: true }];
    }
    async function hydrateProfileModels() {
      await Promise.all(profilesData.map(async p => {
        const provider = String(p && p.provider || '').toLowerCase().replace(/-/g, '_');
        if (provider !== 'openai_codex') return;
        try {
          const r = await fetch('/api/openai-codex/models?profile=' + encodeURIComponent(p.name));
          if (!r.ok) return;
          const data = await r.json();
          if (Array.isArray(data.models) && data.models.length) p.models = data.models;
        } catch (e) {}
      }));
    }
    function persistModelSelection(profileName, modelId) {
      fetch('/api/preferences', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ advanced: { model: { active_profile: profileName, model_id: modelId } } }),
      }).catch(() => {});
    }
    function setProfile(p, modelOption) {
      if (!p) return;
      const models = profileModelOptions(p);
      const choice = modelOption || models.find(m => m.is_default && m.available !== false) || models.find(m => m.available !== false) || models[0];
      if (!choice || choice.available === false) return;
      state.profile = p.name;
      state.modelId = choice.id || p.model || '';
      state.modelLabel = String(choice.display_name || choice.id || p.model || p.name || 'model').split('/').pop();
      const el = document.getElementById('tc-model'); if (el) el.textContent = state.modelLabel;
      const effortControl = p.chat_controls && p.chat_controls.model && p.chat_controls.model.reasoning_effort;
      const validEfforts = effortControl && Array.isArray(effortControl.options) ? effortControl.options.map(o => String(o.value)) : [];
      if (validEfforts.length && !validEfforts.includes(String(state.dials.effort))) {
        state.dials.effort = String(effortControl.default_value || 'medium'); saveDials();
      }
      if (modelOption) persistModelSelection(state.profile, state.modelId);
    }
    function toggleModelMenu() {
      state.modelMenuOpen = !state.modelMenuOpen;
      document.getElementById('tc-model-menu').style.display = state.modelMenuOpen ? 'block' : 'none';
      if (state.modelMenuOpen) renderModelMenu();
    }
    function closeModelMenu() { state.modelMenuOpen = false; document.getElementById('tc-model-menu').style.display = 'none'; }
    function renderModelMenu() {
      const wrap = document.getElementById('tc-model-options'); if (!wrap) return;
      wrap.innerHTML = '';
      profilesData.forEach(p => {
        const usableProfile = !!p.has_api_key || p.provider === 'openai_codex' || p.name === 'local';
        profileModelOptions(p).forEach(m => {
          const sel = p.name === state.profile && String(m.id || '') === String(state.modelId || '');
          const usable = usableProfile && m.available !== false;
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'hv-soft'; b.disabled = !usable;
          if (m.unavailable_reason) b.title = String(m.unavailable_reason);
          b.style.cssText = `width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 10px; border: 1px solid ${sel ? 'var(--c-accent-line)' : 'transparent'}; background: ${sel ? 'var(--c-accent-soft)' : 'transparent'}; color: var(--c-text); font-family: inherit; cursor: ${usable ? 'pointer' : 'not-allowed'}; text-align: left; transition: all .14s; margin-bottom: 2px; opacity: ${usable ? '1' : '0.5'};`;
          const status = !usableProfile ? ' · needs key' : (m.available === false ? ' · unavailable on this connection' : '');
          b.innerHTML = `<span style="flex: 1; min-width: 0;">
              <span style="display: block; font-size: 13px; font-weight: 700;">${esc(String(m.display_name || m.id || p.name).split('/').pop())}</span>
              <span style="display: block; font-size: 11px; color: var(--c-muted);">${esc(p.name)}${status}</span>
            </span>
            <i class="ph ph-check" style="font-size: 15px; color: var(--c-accent); opacity: ${sel ? '1' : '0'};"></i>`;
          if (usable) b.addEventListener('click', () => { setProfile(p, m); closeModelMenu(); });
          wrap.appendChild(b);
        });
      });
    }

    // ---------- Sidebar lists ----------
    function fmtChatDate(ms) {
      const n = Number(ms); if (!n) return '';
      const d = new Date(n), now = new Date();
      if (isNaN(d.getTime())) return '';
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const y = new Date(now); y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      const opts = d.getFullYear() === now.getFullYear() ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' };
      return d.toLocaleDateString([], opts);
    }
    function renderChats() {
      const query = String(state.search || '').trim().toLowerCase();
      const wrap = document.getElementById('tc-chats');
      if (window.ThomasUnifiedModes && window.ThomasUnifiedModes.renderHistory(wrap, query)) return;
      const chats = query
        ? chatList.filter(c => (String(c.title || '') + '\n' + String(c.preview || '')).toLowerCase().includes(query))
        : chatList;

            <rect x="110" y="18" width="180" height="44" rx="10" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .7s ease forwards .3s;"></rect>
            <path d="M200 62 L200 96" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .4s ease forwards 1.0s;"></path>
            <path d="M192 88 L200 98 L208 88" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .3s ease forwards 1.3s;"></path>
            <rect x="110" y="98" width="180" height="44" rx="10" pathLength="1" stroke="#9ad8ff" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .7s ease forwards 1.5s;"></rect>
            <path d="M200 142 L200 176" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .4s ease forwards 2.2s;"></path>
            <path d="M192 168 L200 178 L208 168" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .3s ease forwards 2.5s;"></path>
            <rect x="110" y="178" width="180" height="44" rx="10" pathLength="1" stroke="#ffd6a7" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .7s ease forwards 2.7s;"></rect>
            <path d="M110 200 C40 200 40 40 108 40" pathLength="1" stroke="#f4a7c8" stroke-dasharray="1" style="stroke-dashoffset: 1; animation: tc-draw 1s ease forwards 3.4s;"></path>
            <path d="M104 48 L108 38 L116 44" pathLength="1" stroke="#f4a7c8" style="stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw .3s ease forwards 4.3s;"></path>
          </g>
          <text x="200" y="45" text-anchor="middle" fill="#eafff6" font-family="Caveat, cursive" font-size="21" style="opacity: 0; animation: tc-fade-up .4s ease forwards 1.0s;">You ask</text>
          <text x="200" y="125" text-anchor="middle" fill="#eafff6" font-family="Caveat, cursive" font-size="21" style="opacity: 0; animation: tc-fade-up .4s ease forwards 2.2s;">Thomas plans</text>
          <text x="200" y="205" text-anchor="middle" fill="#eafff6" font-family="Caveat, cursive" font-size="21" style="opacity: 0; animation: tc-fade-up .4s ease forwards 3.4s;">Worker builds it</text>
          <text x="44" y="125" text-anchor="middle" fill="#f4a7c8" font-family="Caveat, cursive" font-size="17" style="opacity: 0; animation: tc-fade-up .4s ease forwards 4.6s;">reports back</text>
        </svg>
        <div style="position: absolute; right: 12px; bottom: 8px;" data-bot data-primary="#9ad8ff" data-secondary="#5aaeff" data-trim="#0a0e1c" data-glow="rgba(90,174,255,0.4)" data-scale="0.7" data-flame="false"></div>
      </div>
      <p style="margin: 14px 2px 0; font-size: 13px; color: var(--c-dim); line-height: 1.6;">Thomas sketches the flow live — you ask, he plans, a worker builds it, and the result reports back to chat. He never does the work in the chat thread itself.</p>`;
    }
    function pdfHTML() {
      const pdfLines = [ { w: '100%', delay: '.8s' }, { w: '96%', delay: '.9s' }, { w: '88%', delay: '1.0s' }, { w: '93%', delay: '1.1s' }, { w: '64%', delay: '1.2s' } ];
      const pdfLines2 = [ { w: '92%', delay: '1.9s' }, { w: '85%', delay: '2.0s' }, { w: '70%', delay: '2.1s' } ];
      const pdfBars = [ { h: '40%', delay: '1.4s' }, { h: '65%', delay: '1.5s' }, { h: '52%', delay: '1.6s' }, { h: '80%', delay: '1.7s' }, { h: '95%', delay: '1.8s' } ];
      const line = ln => `<div style="height: 9px; border-radius: 4px; background: rgba(20,30,60,0.10); margin-bottom: 10px; width: ${ln.w}; opacity: 0; animation: tc-fade-up .4s ease forwards ${ln.delay};"></div>`;
      return `<div style="position: relative; border-radius: 12px; background: #ffffff; color: #1d2330; box-shadow: 0 14px 36px rgba(0,0,0,0.4); overflow: hidden; border: 1px solid rgba(0,0,0,0.1);">
        <div style="position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none;"><div style="position: absolute; top: 0; bottom: 0; left: 0; width: 60%; transform: translateX(-120%); background: linear-gradient(100deg, transparent, rgba(120,140,255,0.22), transparent); animation: tc-shimmer 1.3s ease-out forwards;"></div></div>
        <div style="height: 7px; background: linear-gradient(90deg, #2f6bff, #8b8cff);"></div>
        <div style="padding: 22px 24px;">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #2f6bff; opacity: 0; animation: tc-fade-up .4s ease forwards .3s;">Launch Note</div>
          <h2 style="margin: 6px 0 2px; font-family: var(--font-serif); font-size: 23px; line-height: 1.2; color: #131826; opacity: 0; animation: tc-fade-up .4s ease forwards .45s;">The New Thomas Chat — redesigned</h2>
          <div style="font-size: 12px; color: #6b7280; opacity: 0; animation: tc-fade-up .4s ease forwards .6s;">Drafted by Thomas · just now · 1 page</div>
          <div style="height: 1px; background: rgba(0,0,0,0.08); margin: 14px 0; opacity: 0; animation: tc-fade-up .4s ease forwards .7s;"></div>
          ${pdfLines.map(line).join('')}
          <div style="display: flex; align-items: flex-end; gap: 10px; height: 90px; margin: 18px 0 6px; padding: 12px; border-radius: 10px; background: #f5f7fb;">
            ${pdfBars.map(bar => `<div style="flex: 1; height: ${bar.h}; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, #6f9bff, #2f6bff); transform-origin: bottom; transform: scaleY(0); animation: tc-bar .6s cubic-bezier(.2,.8,.2,1) forwards ${bar.delay};"></div>`).join('')}
          </div>
          ${pdfLines2.map(line).join('')}
        </div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="hv-surface" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px; border-radius: 10px; border: 1px solid var(--c-border-2); background: var(--c-surface); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><i class="ph ph-download-simple" style="font-size: 15px;"></i> Download</button>
        <button class="hv-surface" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px; border-radius: 10px; border: 1px solid var(--c-border-2); background: var(--c-surface); color: var(--c-text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><i class="ph ph-arrow-square-out" style="font-size: 15px;"></i> Open</button>
      </div>`;
    }
    function chartHTML() {
      const chartBars = [
        { label: 'Nebula', h: '88%', color: '#8b8cff', glow: 'rgba(139,140,255,0.4)', delay: '.3s' },
        { label: 'Dark', h: '62%', color: '#6e9bff', glow: 'rgba(110,155,255,0.35)', delay: '.42s' },
        { label: 'Light', h: '74%', color: '#2f6bff', glow: 'rgba(47,107,255,0.3)', delay: '.54s' },
        { label: 'Aurora', h: '53%', color: '#34e0b0', glow: 'rgba(52,224,176,0.4)', delay: '.66s' },
        { label: 'Sandstone', h: '41%', color: '#c0603c', glow: 'rgba(192,96,60,0.4)', delay: '.78s' },
      ];
      return `<div style="border-radius: 14px; background: var(--c-surface); border: 1px solid var(--c-border); padding: 18px;">
        <div style="font-size: 14px; font-weight: 700; opacity: 0; animation: tc-fade-up .4s ease forwards .2s;">Weekly active chats by theme</div>
        <div style="font-size: 11.5px; color: var(--c-muted); margin-top: 2px; opacity: 0; animation: tc-fade-up .4s ease forwards .3s;">Live from the workspace · last 7 days</div>
        <div style="display: flex; align-items: flex-end; gap: 12px; height: 180px; margin-top: 18px; padding-bottom: 26px; position: relative;">
          <div style="position: absolute; left: 0; right: 0; bottom: 26px; height: 1px; background: var(--c-border);"></div>
          ${chartBars.map(bar => `<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px;">
            <div style="width: 100%; max-width: 46px; height: ${bar.h}; border-radius: 7px 7px 0 0; background: ${bar.color}; transform-origin: bottom; transform: scaleY(0); animation: tc-bar .7s cubic-bezier(.2,.8,.2,1) forwards ${bar.delay}; box-shadow: 0 0 18px ${bar.glow};"></div>
            <span style="font-size: 11px; color: var(--c-dim); white-space: nowrap;">${bar.label}</span>
          </div>`).join('')}
        </div>
      </div>
      <p style="margin: 14px 2px 0; font-size: 13px; color: var(--c-dim); line-height: 1.6;">Thomas pulls the numbers and renders them on the canvas — no copy-pasting into a spreadsheet.</p>`;
    }

    // ---------- Tools (AI settings), attachments (+), voice (mic) ----------
    function saveDials() { try { localStorage.setItem('thomas_dials', JSON.stringify(state.dials)); } catch (e) {} }
    const DIAL_FIELDS = [
      { key: 'autonomy', label: 'Autonomy', num: true, opts: [[1, '1 · Chat'], [2, '2 · Assist'], [3, '3 · Agent'], [4, '4 · Full autonomy']] },
      { key: 'effort', label: 'Reasoning effort', opts: [['none', 'None'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['xhigh', 'xHigh'], ['max', 'Max']] },
      { key: 'tokenEconomy', label: 'Token economy', opts: [['cheap', 'Cheap'], ['balanced', 'Balanced'], ['max', 'Max']] },
      { key: 'fileAccess', label: 'File access', opts: [['read_only', 'Read only'], ['workspace', 'Workspace'], ['project', 'Project'], ['pc', 'Full PC'], ['full', 'Full']] },
      { key: 'guardrails', label: 'Guardrails', opts: [['open', 'Open'], ['guarded', 'Guarded'], ['fortress', 'Fortress']] },
    ];
    function renderToolsMenu() {
      const wrap = document.getElementById('tc-tools-menu'); if (!wrap) return;
      wrap.innerHTML = '<div style="font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c-muted);padding:2px 2px 10px;">AI settings</div>';
      DIAL_FIELDS.forEach(f => {
        const row = document.createElement('label');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:13px;';
        const span = document.createElement('span'); span.textContent = f.label; span.style.color = 'var(--c-dim)';
        const sel = document.createElement('select');
        sel.style.cssText = 'flex:0 0 auto;min-width:140px;background:var(--c-surface);color:var(--c-text);border:1px solid var(--c-border);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12.5px;cursor:pointer;';
        f.opts.forEach(([val, lbl]) => { const o = document.createElement('option'); o.value = String(val); o.textContent = lbl; if (String(val) === String(state.dials[f.key])) o.selected = true; sel.appendChild(o); });
        sel.addEventListener('change', () => { state.dials[f.key] = f.num ? parseInt(sel.value, 10) : sel.value; saveDials(); });
        row.appendChild(span); row.appendChild(sel); wrap.appendChild(row);
      });
      const memRow = document.createElement('label');
      memRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;font-size:13px;cursor:pointer;';
      const memSpan = document.createElement('span'); memSpan.textContent = 'Memory'; memSpan.style.color = 'var(--c-dim)';
      const memChk = document.createElement('input'); memChk.type = 'checkbox'; memChk.checked = !!state.dials.memory; memChk.style.cssText = 'width:16px;height:16px;cursor:pointer;accent-color:var(--c-accent);';
      memChk.addEventListener('change', () => { state.dials.memory = memChk.checked; saveDials(); });
      memRow.appendChild(memSpan); memRow.appendChild(memChk); wrap.appendChild(memRow);
    }
    function toggleToolsMenu() {
      state.toolsMenuOpen = !state.toolsMenuOpen;
      const m = document.getElementById('tc-tools-menu');
      m.style.display = state.toolsMenuOpen ? 'block' : 'none';
      if (state.toolsMenuOpen) renderToolsMenu();
    }
    function closeToolsMenu() { state.toolsMenuOpen = false; const m = document.getElementById('tc-tools-menu'); if (m) m.style.display = 'none'; }

    function readFile(file) {
      return new Promise(res => {
        const r = new FileReader();
        if (/^image\//.test(file.type)) { r.onload = () => res({ kind: 'image', data_url: r.result, name: file.name }); r.onerror = () => res(null); r.readAsDataURL(file); }
        else { r.onload = () => res({ kind: 'doc', name: file.name, text: String(r.result || '') }); r.onerror = () => res(null); r.readAsText(file); }
      });
    }
    async function onFiles(fileList) {
      const files = Array.from(fileList || []);
      for (const f of files) { const a = await readFile(f); if (!a) continue; if (a.kind === 'image') state.images.push({ data_url: a.data_url, name: a.name }); else state.docs.push({ name: a.name, text: a.text }); }
      renderAttachments();
    }
    function renderAttachments() {
      const row = document.getElementById('tc-attach-row'); if (!row) return;
      const items = state.docs.map((d, i) => ({ type: 'doc', i, name: d.name })).concat(state.images.map((im, i) => ({ type: 'img', i, name: im.name })));
      if (!items.length) { row.style.display = 'none'; row.innerHTML = ''; return; }
      row.style.display = 'flex'; row.innerHTML = '';
      items.forEach(it => {
        const chip = document.createElement('span');
        chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--c-surface-2);border:1px solid var(--c-border);font-size:12px;color:var(--c-text);max-width:200px;';
        chip.innerHTML = '<i class="ph ' + (it.type === 'img' ? 'ph-image' : 'ph-file-text') + '" style="font-size:13px;color:var(--c-accent);"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(it.name) + '</span>';
        const x = document.createElement('button'); x.innerHTML = '<i class="ph ph-x" style="font-size:12px;"></i>'; x.style.cssText = 'border:0;background:transparent;color:var(--c-muted);cursor:pointer;padding:0;display:flex;';
        x.addEventListener('click', () => { if (it.type === 'doc') state.docs.splice(it.i, 1); else state.images.splice(it.i, 1); renderAttachments(); });
        chip.appendChild(x); row.appendChild(chip);
      });
    }

    let recognition = null;
    function setupMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const btn = document.getElementById('tc-mic-btn'); if (!btn) return;
      if (!SR) { btn.title = 'Voice input not supported in this browser'; btn.style.opacity = '0.45'; return; }
      // Continuous listening: stays on through pauses, stops only after ~5s of
      // silence (or a manual click). No auto cut-off mid-sentence.
      recognition = new SR(); recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
      const SILENCE_MS = 5000;
      let base = '', finalChunk = '', silenceTimer = null, stopRequested = false;
      function micOn() { btn.style.color = 'var(--c-accent-ink)'; btn.style.background = 'var(--c-accent)'; btn.title = 'Listening… (stops after a pause)'; }
      function micOff() { btn.style.color = 'var(--c-dim)'; btn.style.background = 'transparent'; btn.title = 'Voice input'; }
      function resetSilence() { if (silenceTimer) clearTimeout(silenceTimer); silenceTimer = setTimeout(() => { stopRequested = true; try { recognition.stop(); } catch (e) {} }, SILENCE_MS); }
      recognition.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalChunk += r[0].transcript; else interim += r[0].transcript; }
        const combined = ((base ? base + ' ' : '') + finalChunk + interim).replace(/\s+/g, ' ').replace(/^\s+/, '');
        state.input = combined; inputEl.value = combined; autosize(); syncDynamic();
        resetSilence();
      };
      recognition.onerror = () => { /* keep listening; onend handles restart */ };
      recognition.onend = () => {
        if (state.listening && !stopRequested) { try { recognition.start(); return; } catch (e) {} }
        state.listening = false; if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; } micOff();
      };
      btn.addEventListener('click', () => {
        if (state.listening) { stopRequested = true; try { recognition.stop(); } catch (e) {} return; }
        base = state.input.trim(); finalChunk = ''; stopRequested = false; state.listening = true; micOn();
        try { recognition.start(); resetSilence(); } catch (e) { state.listening = false; micOff(); }
      });
    }

    // ---------- Wire up ----------
    inputEl.addEventListener('input', e => { state.input = e.target.value; autosize(); syncDynamic(); });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    document.getElementById('tc-send').addEventListener('click', () => {
      const unified = window.ThomasUnifiedModes;
      if (unified && unified.mode() !== 'chat' && unified.stop()) return;
      if (state.streaming) { if (abortController) { try { abortController.abort(); } catch (e) {} } }
      else { send(); }
    });
    document.getElementById('tc-search').addEventListener('input', e => { state.search = e.target.value; renderChats(); });
    document.getElementById('tc-newchat').addEventListener('click', newChat);
    document.getElementById('tc-newchat-top').addEventListener('click', newChat);
    document.getElementById('tc-sidebar-toggle').addEventListener('click', toggleSidebar);
    document.getElementById('tc-settings').addEventListener('click', () => openWorkspace('settings'));
    document.getElementById('tc-canvas-btn').addEventListener('click', () => {
      if (state.workspaceOpen && window.ThomasWorkspaceChat) window.ThomasWorkspaceChat.toggle();
      else openWorkspace('app_builder');
    });
    document.getElementById('tc-canvas-close').addEventListener('click', closeCanvas);
    document.getElementById('tc-theme-btn').addEventListener('click', toggleThemeMenu);
    document.getElementById('tc-model-btn').addEventListener('click', toggleModelMenu);
    document.getElementById('tc-tools-btn').addEventListener('click', toggleToolsMenu);
    document.getElementById('tc-code-project-btn').addEventListener('click', () => {
      if (window.ThomasUnifiedModes) window.ThomasUnifiedModes.pickProject();
    });
    document.getElementById('tc-attach-btn').addEventListener('click', () => document.getElementById('tc-file-input').click());
    document.getElementById('tc-file-input').addEventListener('change', (e) => { onFiles(e.target.files); e.target.value = ''; });
    document.addEventListener('mousedown', e => {
      if (state.themeMenuOpen && !e.target.closest('[data-theme-switch]')) { state.themeMenuOpen = false; document.getElementById('tc-theme-menu').style.display = 'none'; }
      if (state.modelMenuOpen && !e.target.closest('[data-model-switch]')) { closeModelMenu(); }
      if (state.toolsMenuOpen && !e.target.closest('[data-tools-wrap]')) { closeToolsMenu(); }
    });

    // ---------- Boot: pull live model + chats + session from the backend ----------
    function mapRealMessages(list) {
      return (Array.isArray(list) ? list : []).map(m => ({
        role: (m.role === 'assistant' ? 'assistant' : 'user'),
        text: String(m.content != null ? m.content : (m.text || '')),
        model: (m.role === 'assistant' ? (state.modelLabel || 'GPT-5.6 Sol') : ''),
      }));
    }
    // Pull the real recent-chat list (legacy store + live v2 sessions) into the sidebar.
    // Called on boot AND after each turn so a brand-new chat shows up in Recent without
    // a reload, with its real title + date. (chat history fix, 2026-06-28)
    async function refreshChats() {
      try {
        const r = await fetch('/api/chats?mode=chat');
        if (!r.ok) return;
        const d = await r.json();
        const rows = d.chats || (d.data && d.data.chats) || [];
        if (!Array.isArray(rows)) return;
        const active = state.activeChat;
        chatList = rows.map(row => {
          const msgs = mapRealMessages(row.messages);
          const firstUser = msgs.find(m => m.role === 'user');
          return { id: String(row.id || row.session_id || ''), title: String(row.title || 'Untitled chat'), preview: String(row.preview || (firstUser ? firstUser.text : '')).slice(0, 60), msgs, sessionId: row.sessionId || row.session_id || null, surfaceMode: String(row.surfaceMode || 'chat'), contextId: String(row.contextId || ''), updatedAt: Number(row.updatedAt || row.createdAt || 0) };
        }).filter(c => c.id);
        state.activeChat = active;
        renderChats();
      } catch (e) {}
    }
    async function boot() {
      // live model → header pill + send payload
      try {
        const r = await fetch('/api/models');
        if (r.ok) {
          const d = await r.json();
          profilesData = Array.isArray(d.profiles) ? d.profiles : [];
          await hydrateProfileModels();
          const prefs = d.preferences || {};
          const active = String(prefs.active_profile || d.default || '').trim().toLowerCase();
          const usable = (p) => !!p && (!!p.has_api_key || p.provider === 'openai_codex' || p.name === 'local');
          // Prefer the configured active profile; if it isn't usable (e.g. a keyless
          // cloud provider, or an unreachable local), fall back to the first profile
          // that can actually answer. Profile names are case-insensitive because the
          // preferences API historically returned display-cased values such as "Local".
          let pick = profilesData.find(p => String(p.name || '').trim().toLowerCase() === active);
          if (!usable(pick)) pick = profilesData.find(usable) || profilesData[0];
          if (pick) setProfile(pick);
          renderModelMenu();
        }
      } catch (e) {}
      // real recent chats → sidebar
      await refreshChats();
      // fresh session id for this tab
      try {
        const r = await fetch('/api/session/new', { method: 'POST' });
        if (r.ok) { const d = await r.json(); state.sessionId = d.session_id || (d.data && d.data.session_id) || state.sessionId; }
      } catch (e) {}
    }

    function modeChanged(nextMode) {
      state.surfaceMode = nextMode;
      state.search = '';
      const search = document.getElementById('tc-search'); if (search) search.value = '';
      showChat();
      if (nextMode !== 'chat') resetCanvasForConversation();
      const projectButton = document.getElementById('tc-code-project-btn');
      if (projectButton) {
        projectButton.hidden = nextMode !== 'code';
        projectButton.style.display = nextMode === 'code' ? 'inline-flex' : 'none';
      }
      renderChats();
      syncDynamic();
    }
    function setExternalBusy() {
      if (window.ThomasUnifiedModes && window.ThomasUnifiedModes.refreshChrome) window.ThomasUnifiedModes.refreshChrome();
      syncDynamic();
    }
    function announceModeStatus(message) {
      const surface = document.getElementById('tc-mode-surface');
      if (surface) surface.setAttribute('aria-label', String(message || 'Mode workspace'));
    }
    if (window.ThomasUnifiedModes) {
      window.ThomasUnifiedModes.connect({
        announce: announceModeStatus,
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, dials: Object.assign({}, state.dials) }),
        isBusy: () => !!state.streaming,
        modeChanged,
        renderHistory: renderChats,
        setBusy: setExternalBusy,
      });
    }
    if (window.ThomasWorkspaceChat) {
      window.ThomasWorkspaceChat.connect({
        getContext: () => ({ profile: state.profile, modelId: state.modelId, modelLabel: state.modelLabel, dials: Object.assign({}, state.dials) }),
      });
    }

    // ---------- Init ----------
    hydrateBots();
    renderChats();
    renderWorkspaces();
    renderCards();
    renderThemeMenu();
    applyTheme(state.theme);
    syncView();
    syncDynamic();
    autosize();
    setupMic();
    renderAttachments();
    boot();
  })();
  </script>
</body>
