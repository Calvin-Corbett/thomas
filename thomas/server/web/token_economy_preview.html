<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Economy — Thomas Preview</title>
<link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/token_economy.css">
<style>
    /* Simulate Thomas app shell for preview */
    body { margin: 0; background: var(--bg-app); color: var(--text-primary); font-family: var(--font-sans); }
    .preview-shell { display: flex; height: 100vh; }
    .preview-sidebar { width: 220px; background: rgba(17,20,26,0.92); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; }
    .preview-sidebar h2 { font-size: 14px; margin: 0 0 16px 4px; color: var(--text-primary); }
    .preview-nav { padding: 6px 10px; border-radius: 4px; font-size: 12px; color: var(--text-muted); cursor: pointer; border: none; background: none; text-align: left; font-family: var(--font-sans); display: flex; align-items: center; gap: 8px; }
    .preview-nav:hover { background: rgba(255,255,255,0.04); color: var(--text-secondary); }
    .preview-nav.active { background: rgba(88,166,255,0.08); color: var(--accent); }
    .preview-main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .t-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border-light); background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; }
    .t-btn-ghost { border-color: transparent; }
    .t-btn-ghost:hover { background: rgba(162,191,233,0.08); }
</style>
</head>
<body>
<div class="preview-shell">
    <div class="preview-sidebar">
        <h2>Thomas</h2>
        <button class="preview-nav"><i class="ph ph-chat-circle"></i> Chat</button>
        <button class="preview-nav"><i class="ph ph-crosshair-simple"></i> Mission Control</button>
        <button class="preview-nav"><i class="ph ph-grid-four"></i> My Stuff</button>
        <button class="preview-nav"><i class="ph ph-broadcast"></i> Channels</button>
        <button class="preview-nav active"><i class="ph ph-coins"></i> Token Economy</button>
        <button class="preview-nav"><i class="ph ph-storefront"></i> Marketplace</button>
    </div>
    <div class="preview-main" id="teMount"></div>
</div>

<script>
// Mock data for preview
const MOCK_TODAY = {
    total_usd: 3.47,
    call_count: 142,
    by_model: { 'claude-sonnet-4-6': 2.18, 'gpt-4o': 0.89, 'claude-haiku-4-5': 0.40 },
    by_model_detail: {
        'claude-sonnet-4-6': { usd: 2.18, calls: 62, tokens: { prompt: 486200, completion: 124800, total: 611000 } },
        'gpt-4o': { usd: 0.89, calls: 48, tokens: { prompt: 198400, completion: 67200, total: 265600 } },
        'claude-haiku-4-5': { usd: 0.40, calls: 32, tokens: { prompt: 312000, completion: 88000, total: 400000 } },
    },
    tokens: { prompt: 996600, completion: 280000, total: 1276600 },
};

const MOCK_SESSION = {
    total_usd: 1.23,
    call_count: 47,
    tokens: { prompt: 342000, completion: 94000, total: 436000 },
};

const MOCK_HISTORY = [
    { date: '2026-03-31', usd: 3.47 },
    { date: '2026-03-30', usd: 7.82 },
    { date: '2026-03-29', usd: 2.14 },
    { date: '2026-03-28', usd: 12.30 },
    { date: '2026-03-27', usd: 4.56 },
    { date: '2026-03-26', usd: 1.89 },
    { date: '2026-03-25', usd: 22.41 },
];

const MOCK_PRICING = {
    'claude-sonnet-4-6': { prompt_per_1m: 3.00, completion_per_1m: 15.00 },
    'claude-opus-4-6': { prompt_per_1m: 15.00, completion_per_1m: 75.00 },
    'claude-haiku-4-5': { prompt_per_1m: 0.80, completion_per_1m: 4.00 },
    'gpt-4o': { prompt_per_1m: 2.50, completion_per_1m: 10.00 },
    'gpt-4o-mini': { prompt_per_1m: 0.15, completion_per_1m: 0.60 },
};

// Override fetch to serve mock data
const _realFetch = window.fetch;
window.fetch = async function(url, opts) {
    const u = String(url);
    if (u.includes('/api/spend/today')) return new Response(JSON.stringify(MOCK_TODAY));
    if (u.includes('/api/spend/session')) return new Response(JSON.stringify(MOCK_SESSION));
    if (u.includes('/api/spend/history')) return new Response(JSON.stringify(MOCK_HISTORY));
    if (u.includes('/api/spend/pricing')) return new Response(JSON.stringify({ pricing: MOCK_PRICING }));
    if (u.includes('/api/preferences')) return new Response(JSON.stringify({ advanced: { runtime: { default_token_economy: 'optimal' } } }));
    if (u.includes('/api/spend/stream')) return new Response('', { status: 503 });
    return _realFetch(url, opts);
};

// Override EventSource so SSE doesn't error
window.EventSource = class { addEventListener() {} close() {} set onerror(fn) {} };

function safeString(v) { return String(v || ''); }
</script>
<script src="/static/js/token_economy.js"></script>
<script>
    window.__tokenEconomy.mount(document.getElementById('teMount'));

    // Simulate a few live feed events after load
    setTimeout(() => {
        const fakeEvents = [
            { ts: '2026-03-31T14:22:18Z', model: 'claude-sonnet-4-6', prompt_tokens: 3200, completion_tokens: 890, usd_total: 0.023 },
            { ts: '2026-03-31T14:22:14Z', model: 'gpt-4o', prompt_tokens: 1800, completion_tokens: 420, usd_total: 0.009 },
            { ts: '2026-03-31T14:22:08Z', model: 'claude-haiku-4-5', prompt_tokens: 8400, completion_tokens: 2100, usd_total: 0.015 },
            { ts: '2026-03-31T14:21:59Z', model: 'claude-sonnet-4-6', prompt_tokens: 5600, completion_tokens: 1240, usd_total: 0.035 },
            { ts: '2026-03-31T14:21:42Z', model: 'gpt-4o', prompt_tokens: 2200, completion_tokens: 680, usd_total: 0.012 },
        ];
        const feed = document.querySelector('[data-te-feed]');
        const count = document.querySelector('[data-te-fcount]');
        if (feed) {
            feed.innerHTML = fakeEvents.map(ev => {
                const t = ev.ts.split('T')[1].substring(0, 8);
                const tokens = ev.prompt_tokens + ev.completion_tokens;
                const tokStr = tokens >= 1000 ? (tokens/1000).toFixed(1) + 'K' : String(tokens);
                return `<div class="te-frow"><span class="te-ftime">${t}</span><span class="te-fmodel">${ev.model}</span><span class="te-ftok">${tokStr}</span><span class="te-fusd">$${ev.usd_total.toFixed(3)}</span></div>`;
            }).join('');
            if (count) count.textContent = fakeEvents.length + ' events';
        }
    }, 500);
</script>
</body>
</html>
