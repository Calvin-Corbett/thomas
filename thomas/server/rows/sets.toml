# Ready-made sets of plugins and the groups the long list is shown under. Read by thomas/server/rows/plugin_sets.py.
# Every plugin id in default.toml must be in exactly one group, and every id named here must exist: tests hold both.
# A set names the plugins it leaves on. Applying it turns off every other plugin that can be turned off.

[[set]]
id = "everyday"
title = "Everyday"
about = "Chat, Build and the things you reach for most days: your schedules, search, the Marketplace, saved sessions and the pages in the sidebar, including the Virtual Office and Agents."
rows = [
  "chat", "build", "work", "models", "openai_codex", "secrets", "setup", "onboarding", "search", "spend",
  "cooldown_and_logs", "schedules", "catalog", "media", "canvas_studio", "chat_titles", "chat_export",
  "chat_feedback", "workspace", "overlay", "browser", "notifications", "project_queue", "project_change",
  "issues", "plugin_sets", "praxis", "office_state", "system_map", "agents", "pause", "contributors",
]

[[set]]
id = "just_chat_and_build"
title = "Just chat and build"
about = "The smallest set that still works: Chat, Build with the parts a Build run needs (its team helpers and your library of projects), choosing a model and signing in. Everything else is turned off."
rows = ["chat", "build", "praxis", "workspace", "models", "openai_codex", "secrets", "setup", "plugin_sets", "pause"]

