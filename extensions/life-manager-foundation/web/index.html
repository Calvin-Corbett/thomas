<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Manager Foundation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe4;
      --panel: #fffdf8;
      --ink: #1b1b18;
      --muted: #726d62;
      --accent: #3b7a57;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #f9f4ea, var(--bg));
      color: var(--ink);
    }
    main {
      width: min(640px, calc(100vw - 48px));
      padding: 32px;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 48px rgba(27, 27, 24, 0.08);
    }
    span {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59, 122, 87, 0.12);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 16px 0 10px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <span>Support Component</span>
    <h1>Life Manager Foundation Installed</h1>
    <p>This dependency powers shared install and bootstrap flows for Life Manager. It does not create a workspace tab on its own.</p>
  </main>
</body>
</html>
